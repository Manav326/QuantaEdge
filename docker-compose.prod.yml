services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - quantaedge_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - quantaedge_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/${QUANTAEDGE_GHCR_OWNER}/quantaedge-api:${QUANTAEDGE_IMAGE_TAG}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_DEMO_SEED: "false"
      APP_ADMIN_CONTENT_TOKEN: ${QUANTAEDGE_ADMIN_TOKEN:-}
      APP_AUTH_ADMIN_MOBILES: ${APP_AUTH_ADMIN_MOBILES:-7070107483}
      APP_AUTH_SESSION_HOURS: ${APP_AUTH_SESSION_HOURS:-168}
      APP_AUTH_SECURE_COOKIES: ${APP_AUTH_SECURE_COOKIES:-true}
      APP_AUTH_OTP_COOLDOWN_SECONDS: ${APP_AUTH_OTP_COOLDOWN_SECONDS:-60}
      APP_AUTH_ALLOW_REPEATED_DEMO_OTP: "false"
      APP_OTP_PROVIDER_URL: ${APP_OTP_PROVIDER_URL:-}
      APP_OTP_PROVIDER_TOKEN: ${APP_OTP_PROVIDER_TOKEN:-}
      APP_AI_TUTOR_ENABLED: ${APP_AI_TUTOR_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_AI_TUTOR_MODEL: ${APP_AI_TUTOR_MODEL:-gpt-5.6-luna}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ghcr.io/${QUANTAEDGE_GHCR_OWNER}/quantaedge-web:${QUANTAEDGE_IMAGE_TAG}
    environment:
      BACKEND_INTERNAL_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - api

  admin:
    image: ghcr.io/${QUANTAEDGE_GHCR_OWNER}/quantaedge-admin:${QUANTAEDGE_IMAGE_TAG}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  quantaedge_postgres:
  quantaedge_redis:
