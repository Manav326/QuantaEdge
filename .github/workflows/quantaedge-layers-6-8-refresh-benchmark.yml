name: Refresh saved Ollama benchmark against current lesson contract

on:
  push:
    branches: ["main"]
    paths:
      - "data/textbook-content-pipeline/model-benchmarks/class-6-ncert-curiosity.v1.json"

permissions:
  contents: write

concurrency:
  group: qe-refresh-local-benchmark-contract
  cancel-in-progress: false

jobs:
  refresh:
    name: Revalidate benchmark samples without inference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate code and tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/quantaedge_layers_6_8.py
          python -m unittest discover -s tests -p "test_quantaedge_layers_6_8.py" -v
      - name: Refresh samples without additional model calls
        run: |
          set -euo pipefail
          python scripts/quantaedge_layers_6_8.py refresh-benchmark \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-book-id ncert-c6-english-fecu1 \
            --output data/textbook-content-pipeline/model-benchmarks/class-6-ncert-curiosity.v1.json \
            --commit-checkpoints
