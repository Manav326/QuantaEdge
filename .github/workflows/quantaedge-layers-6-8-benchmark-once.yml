name: QuantaEdge Layers 6-8 initial Ollama benchmark (one-time bootstrap)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/quantaedge-layers-6-8-benchmark-once.yml"

permissions:
  contents: write

concurrency:
  group: qe-layers-6-8-initial-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark local Ollama against Class 6 NCERT Curiosity
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main and permit durable report checkpoint
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate code and data contracts before spending runner time
        run: |
          set -euo pipefail
          python -m py_compile scripts/quantaedge_layers_6_8.py scripts/ai_training_dataset.py
          python -m unittest discover -s tests -p "test_quantaedge_layers_6_8.py" -v
          python -m unittest discover -s tests -p "test_ai_training_dataset.py" -v
      - name: Start native Ollama bound to runner loopback
        shell: bash
        run: |
          set -euo pipefail
          docker pull ollama/ollama:latest
          docker volume create quantaedge-initial-benchmark-models >/dev/null
          docker run -d --name quantaedge-initial-benchmark-ollama \
            -p 127.0.0.1:11434:11434 \
            -v quantaedge-initial-benchmark-models:/root/.ollama \
            ollama/ollama:latest
          ready=false
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then ready=true; break; fi
            sleep 2
          done
          [[ "$ready" == true ]] || { docker logs quantaedge-initial-benchmark-ollama; exit 1; }
      - name: Pull only the two bounded benchmark candidates
        shell: bash
        run: |
          set -euo pipefail
          docker exec quantaedge-initial-benchmark-ollama ollama pull qwen2.5:1.5b
          docker exec quantaedge-initial-benchmark-ollama ollama pull qwen2.5:3b
      - name: Benchmark identical source segments and save the report to main
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quantaedge_layers_6_8.py benchmark \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-book-id ncert-c6-english-fecu1 \
            --endpoint http://127.0.0.1:11434 \
            --models qwen2.5:1.5b,qwen2.5:3b \
            --sample-segments 2 \
            --request-timeout 360 \
            --output data/textbook-content-pipeline/model-benchmarks/class-6-ncert-curiosity.v1.json \
            --commit-checkpoints
      - name: Summarize actual sample quality and latency
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/textbook-content-pipeline/model-benchmarks/class-6-ncert-curiosity.v1.json")
          if not path.is_file():
              print("No benchmark report was produced; inspect preceding failed step logs.")
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          print("Report:", path)
          print("Source:", report.get("source", {}).get("book_id"), report.get("source", {}).get("source_pdf_sha256"))
          print("Production model remains:", report.get("production_model_selection"), report.get("production_model"))
          for row in report.get("models", []):
              print(json.dumps({
                  "model": row.get("model"),
                  "successful_samples": row.get("successful_samples"),
                  "schema_valid_rate": row.get("schema_valid_rate"),
                  "lesson_contract_valid_rate": row.get("lesson_contract_valid_rate"),
                  "source_page_citation_valid_rate": row.get("source_page_citation_valid_rate"),
                  "sft_examples_valid_rate": row.get("sft_examples_valid_rate"),
                  "average_seconds_per_sample": row.get("average_seconds_per_sample"),
                  "sample_segments": [s.get("segment_id") for s in row.get("samples", [])],
              }, indent=2))
          PY
          docker logs --tail 80 quantaedge-initial-benchmark-ollama 2>/dev/null || true
      - name: Stop Ollama service
        if: always()
        run: docker rm -f quantaedge-initial-benchmark-ollama >/dev/null 2>&1 || true
