name: Inspect TRE source archive

on:
  pull_request:
    branches: [main]
    paths:
      - "data/TRE-4_PYQ.zip"
      - "scripts/inspect_tre_source_archive.py"
      - "scripts/extract_tre_source_questions.py"
      - ".github/workflows/tre-source-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    name: Extract and audit TRE source papers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the same-repository working branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out the uploaded ZIP from main as source-only input
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: source-data
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract Hindi OCR data for SHREE-DEV source prompts
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin

      - name: Install deterministic PDF and legacy-Hindi text tools
        run: python -m pip install --disable-pip-version-check "pymupdf>=1.26,<3" "lipi-aparsoft==1.0.9"

      - name: Inspect the uploaded archive and record exact source bytes
        run: |
          python scripts/inspect_tre_source_archive.py \
            --archive "$GITHUB_WORKSPACE/source-data/data/TRE-4_PYQ.zip" \
            --output-dir "$RUNNER_TEMP/tre-source-inspection"

      - name: Extract bilingual question inventory with page provenance
        run: |
          python scripts/extract_tre_source_questions.py \
            --archive "$GITHUB_WORKSPACE/source-data/data/TRE-4_PYQ.zip" \
            --output-dir "$RUNNER_TEMP/tre-question-inventory" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Assert full paper counts and a known Hindi reconstruction
        run: |
          python - <<'PY'
          import json, re
          import os
          from pathlib import Path
          inventory_path = Path(os.environ["RUNNER_TEMP"]) / "tre-question-inventory" / "tre-question-inventory.json"
          inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          expected_counts = {"TRE 1.0": 120, "TRE 2.0": 150, "TRE 3.0": 150}
          for cycle, expected in expected_counts.items():
              actual = len(inventory["papers"][cycle]["questions"])
              if actual != expected:
                  raise SystemExit(f"{cycle}: expected {expected} questions, got {actual}")
          q1 = next(q for q in inventory["papers"]["TRE 1.0"]["questions"] if str(q["source_question_number"]) == "1")
          hindi = q1["source_variants"]["hi"]
          normalized = re.sub(r"\s+", " ", hindi.get("prompt_i18n", "")).strip()
          expected_prompt = "तीन अंकों की कितनी संख्याएँ 5 से विभाज्य हैं?"
          if normalized != expected_prompt:
              raise SystemExit(f"TRE 1.0 Hindi Q1 OCR mismatch: {normalized!r}")
          if hindi.get("prompt_ocr_status") != "OCR_SHREEDEV_RECONSTRUCTED_REQUIRES_HUMAN_REVIEW":
              raise SystemExit("Known Hindi prompt was not marked as an OCR reconstruction requiring human review")
          if not hindi.get("prompt_raw") or hindi.get("prompt_raw") == hindi.get("prompt_i18n"):
              raise SystemExit("Original legacy Hindi source text was not retained alongside the OCR reconstruction")
          tre3_h9 = next(q for q in inventory["papers"]["TRE 3.0"]["questions"] if str(q["source_question_number"]) == "H-9")
          h9 = tre3_h9["source_variants"]["hi"]
          if h9.get("prompt_ocr_status") != "OCR_SHREEDEV_RECONSTRUCTED_REQUIRES_HUMAN_REVIEW":
              raise SystemExit("TRE 3.0 H-9 Hindi legacy/CIDFont stem was not reconstructed")
          if len(re.findall(r"[\u0900-\u097F]", h9.get("prompt_i18n", ""))) < 4:
              raise SystemExit("TRE 3.0 H-9 still contains unreadable legacy Hindi text")
          print("TRE question counts and TRE1/TRE3 Hindi OCR checks passed; OCR content remains review-gated.")
          PY

      - name: Upload temporary inventory for question and answer review
        uses: actions/upload-artifact@v4
        with:
          name: tre-source-review-inventory
          path: |
            ${{ runner.temp }}/tre-source-inspection/
            ${{ runner.temp }}/tre-question-inventory/
          if-no-files-found: error
          retention-days: 3
