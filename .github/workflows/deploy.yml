name: QuantaEdge Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to deploy"
        required: true
        default: "main"

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy immutable release
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.QUANTAEDGE_DEPLOY_HOST }}
          username: ${{ secrets.QUANTAEDGE_DEPLOY_USER }}
          key: ${{ secrets.QUANTAEDGE_DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd /opt/quantaedge
            export QUANTAEDGE_GHCR_OWNER="${{ github.repository_owner }}"
            export QUANTAEDGE_GHCR_TOKEN="${{ secrets.QUANTAEDGE_GHCR_TOKEN }}"
            bash scripts/quantaedge-deploy.sh "${{ inputs.ref }}"
