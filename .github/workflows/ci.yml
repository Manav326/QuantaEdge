name: QuantaEdge Build and Publish

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: quantaedge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      admin: ${{ steps.detect.outputs.admin }}
      content: ${{ steps.detect.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            files="$(git ls-files)"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base="$(git merge-base HEAD "origin/$BASE_REF")"
            files="$(git diff --name-only "$base" HEAD)"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          else
            files="$(git ls-files)"
          fi

          api=false
          web=false
          admin=false
          content=false
          all=false
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qE '^services/api/'; then api=true; fi
          if printf '%s\n' "$files" | grep -qE '^apps/web/'; then web=true; fi
          if printf '%s\n' "$files" | grep -qE '^apps/admin/'; then admin=true; fi
          if printf '%s\n' "$files" | grep -qE '^scripts/|^tests/test_.*\.py$'; then content=true; fi
          if printf '%s\n' "$files" | grep -qE '^docker-compose(\.prod)?\.yml$|^\.github/workflows/'; then all=true; fi
          if [ "$all" = "true" ]; then api=true; web=true; admin=true; content=true; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "content=$content" >> "$GITHUB_OUTPUT"

  validate-content-import:
    name: Content import safeguards
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.content == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate reviewed-content import safeguards
        run: python -m unittest discover -s tests -p "test_*.py" -v

  validate-api:
    name: API verification
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quantaedge
          POSTGRES_USER: quantaedge
          POSTGRES_PASSWORD: quantaedge-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantaedge -d quantaedge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/quantaedge
      SPRING_DATASOURCE_USERNAME: quantaedge
      SPRING_DATASOURCE_PASSWORD: quantaedge-test
      APP_DEMO_SEED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run API tests and verification
        working-directory: services/api
        run: mvn -B -ntp verify

  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    needs: [changes, validate-api]
    if: needs.changes.outputs.api == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantaedge-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantaedge-web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-admin:
    name: Build admin image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantaedge-admin
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build admin
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
; then content=true; fi
          if printf '%s\n' "$files" | grep -qE '^docker-compose(\.prod)?\.yml$|^\.github/workflows/'; then all=true; fi
          if [ "$all" = "true" ]; then api=true; web=true; admin=true; content=true; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
