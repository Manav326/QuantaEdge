name: Android app build (manual fallback)

# Every main commit already builds and uploads the current APK in ci.yml.
# Keep this separate workflow available for an on-demand Android-only build,
# without compiling the same APK twice on every Android-related push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-manual
  cancel-in-progress: true

jobs:
  android:
    name: Compile, unit-test, package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK and run tests
        run: gradle -p apps/android testDebugUnitTest assembleDebug --build-cache --parallel
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-android-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
