name: QuantaEdge GHCR Textbook Extraction Pilot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/textbook-extraction-pilot.yml"
      - "scripts/textbook_registry.py"
      - "scripts/extract_textbook_text.py"
      - "scripts/validate_textbook_extraction_artifacts.py"
      - "scripts/select_textbook_visual_sources.py"
      - "tests/test_extract_textbook_text.py"
      - "tests/test_validate_textbook_extraction_artifacts.py"
      - "tests/test_select_textbook_visual_sources.py"
      - "tests/test_import_ghcr_extracted_pages.py"
  workflow_dispatch:
    inputs:
      class_no:
        description: "Class to extract (both English and Hindi, Science + Maths Parts 1 and 2)"
        type: choice
        options: ["7", "8"]
        default: "7"
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: quantaedge-textbook-extraction-pilot-${{ github.event_name == 'workflow_dispatch' && inputs.class_no || 'all-classes' }}
  cancel-in-progress: false

jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        class_no: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('[{0}]', inputs.class_no)) || fromJSON('[7,8]') }}
    name: Extract selected Class ${{ matrix.class_no }} in English and Hindi
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Test extraction filters and checkpointing
        run: python -m unittest discover -s tests -p 'test_extract_textbook_text.py' -v

      - name: Test safe GHCR page importer
        run: python -m unittest discover -s tests -p 'test_import_ghcr_extracted_pages.py' -v

      - name: Test strict source selection and whole-book integrity
        run: |
          python -m unittest discover -s tests -p 'test_validate_textbook_extraction_artifacts.py' -v
          python -m unittest discover -s tests -p 'test_select_textbook_visual_sources.py' -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull source caches and extract only the selected class's Science and Maths
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          CLASS_NO: ${{ matrix.class_no }}
        run: |
          set -euo pipefail
          [[ "$CLASS_NO" == "7" || "$CLASS_NO" == "8" ]] || { echo "Only Class 7 or Class 8 is supported."; exit 2; }
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          mkdir -p pilot-output/reports
          for medium in hindi english; do
            image="ghcr.io/$owner/quantaedge-textbooks-class-$CLASS_NO-$medium:latest"
            registry_dir="pilot-output/cache/class-$CLASS_NO/$medium"
            prepared_dir="pilot-output/prepared/class-$CLASS_NO/$medium"
            extracted_dir="pilot-output/extracted/class-$CLASS_NO/$medium"

            echo "::group::Pull $image"
            python scripts/textbook_registry.py pull --image "$image" --output-dir "$registry_dir"
            echo "::endgroup::"

            echo "::group::Prepare complete-book extraction inputs ($medium)"
            python scripts/textbook_registry.py prepare-library --registry-dir "$registry_dir" --output-dir "$prepared_dir" --extraction-only
            echo "::endgroup::"

            echo "::group::Extract selected Class $CLASS_NO $medium Maths Parts 1/2 and Science"
            python scripts/extract_textbook_text.py \
              --bundle-dir "$prepared_dir/bundles" \
              --pdf-dir "$prepared_dir/pdfs" \
              --output-dir "$extracted_dir" \
              --class-no "$CLASS_NO" \
              --language "$medium" \
              --subject Mathematics \
              --subject Maths \
              --subject Science \
              --scope SUBJECT_BOOK
            echo "::endgroup::"

            echo "::group::Validate exact required source set, page continuity, hashes and metadata"
            python scripts/validate_textbook_extraction_artifacts.py \
              --registry-index "$registry_dir/index.json" \
              --extraction-dir "$extracted_dir" \
              --class-no "$CLASS_NO" \
              --language "$medium"
            echo "::endgroup::"

            cp "$prepared_dir/prepare-report.json" "pilot-output/reports/class-$CLASS_NO-$medium-prepare-report.json"
            cp "$extracted_dir/extraction-report.json" "pilot-output/reports/class-$CLASS_NO-$medium-extraction-report.json"
          done

      # Artifact names include the class number and source run ID; the mirror workflow
      # automatically validates and commits successful class artifacts back to main.
      - name: Publish extracted page data and reports (not source PDFs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-textbook-extraction-pilot-class-${{ matrix.class_no }}-${{ github.run_id }}
          path: |
            pilot-output/extracted/
            pilot-output/reports/
            pilot-output/cache/class-*/hindi/index.json
            pilot-output/cache/class-*/english/index.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
