name: Prepare textbook visual candidates v3 (additive)

on:
  push:
    paths:
      - ".github/workflows/textbook-visual-candidates-v3.yml"
      - "tests/test_workflow_resume_entrypoints.py"
      - "scripts/plan_textbook_layer45_matrix.py"
      - "tests/test_plan_textbook_layer45_matrix.py"
      - ".github/workflows/textbook-extraction-pilot.yml"
      - "scripts/prepare_visual_candidates_v3.py"
      - "scripts/prepare_visual_candidate_batch.py"
      - "scripts/select_textbook_visual_sources.py"
      - "scripts/validate_textbook_extraction_artifacts.py"
      - "tests/test_prepare_visual_candidates_v3.py"
      - "tests/test_prepare_visual_candidate_batch.py"
      - "tests/test_select_textbook_visual_sources.py"
      - "tests/test_validate_textbook_extraction_artifacts.py"
      - "scripts/build_visual_lesson_attachment_manifest.py"
      - "tests/test_build_visual_lesson_attachment_manifest.py"
      - "tests/test_textbook_visual_end_to_end_contract.py"
      - "scripts/update_visual_catalog_index.py"
      - "tests/test_update_visual_catalog_index.py"
      - "data/textbook-visual-candidates-v3/catalogs/**"
      - "data/textbook-visual-candidates-v3/index.v1.json"
      - "data/textbook-visual-candidates-v3/**"
      - "apps/admin/app/content/page.tsx"
      - "services/api/src/main/java/com/quantaedge/api/AdminContentController.java"
      - "services/api/src/test/java/com/quantaedge/api/AdminContentControllerTest.java"
      - "scripts/extract_visual_asset_inventory.py"
      - "tests/test_extract_visual_asset_inventory.py"
      - "scripts/analyze_visual_inventory_with_ollama.py"
      - "tests/test_analyze_visual_inventory_with_ollama.py"
      - "docs/textbook-pipeline-resume-runbook.md"
      - "scripts/quantaedge_textbook_pipeline.py"
      - "tests/test_quantaedge_textbook_pipeline.py"
      - "data/textbook-content-pipeline/**/visual-analysis-corrections.v1.json"
  workflow_dispatch:
    inputs:
      class_no:
        description: "Prepare candidates for this complete bilingual class source set"
        required: true
        type: choice
        options: ["6", "7", "8"]
        default: "7"
      analysis_mode:
        description: "Prepare only, run Layers 1–5, resume missing Layer 1–3 book checkpoints, or resume Layer 4–5 analysis without rebuilding candidates"
        required: true
        type: choice
        options: ["prepare_only", "analyze_all", "resume_preparation", "resume_layers_4_5"]
        default: "analyze_all"
      vision_model:
        description: "Ollama vision model used in Layer 4"
        required: true
        type: string
        default: "qwen2.5vl:3b"
      checkpoint_batch_size:
        description: "Assets per durable Git/GHCR savepoint; 10 reduces per-batch rebuild overhead while preserving resumability"
        required: true
        type: choice
        options: ["5", "10"]
        default: "10"

  workflow_call:
    inputs:
      class_no:
        description: "Class of the complete bilingual source set"
        required: true
        type: string
      analysis_mode:
        description: "Shared internal execution mode chosen by the dedicated entrypoint"
        required: true
        type: string
      vision_model:
        description: "Exact vision model used for Layer 4 analysis"
        required: true
        type: string
      checkpoint_batch_size:
        description: "Assets between durable checkpoint savepoints"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: textbook-visual-candidates-v3-${{ (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-6]') && '6') || (github.event_name == 'push' && (contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-7]') || contains(github.event.head_commit.message || '', '[analyze-all-visual-layers-4-5-class-7]')) && '7') || (github.event_name == 'push' && (contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-8]') || contains(github.event.head_commit.message || '', '[analyze-all-visual-layers-4-5-class-8]')) && '8') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-7-8]') && 'classes-7-8-resume') || (github.event_name == 'push' && contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-6-8]') && 'classes-6-8-resume') || inputs.class_no || 'validation-only' }}
  # Push recovery markers select the per-class concurrency lane before reusable/manual inputs, so only the matching stale runner is replaced.
  cancel-in-progress: ${{ github.event_name == 'push' && ((contains(github.event.head_commit.message || '', '[cancel-layer45-matrix]') && contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-6-8]')) || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-6]') || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-7]') || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-8]') || contains(github.event.head_commit.message || '', '[analyze-all-visual-layers-4-5-class-7]') || contains(github.event.head_commit.message || '', '[analyze-all-visual-layers-4-5-class-8]')) }}

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'push' &&
        !contains(github.event.head_commit.message || '', '[cancel-layer45-matrix]') &&
        (
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-6]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-7]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-8]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-7-8]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-6-8]') ||
          contains(github.event.head_commit.message || '', '[analyze-all-visual-layers-4-5-class-7]') ||
          contains(github.event.head_commit.message || '', '[analyze-all-visual-layers-4-5-class-8]')
        ))
    name: Plan source-bound Layer 4–5 workers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan_matrix.outputs.matrix }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan one runner per whole book on resume
        id: plan_matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
          INPUT_CLASS_NO: ${{ inputs.class_no || '' }}
          INPUT_ANALYSIS_MODE: ${{ inputs.analysis_mode || '' }}
        run: python scripts/plan_textbook_layer45_matrix.py --github-output "$GITHUB_OUTPUT"

  validate:
    if: github.event_name == 'push' && !(contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-6]') || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-7]') || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-8]') || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-7-8]') || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-6-8]') || contains(github.event.head_commit.message || '', '[analyze-all-visual-layers-4-5-class-7]') || contains(github.event.head_commit.message || '', '[analyze-all-visual-layers-4-5-class-8]'))
    name: Validate additive v3 preparation scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
      - name: Compile preparation and validation scripts
        run: python -m py_compile scripts/extract_visual_asset_inventory.py scripts/prepare_visual_candidates_v3.py scripts/prepare_visual_candidate_batch.py scripts/select_textbook_visual_sources.py scripts/validate_textbook_extraction_artifacts.py scripts/build_visual_lesson_attachment_manifest.py scripts/update_visual_catalog_index.py scripts/plan_textbook_layer45_matrix.py
      - name: Test source selection, extraction integrity and candidate preparation
        run: |
          python -m unittest discover -s tests -p "test_plan_textbook_layer45_matrix.py" -v
          python -m unittest discover -s tests -p "test_select_textbook_visual_sources.py" -v
          python -m unittest discover -s tests -p "test_validate_textbook_extraction_artifacts.py" -v
          python -m unittest discover -s tests -p "test_extract_visual_asset_inventory.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidates_v3.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidate_batch.py" -v
          python -m unittest discover -s tests -p "test_build_visual_lesson_attachment_manifest.py" -v
          python -m unittest discover -s tests -p "test_textbook_visual_end_to_end_contract.py" -v
          python -m unittest discover -s tests -p "test_update_visual_catalog_index.py" -v
          python -m unittest discover -s tests -p "test_analyze_visual_inventory_with_ollama.py" -v
          python -m unittest discover -s tests -p "test_quantaedge_textbook_pipeline.py" -v
          python -m unittest discover -s tests -p "test_workflow_resume_entrypoints.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidate_batch.py" -v

  prepare:
    needs: [plan]
    if: needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]'
    name: Prepare full bilingual Class ${{ matrix.class_no }} candidate set - ${{ matrix.book_slug }}
    outputs:
      yielded: ${{ steps.layer45_run.outputs.yielded || 'false' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLASS_NO: ${{ matrix.class_no || inputs.class_no }}
      BOOK_ID: ${{ matrix.book_id || '' }}
      ANALYSIS_MODE: ${{ inputs.analysis_mode || (github.event_name == 'push' && (contains(github.event.head_commit.message || '', '[analyze-all-visual-layers-4-5-class-7]') || contains(github.event.head_commit.message || '', '[analyze-all-visual-layers-4-5-class-8]')) && 'analyze_all') || (github.event_name == 'push' && (contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-6]') || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-7]') || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-8]') || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-7-8]') || contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-6-8]')) && 'resume_layers_4_5') }}
      VISION_MODEL: ${{ inputs.vision_model || 'qwen2.5vl:3b' }}
      CHECKPOINT_BATCH_SIZE: ${{ inputs.checkpoint_batch_size || '10' }}
      MAX_BATCHES_PER_RUN: 12
    steps:
      - name: Checkout main with write permission for review metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASS_NO" == "6" || "$CLASS_NO" == "7" || "$CLASS_NO" == "8" ]] || { echo "Only Class 6, Class 7 or Class 8 is supported."; exit 2; }
          [[ "$ANALYSIS_MODE" == "prepare_only" || "$ANALYSIS_MODE" == "analyze_all" || "$ANALYSIS_MODE" == "resume_preparation" || "$ANALYSIS_MODE" == "resume_layers_4_5" ]] || { echo "Invalid analysis_mode"; exit 2; }
          [[ -n "$VISION_MODEL" ]] || { echo "vision_model must be non-empty"; exit 2; }
          [[ "$CHECKPOINT_BATCH_SIZE" == "5" || "$CHECKPOINT_BATCH_SIZE" == "10" ]] || { echo "Invalid checkpoint_batch_size"; exit 2; }
          python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
          python -m py_compile scripts/extract_visual_asset_inventory.py scripts/prepare_visual_candidates_v3.py scripts/prepare_visual_candidate_batch.py scripts/select_textbook_visual_sources.py scripts/validate_textbook_extraction_artifacts.py scripts/build_visual_lesson_attachment_manifest.py scripts/update_visual_catalog_index.py scripts/analyze_visual_inventory_with_ollama.py scripts/quantaedge_textbook_pipeline.py
          python -m unittest discover -s tests -p "test_select_textbook_visual_sources.py" -v
          python -m unittest discover -s tests -p "test_validate_textbook_extraction_artifacts.py" -v
          python -m unittest discover -s tests -p "test_extract_visual_asset_inventory.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidates_v3.py" -v
          python -m unittest discover -s tests -p "test_build_visual_lesson_attachment_manifest.py" -v
          python -m unittest discover -s tests -p "test_textbook_visual_end_to_end_contract.py" -v
          python -m unittest discover -s tests -p "test_update_visual_catalog_index.py" -v
          python -m unittest discover -s tests -p "test_quantaedge_textbook_pipeline.py" -v
          python -m unittest discover -s tests -p "test_workflow_resume_entrypoints.py" -v

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Resolve exact sources and verify mirrored extraction manifests
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          BOOK_ID: ${{ matrix.book_id || '' }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          source_root="$RUNNER_TEMP/quantaedge-visual-source"
          mkdir -p "$source_root"
          for medium in english hindi; do
            image="ghcr.io/$owner/quantaedge-textbooks-class-$CLASS_NO-$medium:latest"
            echo "::group::Pull $image"
            docker pull "$image"
            container_id="$(docker create "$image" /__quantaedge_source_index_only)"
            docker cp "$container_id:/index.json" "$source_root/index-$medium.json"
            python scripts/select_textbook_visual_sources.py \
              --index "$source_root/index-$medium.json" \
              --class-no "$CLASS_NO" \
              --language "$medium" \
              --output "$source_root/selected-$medium.json"
            python scripts/validate_textbook_extraction_artifacts.py \
              --registry-index "$source_root/index-$medium.json" \
              --extraction-dir "$GITHUB_WORKSPACE/data/textbook-extractions/class-$CLASS_NO/$medium" \
              --class-no "$CLASS_NO" \
              --language "$medium"
            python - "$container_id" "$source_root/selected-$medium.json" "$source_root" "$GITHUB_WORKSPACE" "$CLASS_NO" "$medium" <<'PY'
          import hashlib, json, os, shutil, subprocess, sys
          from pathlib import Path
          from scripts.validate_textbook_extraction_artifacts import normalize_language, normalize_subject
          container_id, selection_arg, root_arg, repo_arg, class_no, language = sys.argv[1:]
          selection = json.loads(Path(selection_arg).read_text(encoding="utf-8"))
          root = Path(root_arg)
          repo = Path(repo_arg)
          target_book_id = os.environ.get("BOOK_ID", "").strip()
          manifest_dir = repo / "data" / "textbook-extractions" / f"class-{class_no}" / language / "pages"
          if not manifest_dir.is_dir():
              raise SystemExit(f"Committed extracted pages are missing: {manifest_dir}. Run the extraction pilot and mirror its verified artifact first.")
          for source in selection.get("sources", []):
              book_id = source["book_id"]
              if target_book_id and book_id != target_book_id:
                  continue
              book_dir = root / source["book_slug"]
              book_dir.mkdir(parents=True, exist_ok=False)
              pdf_path = book_dir / "source.pdf"
              subprocess.run(["docker", "cp", f"{container_id}:/{source['file']}", str(pdf_path)], check=True)
              digest = hashlib.sha256(pdf_path.read_bytes()).hexdigest()
              if digest != source["sha256"]:
                  raise SystemExit(f"{book_id}: source PDF SHA-256 differs from the selected GHCR index.")
              matches = []
              for manifest_path in manifest_dir.glob("*.manifest.json"):
                  try:
                      value = json.loads(manifest_path.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  if value.get("book_id") == book_id:
                      matches.append((manifest_path, value))
              if len(matches) != 1:
                  raise SystemExit(f"{book_id}: expected one committed source manifest matching this selected source, found {len(matches)}.")
              manifest_path, manifest = matches[0]
              manifest_hash = str(manifest.get("original_book_sha256") or manifest.get("asset_pdf_sha256") or "").lower()
              if manifest_hash != digest:
                  raise SystemExit(f"{book_id}: committed extraction manifest hash does not match the selected whole-book PDF.")
              if normalize_language(manifest.get("language")) != language:
                  raise SystemExit(f"{book_id}: manifest language does not match {language}.")
              if normalize_subject(manifest.get("subject")) != source["subject"]:
                  raise SystemExit(f"{book_id}: manifest subject does not match selected subject {source['subject']}.")
              if manifest.get("scope") != "SUBJECT_BOOK" or manifest.get("content_state") != "DRAFT_EXTRACTION_ONLY_REQUIRES_REVIEW":
                  raise SystemExit(f"{book_id}: expected a whole-book draft-only extraction manifest.")
              page_name = manifest.get("text_jsonl")
              if not isinstance(page_name, str) or Path(page_name).name != page_name or not page_name.endswith(".jsonl"):
                  raise SystemExit(f"{book_id}: unsafe/missing text_jsonl filename in manifest.")
              page_path = manifest_path.parent / page_name
              if not page_path.is_file():
                  raise SystemExit(f"{book_id}: sibling page JSONL is missing.")
              shutil.copy2(manifest_path, book_dir / "source.manifest.json")
              shutil.copy2(page_path, book_dir / page_name)
              source["extraction_manifest_repo_path"] = manifest_path.relative_to(repo).as_posix()
              source["text_jsonl_repo_path"] = page_path.relative_to(repo).as_posix()
              source["text_jsonl_filename"] = page_name
              (book_dir / "source-selection.json").write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(json.dumps({"book_id": book_id, "language": language, "subject": source["subject"], "slug": source["book_slug"], "sha256": digest}))
          # Keep original extraction references for correction-only rebuilds.
          Path(selection_arg).write_text(json.dumps(selection, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          subprocess.run(["docker", "rm", "-f", container_id], check=True)
          PY
            echo "::endgroup::"
          done
          python - "$source_root" "$CLASS_NO" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          grade = int(sys.argv[2])
          all_sources = []
          expected_per_language = 2 if grade == 6 else 3
          for language in ("english", "hindi"):
              value = json.loads((root / f"selected-{language}.json").read_text(encoding="utf-8"))
              if value.get("class") != grade or value.get("language") != language or len(value.get("sources", [])) != expected_per_language:
                  raise SystemExit(f"Invalid source set for Class {grade} {language}; expected {expected_per_language} books.")
              all_sources.extend(value["sources"])
          expected_total = expected_per_language * 2
          if len(all_sources) != expected_total or len({x["book_slug"] for x in all_sources}) != expected_total:
              raise SystemExit(f"Expected {expected_total} unique Class {grade} source books across English and Hindi; found {len(all_sources)}.")
          full_selection = {"class": grade, "sources": all_sources, "publication_allowed": False, "review_required": True}
          (root / "selected-sources-all.json").write_text(json.dumps(full_selection, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          target_book_id = __import__("os").environ.get("BOOK_ID", "").strip()
          if target_book_id:
              selected_sources = [source for source in all_sources if source.get("book_id") == target_book_id]
              if len(selected_sources) != 1:
                  raise SystemExit(f"Worker must select exactly one book_id={target_book_id}; found {len(selected_sources)}.")
          else:
              selected_sources = all_sources
          worker_selection = dict(full_selection, sources=selected_sources)
          (root / "selected-sources.json").write_text(json.dumps(worker_selection, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"class": grade, "full_class_source_count": len(all_sources), "selected_worker_source_count": len(selected_sources), "target_book_id": target_book_id or None, "maths_books_per_language": 1 if grade == 6 else 2, "science_books_per_language": 1, "languages": ["english", "hindi"], "publication_allowed": False}, indent=2))
          PY
          echo "VISUAL_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Install ORAS and authenticate before per-book checkpoint handling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          oras_archive="$RUNNER_TEMP/oras_1.2.0_linux_amd64.tar.gz"
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" \
            -o "$oras_archive"
          tar -xzf "$oras_archive" -C "$RUNNER_TEMP" oras
          sudo install -m 0755 "$RUNNER_TEMP/oras" /usr/local/bin/oras
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Preflight and restore matching Layer 4 checkpoints before loading the vision model
        if: env.ANALYSIS_MODE == 'resume_layers_4_5'
        shell: bash
        env:
          VISION_MODEL: ${{ inputs.vision_model || 'qwen2.5vl:3b' }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          python - "$VISUAL_SOURCE_ROOT/selected-sources.json" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/layer4-resume-checkpoints" "$VISION_MODEL" "ghcr.io/$owner/quantaedge-textbook-visuals" <<'PY'
          import json, re, shutil, subprocess, sys
          from pathlib import Path
          from scripts.prepare_visual_candidate_batch import missing_artifact
          selection_path, repo_arg, temp_arg, model, package = sys.argv[1:]
          repo, temp = Path(repo_arg), Path(temp_arg)
          temp.mkdir(parents=True, exist_ok=True)
          safe_model = re.sub(r"[^A-Za-z0-9._-]", "-", model)
          prompt_version = "visual-analysis-prompt-v2"
          def valid(path, source):
              try:
                  doc = json.loads(path.read_text(encoding="utf-8"))
                  return (doc.get("schema_version") == "quantaedge.visual-analysis.v1"
                      and doc.get("source_book_id") == source["book_id"]
                      and str(doc.get("source_pdf_sha256") or "").lower() == str(source["sha256"]).lower()
                      and doc.get("model") == model
                      and doc.get("prompt_version") == prompt_version
                      and isinstance(doc.get("results"), list))
              except (OSError, json.JSONDecodeError, AttributeError):
                  return False
          selection = json.loads(Path(selection_path).read_text(encoding="utf-8"))
          failures = []
          for source in selection["sources"]:
              slug = source["book_slug"]
              raw = repo / "data" / "textbook-visuals" / slug / f"visual-analysis-{safe_model}.v1.json"
              if raw.is_file() and valid(raw, source):
                  print(json.dumps({"book_id": source["book_id"], "checkpoint": "REUSED_FROM_GIT", "results": len(json.loads(raw.read_text(encoding="utf-8")).get("results", []))}))
                  continue
              raw_was_present = raw.exists()
              index_path = repo / "data" / "textbook-visuals" / slug / "visual-pipeline-index.v1.json"
              prior_index = {}
              if index_path.is_file():
                  try:
                      prior_index = json.loads(index_path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      failures.append({"book_id": source["book_id"], "reason": "committed pipeline index is malformed"})
                      continue
                  if prior_index.get("source_book_id") == source["book_id"] and str(prior_index.get("source_pdf_sha256") or "").lower() != str(source["sha256"]).lower():
                      failures.append({"book_id": source["book_id"], "reason": "source edition differs from prior checkpoint; use analyze_all for a new edition"})
                      continue
              tag = f"layer4-class{selection['class']}-{slug}-{safe_model}-checkpoint"
              pull_dir = temp / slug
              shutil.rmtree(pull_dir, ignore_errors=True)
              pull_dir.mkdir(parents=True, exist_ok=True)
              pull = subprocess.run(["oras", "pull", f"{package}:{tag}", "--output", str(pull_dir)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              candidate = pull_dir / f"visual-analysis-{safe_model}.v1.json"
              if pull.returncode == 0 and candidate.is_file():
                  if not valid(candidate, source):
                      failures.append({"book_id": source["book_id"], "reason": "GHCR checkpoint exists but source/model/prompt fingerprint does not match"})
                      continue
                  raw.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(candidate, raw)
                  print(json.dumps({"book_id": source["book_id"], "checkpoint": "RESTORED_FROM_GHCR", "results": len(json.loads(candidate.read_text(encoding="utf-8")).get("results", []))}))
                  continue
              detail = (pull.stdout or "").strip()[-500:]
              not_found = missing_artifact(detail, f"{package}:{tag}")
              prior_layers = prior_index.get("layers") if isinstance(prior_index.get("layers"), dict) else {}
              prior_analysis_path = prior_index.get("analysis_path")
              expected_raw_path = raw.relative_to(repo).as_posix()
              prior_analysis_started = prior_index.get("source_book_id") == source["book_id"] and (
                  prior_layers.get("4") in {"RUNNING", "CHECKPOINTED", "COMPLETE", "INCOMPLETE"}
                  or prior_analysis_path
              )
              if not raw_was_present and not_found and not prior_analysis_started:
                  print(json.dumps({"book_id": source["book_id"], "checkpoint": "NOT_STARTED", "action": "will analyze this book from the beginning; no prior checkpoint exists"}))
                  continue
              if not raw_was_present and not_found and prior_analysis_started:
                  failures.append({"book_id": source["book_id"], "reason": "prior Layer 4 work is recorded but no checkpoint for the selected model was found", "prior_analysis_path": prior_analysis_path, "requested_analysis_path": expected_raw_path, "action": "resume stopped instead of silently redoing inference; use analyze_all only to deliberately start a new model/edition run"})
                  continue
              failures.append({"book_id": source["book_id"], "reason": "checkpoint exists but is invalid, or GHCR could not be checked safely", "detail": detail})
          if failures:
              print(json.dumps({"resume_preflight": "FAILED", "failures": failures}, indent=2))
              raise SystemExit("Resume stopped before model download: an existing checkpoint is invalid or could not be checked safely. No vision model was downloaded; inspect the source/model/prompt fingerprints or GHCR access.")
          print(json.dumps({"resume_preflight": "PASSED", "book_count": len(selection["sources"]), "model": model, "prompt_version": prompt_version}))
          PY

      - name: Restore each matching Layer 1 inventory bundle or build only missing inventories
        if: env.ANALYSIS_MODE == 'resume_layers_4_5'
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          python - "$VISUAL_SOURCE_ROOT/selected-sources.json" "$VISUAL_SOURCE_ROOT" "$GITHUB_WORKSPACE" "ghcr.io/$owner/quantaedge-textbook-visuals" <<'PY'
          import hashlib, json, shutil, subprocess, sys, tarfile
          from pathlib import Path, PurePosixPath
          from scripts.prepare_visual_candidate_batch import extract_archive, missing_artifact, validate_layer1_bundle
          selection_path, source_root_arg, repo_arg, expected_package = sys.argv[1:]
          selection = json.loads(Path(selection_path).read_text(encoding="utf-8"))
          source_root, repo = Path(source_root_arg), Path(repo_arg)
          def sha(path):
              h=hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024*1024), b""): h.update(chunk)
              return h.hexdigest()
          def validate_inventory(work, source):
              invdir=work/"inventory"
              invpath=invdir/"visual-inventory.v1.json"
              inv=json.loads(invpath.read_text(encoding="utf-8"))
              source_meta=inv.get("source") or {}
              if inv.get("schema_version")!="quantaedge.visual-inventory.v1" or source_meta.get("book_id")!=source["book_id"] or str(source_meta.get("pdf_sha256") or "").lower()!=str(source["sha256"]).lower():
                  raise SystemExit(f"{source['book_slug']}: restored inventory identity/schema mismatch.")
              text_path=work/source["text_jsonl_filename"]
              if not text_path.is_file():
                  raise SystemExit(f"{source['book_slug']}: current source page JSONL is missing; cannot verify saved inventory context.")
              page_text_hashes={}
              with text_path.open(encoding="utf-8") as stream:
                  for line_no,line in enumerate(stream,1):
                      if not line.strip(): continue
                      try: row=json.loads(line)
                      except json.JSONDecodeError as exc: raise SystemExit(f"{source['book_slug']}: malformed page JSONL line {line_no}.") from exc
                      number=row.get("source_book_page_number",row.get("source_pdf_page_number"))
                      text=row.get("text")
                      if not isinstance(number,int) or isinstance(number,bool) or number<1 or not isinstance(text,str) or number in page_text_hashes:
                          raise SystemExit(f"{source['book_slug']}: page JSONL has an invalid/duplicate page identity at line {line_no}.")
                      page_text_hashes[number]=hashlib.sha256(text.encode("utf-8")).hexdigest()
              assets=inv.get("assets")
              if not isinstance(assets,list): raise SystemExit(f"{source['book_slug']}: inventory assets are malformed.")
              seen=set()
              for asset in assets:
                  if not isinstance(asset,dict): raise SystemExit(f"{source['book_slug']}: invalid inventory asset row.")
                  aid=asset.get("asset_id")
                  if not isinstance(aid,str) or not aid or aid in seen: raise SystemExit(f"{source['book_slug']}: missing/duplicate inventory asset ID.")
                  seen.add(aid)
                  if asset.get("kind") not in {"embedded_image","page_preview"}: continue
                  page_number=asset.get("source_pdf_page_number")
                  if page_number not in page_text_hashes or asset.get("page_text_sha256")!=page_text_hashes[page_number]:
                      raise SystemExit(f"{source['book_slug']}: extracted text changed or is unverifiable for visual {aid}; saved Layer 4 context cannot be resumed safely. Use analyze_all to rebuild the affected inventory/analysis.")
                  rel=asset.get("asset_path")
                  if not isinstance(rel,str) or not rel: raise SystemExit(f"{source['book_slug']}: eligible asset path missing.")
                  target=(invdir/rel).resolve()
                  if invdir.resolve() not in target.parents or not target.is_file(): raise SystemExit(f"{source['book_slug']}: unsafe/missing restored asset {rel!r}.")
                  if sha(target)!=asset.get("asset_sha256"): raise SystemExit(f"{source['book_slug']}: restored asset SHA-256 mismatch for {aid}.")
              return inv
          for source in selection["sources"]:
              slug=source["book_slug"]; work=source_root/slug
              invdir=work/"inventory"
              repo_index=repo/"data"/"textbook-visuals"/slug/"visual-pipeline-index.v1.json"
              prior=None
              if repo_index.is_file():
                  try: prior=json.loads(repo_index.read_text(encoding="utf-8"))
                  except json.JSONDecodeError: raise SystemExit(f"{slug}: committed pipeline index is corrupted; refusing unsafe resume.")
              matching=bool(prior and prior.get("source_book_id")==source["book_id"] and str(prior.get("source_pdf_sha256") or "").lower()==str(source["sha256"]).lower())
              if prior and prior.get("source_book_id")==source["book_id"] and not matching:
                  raise SystemExit(f"{slug}: source PDF edition differs from prior pipeline checkpoint. Use analyze_all to start a clean edition-bound run.")
              bundle=prior.get("inventory_bundle") if matching else None
              restored=False
              if isinstance(bundle,dict):
                  if bundle.get("package")!=expected_package or not isinstance(bundle.get("tag"),str) or not isinstance(bundle.get("tar_sha256"),str):
                      raise SystemExit(f"{slug}: inventory bundle reference is malformed or belongs to another package.")
                  pull_dir=work/".inventory-pull"
                  shutil.rmtree(pull_dir,ignore_errors=True);pull_dir.mkdir(parents=True,exist_ok=True)
                  pull=subprocess.run(["oras","pull",f"{expected_package}:{bundle['tag']}","--output",str(pull_dir)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
                  archives=list(pull_dir.glob("*.tar.gz"))
                  detail=(pull.stdout or "").strip()[-700:]
                  if pull.returncode==0 and len(archives)==1:
                      archive=archives[0]
                      if sha(archive)!=bundle["tar_sha256"]:
                          raise SystemExit(f"{slug}: inventory bundle tar SHA-256 mismatch; refusing to regenerate over a corrupt checkpoint.")
                      with tarfile.open(archive,"r:gz") as tar:
                          members=tar.getmembers()
                          if not members:
                              raise SystemExit(f"{slug}: inventory bundle archive is empty.")
                          # Current Layer 1 preparation bundles use a slug-layer1/ wrapper and
                          # include a per-file manifest. Older pipeline checkpoints use inventory/
                          # at archive root. Accept both layouts without weakening path validation.
                          wrapper=f"{slug}-layer1"
                          wrapped=[PurePosixPath(m.name).parts[0]==wrapper for m in members if PurePosixPath(m.name).parts]
                          if any(wrapped):
                              if not all(wrapped):
                                  raise SystemExit(f"{slug}: inventory bundle mixes wrapped and root-level paths.")
                              layer1_root=extract_archive(archive,pull_dir,wrapper)
                              manifest_path=layer1_root/"layer1-bundle-manifest.v1.json"
                              if not manifest_path.is_file():
                                  raise SystemExit(f"{slug}: wrapped Layer 1 inventory bundle manifest is missing.")
                              layer1_manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
                              fingerprint=layer1_manifest.get("preparation_fingerprint")
                              tag_prefix=f"visual-inventory-v1-class{selection['class']}-{slug}-prep-"
                              tag=bundle["tag"]
                              tag_fingerprint=tag[len(tag_prefix):] if tag.startswith(tag_prefix) else ""
                              if (len(tag_fingerprint)!=24
                                  or any(ch not in "0123456789abcdef" for ch in tag_fingerprint)
                                  or not isinstance(fingerprint,str)
                                  or not fingerprint.startswith(tag_fingerprint)):
                                  raise SystemExit(f"{slug}: Layer 1 bundle tag/fingerprint mismatch.")
                              validate_layer1_bundle(layer1_root,source,work,fingerprint)
                              shutil.rmtree(invdir,ignore_errors=True)
                              shutil.copytree(layer1_root/"inventory",invdir)
                          else:
                              for member in members:
                                  name=PurePosixPath(member.name)
                                  if name.is_absolute() or ".." in name.parts or not name.parts or name.parts[0] not in {"inventory","source.manifest.json",source["text_jsonl_filename"]}:
                                      raise SystemExit(f"{slug}: unsafe inventory bundle member {member.name!r}.")
                                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                                      raise SystemExit(f"{slug}: links/devices are forbidden in inventory bundle.")
                              inventory_members=[m for m in members if PurePosixPath(m.name).parts[0]=="inventory"]
                              if not inventory_members: raise SystemExit(f"{slug}: bundle has no inventory directory.")
                              tar.extractall(path=work,members=inventory_members,filter="data")
                      inv=validate_inventory(work,source)
                      if not (work/".inventory-restored-from-ghcr.json").is_file():
                          (work/".inventory-restored-from-ghcr.json").write_text(json.dumps({"source_pdf_sha256":source["sha256"],"tag":bundle["tag"],"tar_sha256":bundle["tar_sha256"]},indent=2)+"\n",encoding="utf-8")
                      print(json.dumps({"book_id":source["book_id"],"inventory":"RESTORED_FROM_VERIFIED_GHCR_BUNDLE","asset_count":len(inv["assets"]),"candidate_pack_rebuild":False}))
                      restored=True
                  elif pull.returncode!=0 and missing_artifact(detail, f"{expected_package}:{bundle['tag']}"):
                      print(json.dumps({"book_id":source["book_id"],"inventory":"PRIOR_BUNDLE_NOT_FOUND","fallback":"build Layer 1 only; preserve source-bound Layer 4 checkpoint","detail":detail}))
                  else:
                      raise SystemExit(f"{slug}: cannot safely recover prior inventory bundle; resume stopped. {detail}")
                  shutil.rmtree(pull_dir,ignore_errors=True)
              if not restored:
                  invdir.mkdir(parents=True,exist_ok=True)
                  subprocess.run([sys.executable,"scripts/extract_visual_asset_inventory.py","--pdf",str(work/"source.pdf"),"--manifest",str(work/"source.manifest.json"),"--output-dir",str(invdir),"--preview-width","1200"],cwd=repo,check=True)
                  inv=validate_inventory(work,source)
                  if matching:
                      prior_inventory_path=repo/"data"/"textbook-visuals"/slug/"visual-inventory.v1.json"
                      if not prior_inventory_path.is_file():
                          raise SystemExit(f"{slug}: prior Layer 4 work exists but neither its ORAS inventory nor committed inventory is available; refusing unverified resume.")
                      if sha(prior_inventory_path)!=sha(invdir/"visual-inventory.v1.json"):
                          raise SystemExit(f"{slug}: rebuilt Layer 1 inventory differs from the inventory bound to the saved checkpoint. Use analyze_all to deliberately rebuild and reanalyze.")
                  print(json.dumps({"book_id":source["book_id"],"inventory":"BUILT_BECAUSE_NO_VERIFIED_BUNDLE","asset_count":len(inv["assets"]),"prior_inventory_byte_match":bool(matching),"candidate_pack_rebuild":False}))
              candidate_path=repo/"data"/"textbook-visual-candidates-v3"/slug/"candidates.v3.json"
              if candidate_path.is_file():
                  pack=json.loads(candidate_path.read_text(encoding="utf-8"))
                  if pack.get("schema_version")!="quantaedge.visual-candidate-pack.v3" or (pack.get("source") or {}).get("pdf_sha256")!=source["sha256"]:
                      raise SystemExit(f"{slug}: existing candidate pack is stale/mismatched; use analyze_all to rebuild it.")
              else:
                  raise SystemExit(f"{slug}: no committed v3 candidate pack exists; resume mode will not rebuild candidate packs.")
          PY

      - name: Restore or build immutable per-book candidate checkpoints
        if: env.ANALYSIS_MODE != 'resume_layers_4_5'
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          package="ghcr.io/$owner/quantaedge-textbook-visuals"
          python scripts/prepare_visual_candidate_batch.py \
            --selection "$VISUAL_SOURCE_ROOT/selected-sources.json" \
            --source-root "$VISUAL_SOURCE_ROOT" \
            --output-root "$RUNNER_TEMP/visual-candidates-v3" \
            --repo-root "$GITHUB_WORKSPACE" \
            --package "$package" \
            --mode "$ANALYSIS_MODE"

      - name: Verify per-book immutable candidate checkpoints before committing the catalog
        if: env.ANALYSIS_MODE != 'resume_layers_4_5'
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          python - "$VISUAL_SOURCE_ROOT/selected-sources.json" "$RUNNER_TEMP/visual-candidates-v3" "$GITHUB_WORKSPACE" "ghcr.io/$owner/quantaedge-textbook-visuals" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          selection_path, work_arg, repo_arg, package = sys.argv[1:]
          selection=json.loads(Path(selection_path).read_text(encoding="utf-8"))
          work,repo=Path(work_arg),Path(repo_arg)
          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda:stream.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          for source in selection["sources"]:
              slug=source["book_slug"]
              index_path=repo/"data"/"textbook-visual-candidates-v3"/slug/"bundle-index.v3.json"
              pack_path=repo/"data"/"textbook-visual-candidates-v3"/slug/"candidates.v3.json"
              archive=work/f"{slug}-candidates-v3.tar.gz"
              if not index_path.is_file() or not pack_path.is_file() or not archive.is_file():
                  raise SystemExit(f"{slug}: per-book checkpoint outputs are missing; refusing to commit a partial catalog.")
              index=json.loads(index_path.read_text(encoding="utf-8"))
              pack=json.loads(pack_path.read_text(encoding="utf-8"))
              if index.get("schema_version")!="quantaedge.visual-candidate-bundle-index.v3":
                  raise SystemExit(f"{slug}: checkpoint index schema mismatch.")
              if index.get("source_book_id")!=source["book_id"] or str(index.get("source_pdf_sha256") or "").lower()!=str(source["sha256"]).lower():
                  raise SystemExit(f"{slug}: checkpoint source identity mismatch.")
              if index.get("ghcr_package")!=package or not isinstance(index.get("version_tag"),str):
                  raise SystemExit(f"{slug}: checkpoint registry package/tag missing.")
              if digest(archive)!=index.get("bundle_tar_sha256"):
                  raise SystemExit(f"{slug}: local per-book archive SHA-256 differs from its committed checkpoint index.")
              if pack.get("schema_version")!="quantaedge.visual-candidate-pack.v3" or str((pack.get("source") or {}).get("pdf_sha256") or "").lower()!=str(source["sha256"]).lower():
                  raise SystemExit(f"{slug}: candidate pack source/schema mismatch.")
              if pack.get("summary",{}).get("publication_allowed") is not False or pack.get("summary",{}).get("selected_candidate_count")!=index.get("candidate_count"):
                  raise SystemExit(f"{slug}: checkpoint candidate count or publication guard mismatch.")
              if index.get("candidate_pack_sha256") and index["candidate_pack_sha256"]!=digest(pack_path):
                  raise SystemExit(f"{slug}: candidate pack SHA-256 differs from checkpoint index.")
              print(json.dumps({"slug":slug,"checkpoint":"VERIFIED","tag":index["version_tag"],"candidate_count":index["candidate_count"],"archive_sha256":index["bundle_tar_sha256"],"publication_allowed":False}))
          PY

      - name: Rebuild the catalog, test candidate-to-content contracts, and commit the full batch
        if: env.ANALYSIS_MODE != 'resume_layers_4_5'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_visual_catalog_index.py --catalog-dir data/textbook-visual-candidates-v3/catalogs --output data/textbook-visual-candidates-v3/index.v1.json
          python -m unittest discover -s tests -p "test_build_visual_lesson_attachment_manifest.py" -v
          python -m unittest discover -s tests -p "test_textbook_visual_end_to_end_contract.py" -v
          python -m unittest discover -s tests -p "test_update_visual_catalog_index.py" -v
          python -m unittest discover -s tests -p "test_pipeline_data_locations.py" -v
          python scripts/validate_pipeline_data_locations.py --repo-root "$GITHUB_WORKSPACE"
          git add -A data/textbook-visual-candidates-v3
          python scripts/validate_pipeline_data_locations.py --repo-root "$GITHUB_WORKSPACE"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(ai): prepare Class $CLASS_NO bilingual visual candidate batch"
          else
            echo "The candidate metadata and media manifest already match main; no Git commit required."
            exit 0
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Persisted review-only visual candidates for every required NCERT Maths and Science source book in English and Hindi. All candidate packs remain non-publishable."


      - name: Start Ollama container and load vision model for Layer 4
        if: env.ANALYSIS_MODE == 'analyze_all' || env.ANALYSIS_MODE == 'resume_layers_4_5'
        shell: bash
        run: |
          set -euo pipefail
          docker pull ollama/ollama:latest
          docker volume create quantaedge-ollama-models >/dev/null
          docker run -d --name quantaedge-ollama -p 11434:11434 -v quantaedge-ollama-models:/root/.ollama ollama/ollama:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || { docker logs quantaedge-ollama; exit 1; }
          docker exec quantaedge-ollama ollama pull "$VISION_MODEL"

      - name: Run exhaustive, resumable Layers 4–5 for the selected class
        id: layer45_run
        if: env.ANALYSIS_MODE == 'analyze_all' || env.ANALYSIS_MODE == 'resume_layers_4_5'
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/quantaedge_textbook_pipeline.py run \
            --selection "$VISUAL_SOURCE_ROOT/selected-sources.json" \
            --source-root "$VISUAL_SOURCE_ROOT" \
            --repo-root "$GITHUB_WORKSPACE" \
            --package "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quantaedge-textbook-visuals" \
            --run-id "$GITHUB_RUN_ID" \
            --model "$VISION_MODEL" \
            --batch-size "$CHECKPOINT_BATCH_SIZE" \
            --max-batches-per-run "$MAX_BATCHES_PER_RUN" \
            --request-timeout 300; then
            echo "yielded=false" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [[ "$result" -eq 10 ]]; then
              echo "yielded=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Layer 4–5 reached its safe batch budget; durable checkpoints are saved and the resume coordinator will continue this class."
            else
              exit "$result"
            fi
          fi

      - name: Stop Ollama container
        if: always() && (env.ANALYSIS_MODE == 'analyze_all' || env.ANALYSIS_MODE == 'resume_layers_4_5')
        run: docker rm -f quantaedge-ollama >/dev/null 2>&1 || true

      - name: Summarize integrated eight-layer pipeline
        if: always() && (env.ANALYSIS_MODE == 'analyze_all' || env.ANALYSIS_MODE == 'resume_layers_4_5')
        shell: bash
        run: |
          {
            echo "## QuantaEdge eight-layer textbook pipeline"
            echo "- Executed here: Layers 1–5. Layers 6–8 are implemented in the separate budgeted per-book workflow; benchmark the model first, then generate review-only drafts."
            echo "- No visual/candidate total cap; checkpoint batch size was $CHECKPOINT_BATCH_SIZE assets. Smaller batches reduce uncheckpointed model work but increase Git/GHCR savepoint traffic."
            echo "- All generated data remains review-only; publication_allowed=false."
          } >> "$GITHUB_STEP_SUMMARY"

  record-completed-class-markers:
    name: Verify all whole-book Layer 5 ledgers and record class completion
    needs: [plan, prepare]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (
        (github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[cancel-layer45-matrix]') && (
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-6-8]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-7-8]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-6]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-7]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-8]')
        )) ||
        (github.event_name == 'workflow_dispatch' && inputs.analysis_mode == 'resume_layers_4_5') ||
        (github.event_name == 'workflow_call' && inputs.analysis_mode == 'resume_layers_4_5')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main after all book workers settle
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify current ledgers and write only complete class markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.plan_textbook_layer45_matrix import BOOKS

          root = Path.cwd()
          data_root = root / "data" / "textbook-content-pipeline"
          control_path = data_root / "resume-control.v1.json"
          state = json.loads(control_path.read_text(encoding="utf-8"))
          if state.get("schema_version") != "quantaedge.textbook-layer45-resume-control.v1":
              raise SystemExit("Resume control schema mismatch; refusing to write completion markers.")
          if state.get("active") is not True:
              print("Automatic resume is inactive; nothing to aggregate.")
              raise SystemExit(0)

          completed_dir = data_root / "resume-control" / "completed"
          completed_dir.mkdir(parents=True, exist_ok=True)
          class_complete = {}
          for grade in (6, 7, 8):
              sources = [item for item in BOOKS if item["class_no"] == str(grade)]
              expected_count = 4 if grade == 6 else 6
              if len(sources) != expected_count:
                  raise SystemExit(f"Planner source contract mismatch for Class {grade}: {len(sources)} books.")
              evidence, missing = [], []
              for source in sources:
                  ledger_path = data_root / f"class-{grade}" / "books" / source["book_slug"] / "coverage-ledger.v1.json"
                  index_path = root / "data" / "textbook-visuals" / source["book_slug"] / "visual-pipeline-index.v1.json"
                  try:
                      raw = ledger_path.read_bytes()
                      ledger = json.loads(raw.decode("utf-8"))
                      index = json.loads(index_path.read_text(encoding="utf-8"))
                  except (OSError, UnicodeError, json.JSONDecodeError):
                      missing.append(source["book_slug"] + ": ledger or index missing/unreadable")
                      continue
                  summary = ledger.get("summary") or {}
                  identity = ledger.get("source") or {}
                  expected_sha = str(index.get("source_pdf_sha256") or "").lower()
                  valid = (
                      ledger.get("schema_version") == "quantaedge.textbook-coverage-ledger.v1"
                      and ledger.get("ledger_status") == "COMPLETE"
                      and summary.get("unresolved_count") == 0
                      and identity.get("source_book_id") == source["book_id"]
                      and bool(expected_sha)
                      and str(identity.get("source_pdf_sha256") or "").lower() == expected_sha
                      and index.get("source_book_id") == source["book_id"]
                      and str(index.get("source_pdf_sha256") or "").lower() == expected_sha
                      and index.get("layers", {}).get("5") == "COMPLETE"
                      and str(index.get("coverage_ledger_path") or "") == ledger_path.relative_to(root).as_posix()
                  )
                  if not valid:
                      missing.append(source["book_slug"] + ": source-bound Layer 5 evidence incomplete or mismatched")
                      continue
                  evidence.append({
                      "source_book_id": source["book_id"],
                      "source_pdf_sha256": expected_sha,
                      "ledger_path": ledger_path.relative_to(root).as_posix(),
                      "ledger_sha256": hashlib.sha256(raw).hexdigest(),
                  })
              marker = completed_dir / f"class-{grade}.v1.json"
              if missing:
                  marker.unlink(missing_ok=True)
                  class_complete[str(grade)] = False
                  print(json.dumps({"class_no": grade, "status": "IN_PROGRESS", "incomplete_books": missing}))
                  continue
              previous = {}
              try:
                  previous = json.loads(marker.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  pass
              completed_at = previous.get("completed_at") if previous.get("source_ledgers") == evidence else None
              marker_value = {
                  "schema_version": "quantaedge.textbook-layer45-class-completion.v1",
                  "class_no": grade,
                  "status": "COMPLETE",
                  "completed_at": completed_at or datetime.now(timezone.utc).isoformat(),
                  "source_scope": "all selected NCERT whole-book sources for this class",
                  "source_ledgers": evidence,
              }
              marker.write_text(json.dumps(marker_value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              class_complete[str(grade)] = True
              print(json.dumps({"class_no": grade, "status": "COMPLETE", "books_verified": len(evidence)}))

          if all(class_complete.get(str(grade)) is True for grade in (6, 7, 8)):
              state["active"] = False
              state["status"] = "COMPLETE"
              state["completed_at"] = datetime.now(timezone.utc).isoformat()
          else:
              state["active"] = True
              state["status"] = "IN_PROGRESS"
          control_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/textbook-content-pipeline/resume-control.v1.json data/textbook-content-pipeline/resume-control/completed
          if git diff --cached --quiet; then
            echo "No class completion evidence changed."
            exit 0
          fi
          git commit -m "status(content): reconcile whole-book Layer 5 completion evidence"
          git pull --rebase origin main
          git push origin HEAD:main

  wake-resume-coordinator:
    name: Wake checkpoint coordinator after each book-worker round
    needs: [plan, prepare, record-completed-class-markers]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (
        (github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[cancel-layer45-matrix]') && (
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-6-8]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-classes-7-8]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-6]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-7]') ||
          contains(github.event.head_commit.message || '', '[resume-visual-layers-4-5-class-8]')
        )) ||
        (github.event_name == 'workflow_dispatch' && inputs.analysis_mode == 'resume_layers_4_5') ||
        (github.event_name == 'workflow_call' && inputs.analysis_mode == 'resume_layers_4_5')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch coordinator to reconcile the latest persisted checkpoint round
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$RUNNER_TEMP/coordinator-dispatch.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/resume-textbook-layers-4-5-automatically.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [[ "$code" != "204" ]]; then
            cat "$RUNNER_TEMP/coordinator-dispatch.json"
            echo "Checkpoint coordinator dispatch failed (HTTP $code)." >&2
            exit 1
          fi
          echo "Checkpoint coordinator explicitly queued after the worker round."

  rebuild-correction-coverage:
    if: github.event_name == 'push' && contains(toJson(github.event.commits), 'visual-analysis-corrections.v1.json')
    name: Rebuild Layer 5 after correction overlay changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild affected ledgers without rerunning Layer 4
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/quantaedge_textbook_pipeline.py
          python -m unittest discover -s tests -p "test_quantaedge_textbook_pipeline.py" -v
          python scripts/quantaedge_textbook_pipeline.py rebuild-corrections --event "$GITHUB_EVENT_PATH" --repo-root "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/textbook-content-pipeline
          if ! git diff --cached --quiet; then
            git commit -m "rebuild(content): propagate accepted visual corrections"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
