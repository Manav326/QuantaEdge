name: QuantaEdge CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

concurrency:
  group: quantaedge-ci-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate API
        working-directory: services/api
        run: mvn -B -ntp verify

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm install

      - name: Build admin
        working-directory: apps/admin
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: false
          tags: quantaedge-api:\${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          tags: quantaedge-web:\${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin
          push: false
          tags: quantaedge-admin:\${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  integration:
    name: Local stack + curriculum audit
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local stack
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for curriculum API
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/v1/curriculum/audit/strict > /tmp/audit.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/audit.json
          cat /tmp/audit.json

      - name: Require strict curriculum GREEN
        shell: bash
        run: |
          set -euo pipefail
          status="$(python -c 'import json; print(json.load(open("/tmp/audit.json"))["status"])')"
          test "$status" = "GREEN"

      - name: Smoke-test student and admin routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/student >/dev/null
          curl -fsS http://localhost:3001/ >/dev/null

      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Tear down local stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  publish:
    name: Publish GHCR images
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: true
          tags: |
            ghcr.io/\${{ github.repository_owner }}/quantaedge-api:sha-\${{ github.sha }}
            ghcr.io/\${{ github.repository_owner }}/quantaedge-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          tags: |
            ghcr.io/\${{ github.repository_owner }}/quantaedge-web:sha-\${{ github.sha }}
            ghcr.io/\${{ github.repository_owner }}/quantaedge-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin
          push: true
          tags: |
            ghcr.io/\${{ github.repository_owner }}/quantaedge-admin:sha-\${{ github.sha }}
            ghcr.io/\${{ github.repository_owner }}/quantaedge-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
