name: QuantaEdge Textbook Cache

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/textbook_registry.py"
      - ".github/workflows/textbook-cache.yml"
      - "tests/test_textbook_registry.py"
  workflow_dispatch:
    inputs:
      language:
        description: "Which image to extend"
        type: choice
        options: [both, hindi, english]
        default: both
        required: true
      book_code:
        description: "Optional one-book-only NCERT code or registry ID"
        type: string
        required: false
      max_books:
        description: "Maximum new books per language (0 means all pending)"
        type: number
        default: 0
        required: true
      refresh:
        description: "Re-download cached books to verify content"
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: quantaedge-textbook-cache-v2
  cancel-in-progress: false

jobs:
  cache-textbooks:
    name: Download one book and push it before continuing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF merge dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize run summary
        shell: bash
        run: |
          {
            echo "# QuantaEdge textbook cache"
            echo
            echo "Each PDF is downloaded, checksummed, added as one OCI layer, and pushed before the next book starts."
            echo
            echo "- Repository: ${{ github.repository }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "| Medium | Class | Publisher | Book | Registry ID | SHA-256 |"
            echo "|---|---:|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish textbooks incrementally to language-specific images
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_BOOK_CODE: ${{ inputs.book_code }}
          INPUT_MAX_BOOKS: ${{ inputs.max_books }}
          INPUT_REFRESH: ${{ inputs.refresh }}
        run: |
          set -euo pipefail
          language="$INPUT_LANGUAGE"
          if [ -z "$language" ]; then language="both"; fi
          args=(python scripts/textbook_registry.py publish --language "$language" --image-prefix "ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/quantaedge-textbooks")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_BOOK_CODE}" ]; then args+=(--book-code "$INPUT_BOOK_CODE"); fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_MAX_BOOKS" ] && [ "$INPUT_MAX_BOOKS" != "0" ]; then args+=(--max-books "$INPUT_MAX_BOOKS"); fi
          if [ "$INPUT_REFRESH" = "true" ]; then args+=(--refresh); fi
          "${args[@]}"

      - name: Pull inventories for direct inspection
        if: always()
        shell: bash
        run: |
          set +e
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          mkdir -p "$RUNNER_TEMP/textbook-inventory"
          python scripts/textbook_registry.py pull \
            --image "ghcr.io/$owner/quantaedge-textbooks-hindi:latest" \
            --output-dir "$RUNNER_TEMP/textbook-inventory/hindi"
          hindi_status=$?
          python scripts/textbook_registry.py pull \
            --image "ghcr.io/$owner/quantaedge-textbooks-english:latest" \
            --output-dir "$RUNNER_TEMP/textbook-inventory/english"
          english_status=$?
          mkdir -p "$RUNNER_TEMP/textbook-inventory-json"
          for lang in hindi english; do
            if [ -f "$RUNNER_TEMP/textbook-inventory/$lang/index.json" ]; then
              cp "$RUNNER_TEMP/textbook-inventory/$lang/index.json" "$RUNNER_TEMP/textbook-inventory-json/index-$lang.json"
            fi
          done
          if [ "$hindi_status" -ne 0 ]; then echo "Hindi image inventory was not available in this run." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$english_status" -ne 0 ]; then echo "English image inventory was not available in this run." >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Upload small inventory JSON files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-textbook-inventory-${{ github.run_number }}
          path: ${{ runner.temp }}/textbook-inventory-json/index-*.json
          if-no-files-found: ignore
          retention-days: 30
