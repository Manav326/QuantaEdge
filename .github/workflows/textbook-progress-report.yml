name: Textbook checkpoint progress report

on:
  push:
    branches: ["main"]
    paths:
      - "data/textbook-extractions/**"
      - "data/textbook-content-pipeline/**"
      - "data/textbook-visuals/**"
      - "data/textbook-visual-candidates-v3/**"
      - "scripts/report_textbook_pair_progress.py"
      - "scripts/plan_textbook_layer45_matrix.py"
      - "scripts/textbook_pipeline_handoff.py"
      - ".github/workflows/textbook-progress-report.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "QuantaEdge Textbook Content Pipeline"
      - "Process Class 6–8 Textbooks in English and Hindi"
      - "Resume Class 6–8 Layer 4–5 checkpoints"
      - "Mirror verified textbook extraction artifact to main"
      - "QuantaEdge Textbook Cache"
      - "QuantaEdge GHCR Textbook Extraction Pilot"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Read-only reporting has its own lane and keeps only the newest checkpoint snapshot.
concurrency:
  group: qe-textbook-progress-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Report latest committed Class 6–8 book-pair checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build timestamped per-book, per-layer progress report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_textbook_pair_progress.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --json-out "$RUNNER_TEMP/textbook-progress.v1.json" \
            --markdown-out "$RUNNER_TEMP/textbook-progress.md"
          cat "$RUNNER_TEMP/textbook-progress.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: class-6-8-textbook-progress-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/textbook-progress.v1.json
            ${{ runner.temp }}/textbook-progress.md
          if-no-files-found: error
          retention-days: 30
