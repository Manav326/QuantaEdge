<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">दो पौधों की निष्पक्ष तुलना</title><desc id="desc">दो समान गमलों में पानी की अलग मात्रा दी जाती है। बीज, मिट्टी, प्रकाश और समय समान रखे जाते हैं; दस दिन बाद पौधे की ऊँचाई मापी जाती है।</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#18233F" flood-opacity=".10"/></filter></defs>
<rect width="1200" height="620" rx="28" fill="#FBFCFE"/>
<text x="600" y="48" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, Mangal, sans-serif" font-size="30" font-weight="700" fill="#17233F">पानी की मात्रा का प्रभाव कैसे जाँचें?</text>
<rect x="60" y="72" width="1080" height="84" rx="16" fill="#FFF0E3" stroke="#F1C49D" stroke-width="2"/>
<text x="600" y="106" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, Mangal, sans-serif" font-size="22" font-weight="700" fill="#9A4B16">समान रखें: बीज • मिट्टी • गमला • प्रकाश • समय</text>
<text x="600" y="136" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, Mangal, sans-serif" font-size="17" fill="#6D4B35">केवल पानी की मात्रा बदलें</text>
<g filter="url(#shadow)"><rect x="70" y="180" width="500" height="300" rx="22" fill="#FFFFFF" stroke="#D8E0EC" stroke-width="2"/><rect x="630" y="180" width="500" height="300" rx="22" fill="#FFFFFF" stroke="#D8E0EC" stroke-width="2"/></g>
<g font-family="Noto Sans Devanagari, Nirmala UI, Mangal, sans-serif" text-anchor="middle"><text x="320" y="220" font-size="27" font-weight="700" fill="#17233F">गमला A</text><text x="880" y="220" font-size="27" font-weight="700" fill="#17233F">गमला B</text><text x="320" y="462" font-size="23" font-weight="700" fill="#9A4B16">रोज़ 20 mL पानी</text><text x="880" y="462" font-size="23" font-weight="700" fill="#9A4B16">रोज़ 40 mL पानी</text></g>
<g stroke-linecap="round" stroke-linejoin="round"><path d="M320 388 V300" stroke="#418565" stroke-width="10"/><path d="M320 333 C280 288 238 298 246 326 C255 348 292 347 320 333Z" fill="#69A984" stroke="#418565" stroke-width="3"/><path d="M320 315 C353 267 397 277 392 307 C385 329 347 330 320 315Z" fill="#8CC69F" stroke="#418565" stroke-width="3"/><path d="M255 380 L385 380 L367 426 L273 426 Z" fill="#C77D4C" stroke="#96552F" stroke-width="3"/><path d="M880 388 V275" stroke="#418565" stroke-width="10"/><path d="M880 324 C832 278 790 292 803 319 C814 343 850 340 880 324Z" fill="#69A984" stroke="#418565" stroke-width="3"/><path d="M880 300 C915 250 961 264 955 293 C946 317 908 318 880 300Z" fill="#8CC69F" stroke="#418565" stroke-width="3"/><path d="M880 279 C853 244 864 231 880 220 C896 236 906 248 880 279Z" fill="#69A984" stroke="#418565" stroke-width="3"/><path d="M815 380 L945 380 L927 426 L833 426 Z" fill="#C77D4C" stroke="#96552F" stroke-width="3"/></g>
<rect x="130" y="510" width="940" height="74" rx="16" fill="#EAF5EF" stroke="#A9D1BA" stroke-width="2"/>
<text x="600" y="541" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, Mangal, sans-serif" font-size="21" font-weight="700" fill="#245B40">मापा गया परिणाम: 10 दिन बाद पौधे की ऊँचाई</text>
<text x="600" y="568" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, Mangal, sans-serif" font-size="17" fill="#245B40">परिणाम दर्ज करें; निष्कर्ष प्रमाण के अनुसार लिखें।</text>
</svg>