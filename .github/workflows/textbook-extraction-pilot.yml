name: QuantaEdge GHCR Textbook Extraction Pilot

on:
  workflow_dispatch:
    inputs:
      class_no:
        description: "Bihar Board pilot class"
        type: choice
        options: ["6", "7", "8"]
        default: "6"
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  # Allow Class 7 and Class 8 to extract in parallel, while preventing duplicate runs for the same class.
  group: quantaedge-textbook-extraction-pilot-class-${{ inputs.class_no || '6' }}
  cancel-in-progress: false

jobs:
  extract:
    name: Pull GHCR complete books and extract page text
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Test extraction filters and checkpointing
        run: python -m unittest discover -s tests -p 'test_extract_textbook_text.py' -v

      - name: Test safe GHCR page importer
        run: python -m unittest discover -s tests -p 'test_import_ghcr_extracted_pages.py' -v

      - name: Test whole-book extraction integrity and two-part Maths rules
        run: python -m unittest discover -s tests -p 'test_validate_textbook_extraction_artifacts.py' -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull approved class-wise GHCR cache and extract complete books
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          DISPATCH_CLASS: ${{ inputs.class_no }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GHCR_OWNER}" | tr '[:upper:]' '[:lower:]')"
          class_no=6
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${DISPATCH_CLASS:-}" ]; then
            class_no="${DISPATCH_CLASS}"
          fi
          mkdir -p pilot-output
          for medium in hindi english; do
            image="ghcr.io/${owner}/quantaedge-textbooks-class-${class_no}-${medium}:latest"
            registry_dir="pilot-output/cache/class-${class_no}/${medium}"
            prepared_dir="pilot-output/prepared/class-${class_no}/${medium}"
            extracted_dir="pilot-output/extracted/class-${class_no}/${medium}"
            echo "::group::Pull ${image}"
            python scripts/textbook_registry.py pull --image "${image}" --output-dir "${registry_dir}"
            echo "::endgroup::"
            echo "::group::Prepare complete-book extraction inputs (${medium})"
            python scripts/textbook_registry.py prepare-library --registry-dir "${registry_dir}" --output-dir "${prepared_dir}" --extraction-only
            echo "::endgroup::"
            echo "::group::Extract class ${class_no} ${medium} Maths and Science pages"
            python scripts/extract_textbook_text.py \
              --bundle-dir "${prepared_dir}/bundles" \
              --pdf-dir "${prepared_dir}/pdfs" \
              --output-dir "${extracted_dir}" \
              --class-no "${class_no}" \
              --language "${medium}" \
              --subject Mathematics \
              --subject Maths \
              --subject Science \
              --scope SUBJECT_BOOK
            echo "::endgroup::"
            echo "::group::Validate complete-book manifests, hashes, page continuity, and required Maths parts"
            python scripts/validate_textbook_extraction_artifacts.py \
              --registry-index "${registry_dir}/index.json" \
              --extraction-dir "${extracted_dir}" \
              --class-no "${class_no}" \
              --language "${medium}"
            echo "::endgroup::"
            mkdir -p pilot-output/reports
            cp "${prepared_dir}/prepare-report.json" "pilot-output/reports/class-${class_no}-${medium}-prepare-report.json"
            cp "${extracted_dir}/extraction-report.json" "pilot-output/reports/class-${class_no}-${medium}-extraction-report.json"
          done

      - name: Publish extracted text and reports (not source PDFs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-textbook-extraction-pilot-class-${{ inputs.class_no || '6' }}-${{ github.run_id }}
          path: |
            pilot-output/extracted/
            pilot-output/reports/
            pilot-output/cache/class-*/hindi/index.json
            pilot-output/cache/class-*/english/index.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
