name: Prepare textbook visual candidates v3 (additive)

on:
  push:
    paths:
      - ".github/workflows/textbook-visual-candidates-v3.yml"
      - ".github/workflows/textbook-extraction-pilot.yml"
      - "scripts/prepare_visual_candidates_v3.py"
      - "scripts/select_textbook_visual_sources.py"
      - "scripts/validate_textbook_extraction_artifacts.py"
      - "tests/test_prepare_visual_candidates_v3.py"
      - "tests/test_select_textbook_visual_sources.py"
      - "tests/test_validate_textbook_extraction_artifacts.py"
      - "scripts/build_visual_lesson_attachment_manifest.py"
      - "tests/test_build_visual_lesson_attachment_manifest.py"
      - "tests/test_textbook_visual_end_to_end_contract.py"
      - "scripts/update_visual_catalog_index.py"
      - "tests/test_update_visual_catalog_index.py"
      - "data/textbook-visual-candidates-v3/catalogs/**"
      - "data/textbook-visual-candidates-v3/index.v1.json"
      - "data/textbook-visual-candidates-v3/**"
      - "apps/admin/app/content/page.tsx"
      - "services/api/src/main/java/com/quantaedge/api/AdminContentController.java"
      - "services/api/src/test/java/com/quantaedge/api/AdminContentControllerTest.java"
      - "scripts/extract_visual_asset_inventory.py"
      - "tests/test_extract_visual_asset_inventory.py"
      - "scripts/quantaedge_textbook_pipeline.py"
      - "tests/test_quantaedge_textbook_pipeline.py"
      - "data/textbook-content-pipeline/**/visual-analysis-corrections.v1.json"
  workflow_dispatch:
    inputs:
      class_no:
        description: "Prepare candidates for this complete bilingual class source set"
        required: true
        type: choice
        options: ["6", "7", "8"]
        default: "7"
      analysis_mode:
        description: "Run Layers 1–3 only or continue through full Layer 4 analysis and Layer 5 coverage"
        required: true
        type: choice
        options: ["prepare_only", "analyze_all"]
        default: "analyze_all"
      vision_model:
        description: "Ollama vision model used in Layer 4"
        required: true
        type: string
        default: "qwen2.5vl:3b"

permissions:
  contents: write
  packages: write

concurrency:
  group: textbook-visual-candidates-v3-class-${{ inputs.class_no || 'validation-only' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    name: Validate additive v3 preparation scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
      - name: Compile preparation and validation scripts
        run: python -m py_compile scripts/extract_visual_asset_inventory.py scripts/prepare_visual_candidates_v3.py scripts/select_textbook_visual_sources.py scripts/validate_textbook_extraction_artifacts.py scripts/build_visual_lesson_attachment_manifest.py scripts/update_visual_catalog_index.py
      - name: Test source selection, extraction integrity and candidate preparation
        run: |
          python -m unittest discover -s tests -p "test_select_textbook_visual_sources.py" -v
          python -m unittest discover -s tests -p "test_validate_textbook_extraction_artifacts.py" -v
          python -m unittest discover -s tests -p "test_extract_visual_asset_inventory.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidates_v3.py" -v
          python -m unittest discover -s tests -p "test_build_visual_lesson_attachment_manifest.py" -v
          python -m unittest discover -s tests -p "test_textbook_visual_end_to_end_contract.py" -v
          python -m unittest discover -s tests -p "test_update_visual_catalog_index.py" -v
          python -m unittest discover -s tests -p "test_analyze_visual_inventory_with_ollama.py" -v
          python -m unittest discover -s tests -p "test_quantaedge_textbook_pipeline.py" -v

  prepare:
    if: github.event_name == 'workflow_dispatch'
    name: Prepare full bilingual Class ${{ inputs.class_no }} candidate set
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLASS_NO: ${{ inputs.class_no }}
      ANALYSIS_MODE: ${{ inputs.analysis_mode }}
      VISION_MODEL: ${{ inputs.vision_model }}
    steps:
      - name: Checkout main with write permission for review metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate inputs and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASS_NO" == "6" || "$CLASS_NO" == "7" || "$CLASS_NO" == "8" ]] || { echo "Only Class 6, Class 7 or Class 8 is supported."; exit 2; }
          [[ "$ANALYSIS_MODE" == "prepare_only" || "$ANALYSIS_MODE" == "analyze_all" ]] || { echo "Invalid analysis_mode"; exit 2; }
          [[ -n "$VISION_MODEL" ]] || { echo "vision_model must be non-empty"; exit 2; }
          python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
          python -m py_compile scripts/extract_visual_asset_inventory.py scripts/prepare_visual_candidates_v3.py scripts/select_textbook_visual_sources.py scripts/validate_textbook_extraction_artifacts.py scripts/build_visual_lesson_attachment_manifest.py scripts/update_visual_catalog_index.py scripts/analyze_visual_inventory_with_ollama.py scripts/quantaedge_textbook_pipeline.py
          python -m unittest discover -s tests -p "test_select_textbook_visual_sources.py" -v
          python -m unittest discover -s tests -p "test_validate_textbook_extraction_artifacts.py" -v
          python -m unittest discover -s tests -p "test_extract_visual_asset_inventory.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidates_v3.py" -v
          python -m unittest discover -s tests -p "test_build_visual_lesson_attachment_manifest.py" -v
          python -m unittest discover -s tests -p "test_textbook_visual_end_to_end_contract.py" -v
          python -m unittest discover -s tests -p "test_update_visual_catalog_index.py" -v

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Resolve exact sources and verify mirrored extraction manifests
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          source_root="$RUNNER_TEMP/quantaedge-visual-source"
          mkdir -p "$source_root"
          for medium in english hindi; do
            image="ghcr.io/$owner/quantaedge-textbooks-class-$CLASS_NO-$medium:latest"
            echo "::group::Pull $image"
            docker pull "$image"
            container_id="$(docker create "$image" /__quantaedge_source_index_only)"
            docker cp "$container_id:/index.json" "$source_root/index-$medium.json"
            python scripts/select_textbook_visual_sources.py \
              --index "$source_root/index-$medium.json" \
              --class-no "$CLASS_NO" \
              --language "$medium" \
              --output "$source_root/selected-$medium.json"
            python scripts/validate_textbook_extraction_artifacts.py \
              --registry-index "$source_root/index-$medium.json" \
              --extraction-dir "$GITHUB_WORKSPACE/data/textbook-extractions/class-$CLASS_NO/$medium" \
              --class-no "$CLASS_NO" \
              --language "$medium"
            python - "$container_id" "$source_root/selected-$medium.json" "$source_root" "$GITHUB_WORKSPACE" "$CLASS_NO" "$medium" <<'PY'
          import hashlib, json, os, shutil, subprocess, sys
          from pathlib import Path
          from scripts.validate_textbook_extraction_artifacts import normalize_language, normalize_subject
          container_id, selection_arg, root_arg, repo_arg, class_no, language = sys.argv[1:]
          selection = json.loads(Path(selection_arg).read_text(encoding="utf-8"))
          root = Path(root_arg)
          repo = Path(repo_arg)
          manifest_dir = repo / "data" / "textbook-extractions" / f"class-{class_no}" / language / "pages"
          if not manifest_dir.is_dir():
              raise SystemExit(f"Committed extracted pages are missing: {manifest_dir}. Run the extraction pilot and mirror its verified artifact first.")
          for source in selection.get("sources", []):
              book_id = source["book_id"]
              book_dir = root / source["book_slug"]
              book_dir.mkdir(parents=True, exist_ok=False)
              pdf_path = book_dir / "source.pdf"
              subprocess.run(["docker", "cp", f"{container_id}:/{source['file']}", str(pdf_path)], check=True)
              digest = hashlib.sha256(pdf_path.read_bytes()).hexdigest()
              if digest != source["sha256"]:
                  raise SystemExit(f"{book_id}: source PDF SHA-256 differs from the selected GHCR index.")
              matches = []
              for manifest_path in manifest_dir.glob("*.manifest.json"):
                  try:
                      value = json.loads(manifest_path.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  if value.get("book_id") == book_id:
                      matches.append((manifest_path, value))
              if len(matches) != 1:
                  raise SystemExit(f"{book_id}: expected one committed source manifest matching this selected source, found {len(matches)}.")
              manifest_path, manifest = matches[0]
              manifest_hash = str(manifest.get("original_book_sha256") or manifest.get("asset_pdf_sha256") or "").lower()
              if manifest_hash != digest:
                  raise SystemExit(f"{book_id}: committed extraction manifest hash does not match the selected whole-book PDF.")
              if normalize_language(manifest.get("language")) != language:
                  raise SystemExit(f"{book_id}: manifest language does not match {language}.")
              if normalize_subject(manifest.get("subject")) != source["subject"]:
                  raise SystemExit(f"{book_id}: manifest subject does not match selected subject {source['subject']}.")
              if manifest.get("scope") != "SUBJECT_BOOK" or manifest.get("content_state") != "DRAFT_EXTRACTION_ONLY_REQUIRES_REVIEW":
                  raise SystemExit(f"{book_id}: expected a whole-book draft-only extraction manifest.")
              page_name = manifest.get("text_jsonl")
              if not isinstance(page_name, str) or Path(page_name).name != page_name or not page_name.endswith(".jsonl"):
                  raise SystemExit(f"{book_id}: unsafe/missing text_jsonl filename in manifest.")
              page_path = manifest_path.parent / page_name
              if not page_path.is_file():
                  raise SystemExit(f"{book_id}: sibling page JSONL is missing.")
              shutil.copy2(manifest_path, book_dir / "source.manifest.json")
              shutil.copy2(page_path, book_dir / page_name)
              source["extraction_manifest_repo_path"] = manifest_path.relative_to(repo).as_posix()
              source["text_jsonl_repo_path"] = page_path.relative_to(repo).as_posix()
              source["text_jsonl_filename"] = page_name
              (book_dir / "source-selection.json").write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(json.dumps({"book_id": book_id, "language": language, "subject": source["subject"], "slug": source["book_slug"], "sha256": digest}))
          # Keep original extraction references for correction-only rebuilds.
          Path(selection_arg).write_text(json.dumps(selection, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          subprocess.run(["docker", "rm", "-f", container_id], check=True)
          PY
            echo "::endgroup::"
          done
          python - "$source_root" "$CLASS_NO" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          grade = int(sys.argv[2])
          all_sources = []
          expected_per_language = 2 if grade == 6 else 3
          for language in ("english", "hindi"):
              value = json.loads((root / f"selected-{language}.json").read_text(encoding="utf-8"))
              if value.get("class") != grade or value.get("language") != language or len(value.get("sources", [])) != expected_per_language:
                  raise SystemExit(f"Invalid source set for Class {grade} {language}; expected {expected_per_language} books.")
              all_sources.extend(value["sources"])
          expected_total = expected_per_language * 2
          if len(all_sources) != expected_total or len({x["book_slug"] for x in all_sources}) != expected_total:
              raise SystemExit(f"Expected {expected_total} unique Class {grade} source books across English and Hindi; found {len(all_sources)}.")
          (root / "selected-sources.json").write_text(json.dumps({"class": grade, "sources": all_sources, "publication_allowed": False, "review_required": True}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"class": grade, "selected_source_count": len(all_sources), "maths_books_per_language": 1 if grade == 6 else 2, "science_books_per_language": 1, "languages": ["english", "hindi"], "publication_allowed": False}, indent=2))
          PY
          echo "VISUAL_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Build review-only candidate packs and attachment manifests for all six source books
        shell: bash
        run: |
          set -euo pipefail
          python - "$VISUAL_SOURCE_ROOT/selected-sources.json" "$VISUAL_SOURCE_ROOT" "$RUNNER_TEMP/visual-candidates-v3" "$GITHUB_WORKSPACE" <<'PY'
          import json, os, shutil, subprocess, sys
          from pathlib import Path
          selection_path, source_root_arg, output_root_arg, repo_arg = sys.argv[1:]
          selection = json.loads(Path(selection_path).read_text(encoding="utf-8"))
          source_root = Path(source_root_arg)
          output_root = Path(output_root_arg)
          repo = Path(repo_arg)
          output_root.mkdir(parents=True, exist_ok=True)
          for source in selection["sources"]:
              slug = source["book_slug"]
              work = source_root / slug
              out = output_root / slug
              inventory_dir = work / "inventory"
              subprocess.run([
                  sys.executable, "scripts/extract_visual_asset_inventory.py",
                  "--pdf", str(work / "source.pdf"),
                  "--manifest", str(work / "source.manifest.json"),
                  "--output-dir", str(inventory_dir),
                  "--preview-width", "1200",
              ], cwd=repo, check=True)
              subprocess.run([
                  sys.executable, "scripts/prepare_visual_candidates_v3.py",
                  "--inventory", str(inventory_dir / "visual-inventory.v1.json"),
                  "--pdf", str(work / "source.pdf"),
                  "--output-dir", str(out),
                  "--crop-scale", "2.0",
              ], cwd=repo, check=True)
              pack_path = out / "candidates.v3.json"
              pack = json.loads(pack_path.read_text(encoding="utf-8"))
              if pack.get("schema_version") != "quantaedge.visual-candidate-pack.v3":
                  raise SystemExit(f"{slug}: unexpected candidate pack schema.")
              if pack.get("summary", {}).get("selected_candidate_count", 0) < 1:
                  raise SystemExit(f"{slug}: candidate pack is empty.")
              if pack.get("summary", {}).get("publication_allowed") is not False:
                  raise SystemExit(f"{slug}: candidate pack must remain non-publishable.")
              for candidate in pack.get("candidates", []):
                  for key in ("display_path", "source_page_preview_path"):
                      target = (out / candidate[key]).resolve()
                      if out.resolve() not in target.parents or not target.is_file():
                          raise SystemExit(f"{slug}: missing/unsafe {key} for {candidate.get('candidate_id')}")
              out_in_repo = repo / "data" / "textbook-visual-candidates-v3" / slug
              out_in_repo.mkdir(parents=True, exist_ok=True)
              shutil.copy2(pack_path, out_in_repo / "candidates.v3.json")
              shutil.copy2(out / "summary.v3.json", out_in_repo / "summary.v3.json")
              shutil.copy2(out / "contact-sheet.jpg", out_in_repo / "contact-sheet.jpg")
              (out_in_repo / "source-selection.v1.json").write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              chapter_map = repo / "data" / "textbook-visual-candidates-v3" / slug / "chapter-map.v1.json"
              cmd = [
                  sys.executable, "scripts/build_visual_lesson_attachment_manifest.py",
                  "--candidate-pack", str(pack_path),
                  "--candidate-root", str(out),
                  "--repo-root", str(repo),
                  "--book-slug", slug,
                  "--output", str(repo / "data" / "textbook-visual-candidates-v3" / "catalogs" / f"{slug}.v3.json"),
              ]
              if chapter_map.is_file():
                  cmd.extend(["--chapter-map", str(chapter_map)])
              subprocess.run(cmd, cwd=repo, check=True)
              print(json.dumps({"book_id": source["book_id"], "slug": slug, "candidate_count": pack["summary"]["selected_candidate_count"], "publication_allowed": False}))
          PY

      - name: Install ORAS and authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          oras_archive="$RUNNER_TEMP/oras_1.2.0_linux_amd64.tar.gz"
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" \
            -o "$oras_archive"
          tar -xzf "$oras_archive" -C "$RUNNER_TEMP" oras
          sudo install -m 0755 "$RUNNER_TEMP/oras" /usr/local/bin/oras
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable per-book candidate packs and persist bundle indexes
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          source_root="$VISUAL_SOURCE_ROOT"
          pack_root="$RUNNER_TEMP/visual-candidates-v3"
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          package="ghcr.io/$owner/quantaedge-textbook-visuals"
          python - "$source_root/selected-sources.json" "$pack_root" "$GITHUB_WORKSPACE" "$package" "$GITHUB_RUN_ID" <<'PY'
          import hashlib, json, os, subprocess, sys, tarfile
          from pathlib import Path
          selection_path, pack_root_arg, repo_arg, package, run_id = sys.argv[1:]
          selection = json.loads(Path(selection_path).read_text(encoding="utf-8"))
          pack_root, repo = Path(pack_root_arg), Path(repo_arg)
          for source in selection["sources"]:
              slug = source["book_slug"]
              pack_dir = pack_root / slug
              out = repo / "data" / "textbook-visual-candidates-v3" / slug
              archive = pack_root / f"{slug}-candidates-v3.tar.gz"
              subprocess.run(["tar", "-C", str(pack_root), "-czf", str(archive), slug], check=True)
              bundle_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
              version_tag = f"candidates-v3-class{selection['class']}-{slug}-run-{run_id}"
              subprocess.run(["oras", "push", "--artifact-type", "application/vnd.quantaedge.textbook.visual-candidate-bundle.v3", f"{package}:{version_tag}", f"{archive.name}:application/gzip"], cwd=pack_root, check=True)
              pack = json.loads((pack_dir / "candidates.v3.json").read_text(encoding="utf-8"))
              summary = pack.get("summary", {})
              bundle_index = {
                  "schema_version": "quantaedge.visual-candidate-bundle-index.v3",
                  "book_slug": slug,
                  "class": selection["class"],
                  "language": source["language"],
                  "subject": source["subject"],
                  "maths_part": source.get("maths_part"),
                  "source_book_id": source["book_id"],
                  "source_pdf_sha256": source["sha256"],
                  "candidate_pack_schema": pack.get("schema_version"),
                  "candidate_count": summary.get("selected_candidate_count", 0),
                  "candidate_pages": summary.get("selected_page_numbers", []),
                  "publication_allowed": False,
                  "review_required": True,
                  "ghcr_package": package,
                  "artifact_type": "application/vnd.quantaedge.textbook.visual-candidate-bundle.v3",
                  "version_tag": version_tag,
                  "bundle_tar_sha256": bundle_sha,
                  "restore_note": "Authenticate to ghcr.io, pull this exact ORAS artifact version, and verify bundle_tar_sha256 before review. Full crops, source-page previews, contact sheets and original image objects are in the immutable package."
              }
              (out / "bundle-index.v3.json").write_text(json.dumps(bundle_index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(json.dumps({"book_id": source["book_id"], "slug": slug, "package": package, "tag": version_tag, "bundle_sha256": bundle_sha, "candidate_count": bundle_index["candidate_count"], "publication_allowed": False}))
          PY

      - name: Rebuild the catalog, test candidate-to-content contracts, and commit the full batch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_visual_catalog_index.py --catalog-dir data/textbook-visual-candidates-v3/catalogs --output data/textbook-visual-candidates-v3/index.v1.json
          python -m unittest discover -s tests -p "test_build_visual_lesson_attachment_manifest.py" -v
          python -m unittest discover -s tests -p "test_textbook_visual_end_to_end_contract.py" -v
          python -m unittest discover -s tests -p "test_update_visual_catalog_index.py" -v
          python -m unittest discover -s tests -p "test_pipeline_data_locations.py" -v
          python scripts/validate_pipeline_data_locations.py --repo-root "$GITHUB_WORKSPACE"
          git add -A data/textbook-visual-candidates-v3
          python scripts/validate_pipeline_data_locations.py --repo-root "$GITHUB_WORKSPACE"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(ai): prepare Class $CLASS_NO bilingual visual candidate batch"
          else
            echo "The candidate metadata and media manifest already match main; no Git commit required."
            exit 0
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Persisted review-only visual candidates for every required NCERT Maths and Science source book in English and Hindi. All candidate packs remain non-publishable."


      - name: Start Ollama container and load vision model for Layer 4
        if: inputs.analysis_mode == 'analyze_all'
        shell: bash
        run: |
          set -euo pipefail
          docker pull ollama/ollama:latest
          docker volume create quantaedge-ollama-models >/dev/null
          docker run -d --name quantaedge-ollama -p 11434:11434 -v quantaedge-ollama-models:/root/.ollama ollama/ollama:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || { docker logs quantaedge-ollama; exit 1; }
          docker exec quantaedge-ollama ollama pull "$VISION_MODEL"

      - name: Run exhaustive, resumable Layers 4–5 for the selected class
        if: inputs.analysis_mode == 'analyze_all'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quantaedge_textbook_pipeline.py run \
            --selection "$VISUAL_SOURCE_ROOT/selected-sources.json" \
            --source-root "$VISUAL_SOURCE_ROOT" \
            --repo-root "$GITHUB_WORKSPACE" \
            --package "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quantaedge-textbook-visuals" \
            --run-id "$GITHUB_RUN_ID" \
            --model "$VISION_MODEL" \
            --batch-size 5

      - name: Stop Ollama container
        if: always() && inputs.analysis_mode == 'analyze_all'
        run: docker rm -f quantaedge-ollama >/dev/null 2>&1 || true

      - name: Summarize integrated eight-layer pipeline
        if: always() && inputs.analysis_mode == 'analyze_all'
        shell: bash
        run: |
          {
            echo "## QuantaEdge eight-layer textbook pipeline"
            echo "- Executed here: Layers 1–5. Layers 6–8 are implemented in the separate budgeted per-book workflow; benchmark the model first, then generate review-only drafts."
            echo "- No visual/candidate total cap; batch size is a checkpoint interval only."
            echo "- All generated data remains review-only; publication_allowed=false."
          } >> "$GITHUB_STEP_SUMMARY"

  rebuild-correction-coverage:
    if: github.event_name == 'push' && contains(toJson(github.event.commits), 'visual-analysis-corrections.v1.json')
    name: Rebuild Layer 5 after correction overlay changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild affected ledgers without rerunning Layer 4
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/quantaedge_textbook_pipeline.py
          python -m unittest discover -s tests -p "test_quantaedge_textbook_pipeline.py" -v
          python scripts/quantaedge_textbook_pipeline.py rebuild-corrections --event "$GITHUB_EVENT_PATH" --repo-root "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/textbook-content-pipeline
          if ! git diff --cached --quiet; then
            git commit -m "rebuild(content): propagate accepted visual corrections"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
