name: Inspect TRE source archive

on:
  pull_request:
    branches: [main]
    paths:
      - "data/TRE-4_PYQ.zip"
      - "scripts/inspect_tre_source_archive.py"
      - ".github/workflows/tre-source-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    name: Inspect paper bundle (temporary artifact only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Inventory PDFs and extract page-addressable text
        run: |
          python scripts/inspect_tre_source_archive.py \
            --archive data/TRE-4_PYQ.zip \
            --output-dir "$RUNNER_TEMP/tre-source-inspection"

      - name: Upload temporary inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: tre-source-inspection
          path: ${{ runner.temp }}/tre-source-inspection/
          if-no-files-found: error
          retention-days: 3
