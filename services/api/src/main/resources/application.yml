spring:
  application:
    name: quantaedge-api
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:512MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quantaedge}
    username: ${SPRING_DATASOURCE_USERNAME:quantaedge}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
app:
  environment: ${APP_ENVIRONMENT:local}
  media:
    storage-dir: ${APP_MEDIA_STORAGE_DIR:/var/lib/quantaedge/media}
  certificates:
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
    storage-dir: ${APP_CERTIFICATE_STORAGE_DIR:/var/lib/quantaedge/media/certificates}
    assessment-pass-percent: ${APP_CERTIFICATES_ASSESSMENT_PASS_PERCENT:80}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
  demo-seed: ${APP_DEMO_SEED:false}
  admin:
    content-token: ${APP_ADMIN_CONTENT_TOKEN:}
  auth:
    session-hours: ${APP_AUTH_SESSION_HOURS:4}
    staff-absolute-hours: ${APP_AUTH_STAFF_ABSOLUTE_HOURS:8}
    learning-absolute-days: ${APP_AUTH_LEARNING_ABSOLUTE_DAYS:30}
    secure-cookies: ${APP_AUTH_SECURE_COOKIES:true}
    otp-cooldown-seconds: ${APP_AUTH_OTP_COOLDOWN_SECONDS:60}
    allow-repeated-demo-otp: ${APP_AUTH_ALLOW_REPEATED_DEMO_OTP:false}
    admin-mobiles: ${APP_AUTH_ADMIN_MOBILES:}
    hrms-bootstrap-password: ${APP_HRMS_BOOTSTRAP_PASSWORD:}
    workspace-origins:
      education-admin: ${APP_AUTH_EDUCATION_ADMIN_ORIGINS:http://localhost:3001}
      hrms: ${APP_AUTH_HRMS_ORIGINS:http://localhost:3002}
      learning: ${APP_AUTH_LEARNING_ORIGINS:http://localhost:3000}
    max-children-per-parent: ${APP_AUTH_MAX_CHILDREN_PER_PARENT:3}
  ai-tutor:
    enabled: ${APP_AI_TUTOR_ENABLED:false}
    primary:
      api-key: ${APP_AI_TUTOR_PRIMARY_API_KEY:local-inference}
      model: ${APP_AI_TUTOR_PRIMARY_MODEL:qwen2.5:0.5b}
      base-url: ${APP_AI_TUTOR_PRIMARY_BASE_URL:http://ollama:11434}
      api-mode: ${APP_AI_TUTOR_PRIMARY_API_MODE:CHAT_COMPLETIONS}
    fallback:
      enabled: ${APP_AI_TUTOR_FALLBACK_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: ${APP_AI_TUTOR_FALLBACK_MODEL:gpt-5.6-luna}
      base-url: ${APP_AI_TUTOR_FALLBACK_BASE_URL:https://api.openai.com}
      api-mode: ${APP_AI_TUTOR_FALLBACK_API_MODE:RESPONSES}
    max-output-tokens: ${APP_AI_TUTOR_MAX_OUTPUT_TOKENS:500}
    min-output-chars: ${APP_AI_TUTOR_MIN_OUTPUT_CHARS:8}
    max-message-chars: ${APP_AI_TUTOR_MAX_MESSAGE_CHARS:1200}
    max-messages-per-10m: ${APP_AI_TUTOR_MAX_MESSAGES_PER_10M:20}
    max-messages-per-day: ${APP_AI_TUTOR_MAX_MESSAGES_PER_DAY:100}
    history-messages: ${APP_AI_TUTOR_HISTORY_MESSAGES:10}
  google-meet:
    client-id: ${GOOGLE_MEET_CLIENT_ID:}
    client-secret: ${GOOGLE_MEET_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_MEET_REFRESH_TOKEN:}
    calendar-id: ${GOOGLE_MEET_CALENDAR_ID:primary}
    time-zone: ${GOOGLE_MEET_TIME_ZONE:Asia/Kolkata}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: 8080
