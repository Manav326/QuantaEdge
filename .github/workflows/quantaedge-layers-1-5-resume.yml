name: Resume Class 6 NCERT Curiosity Layers 1-5 evidence ledger

on:
  push:
    branches: ["main"]
    paths:
      - ".github/triggers/layers1-5-class6-curiosity.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qe-layers-1-5-class6-curiosity
  cancel-in-progress: false

jobs:
  repair-evidence:
    name: Retry failed visual evidence and rebuild the real Layer 5 ledger
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main with durable checkpoint access
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate visual analysis and ledger contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/analyze_visual_inventory_with_ollama.py scripts/quantaedge_textbook_pipeline.py
          python -m unittest discover -s tests -p "test_analyze_visual_inventory_with_ollama.py" -v
          python -m unittest discover -s tests -p "test_quantaedge_textbook_pipeline.py" -v
      - name: Preflight durable source and coverage checkpoint before model startup
        id: recovery_preflight
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path.cwd()
          inventory = root / "data/textbook-visuals/class6-curiosity-en/visual-inventory.v1.json"
          raw = root / "data/textbook-visuals/class6-curiosity-en/visual-analysis-qwen2.5vl-3b.v1.json"
          manifest = root / "data/textbook-extractions/class-6/english/pages/7e6c3a6ba4f80aa15120f446fb66614c3cec7c17462414d410d7be66c3ca8b73.manifest.json"
          text_jsonl = root / "data/textbook-extractions/class-6/english/pages/7e6c3a6ba4f80aa15120f446fb66614c3cec7c17462414d410d7be66c3ca8b73.jsonl"
          missing = [str(p.relative_to(root)) for p in (inventory, raw, manifest, text_jsonl) if not p.is_file()]
          if missing:
              raise SystemExit("Resume stopped before model startup; verified source/checkpoint files are missing: " + ", ".join(missing))
          ledger_path = root / "data/textbook-content-pipeline/class-6/books/class6-curiosity-en/coverage-ledger.v1.json"
          needs_repair = True
          ledger_status = "MISSING"
          if ledger_path.is_file():
              ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
              ledger_status = ledger.get("ledger_status", "UNKNOWN")
              source = ledger.get("source") if isinstance(ledger.get("source"), dict) else {}
              if (ledger_status == "COMPLETE"
                  and source.get("source_book_id") == "ncert-c6-english-fecu1"
                  and str(source.get("source_pdf_sha256") or "").lower() == "7e6c3a6ba4f80aa15120f446fb66614c3cec7c17462414d410d7be66c3ca8b73"
                  and ledger.get("publication_allowed") is False
                  and ledger.get("human_review_required") is True):
                  needs_repair = False
          print(json.dumps({"source_book_id":"ncert-c6-english-fecu1","layer5_status":ledger_status,"needs_repair":needs_repair}))
          with open(sys.argv[1], "a", encoding="utf-8") as out:
              out.write(f"needs_repair={str(needs_repair).lower()}\n")
          PY
      - name: Restore the model cache when available
        if: steps.recovery_preflight.outputs.needs_repair == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-model-qwen2.5vl:3b
      - name: Start local Ollama and load the existing vision model
        if: steps.recovery_preflight.outputs.needs_repair == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "$RUNNER_TEMP/ollama-vision.log" 2>&1 &)
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then ready=true; break; fi
            sleep 2
          done
          [[ "$ready" == true ]] || { cat "$RUNNER_TEMP/ollama-vision.log"; exit 1; }
          ollama pull qwen2.5vl:3b
      - name: Retry pending/error visuals with one-asset durable savepoints
        if: steps.recovery_preflight.outputs.needs_repair == 'true'
        shell: bash
        run: |
          set -euo pipefail
          INVENTORY="data/textbook-visuals/class6-curiosity-en/visual-inventory.v1.json"
          RAW="data/textbook-visuals/class6-curiosity-en/visual-analysis-qwen2.5vl-3b.v1.json"
          [[ -f "$INVENTORY" && -f "$RAW" ]] || {
            echo "Existing committed inventory/model checkpoint is missing; refusing to invent a fresh ledger."
            exit 2
          }
          for batch in $(seq 1 80); do
            python scripts/analyze_visual_inventory_with_ollama.py \
              --inventory "$INVENTORY" --model qwen2.5vl:3b \
              --max-assets 1 --include-page-previews \
              --run-id "$GITHUB_RUN_ID" --timeout 360 \
              --num-ctx 8192 --num-predict 1024 \
              --output "$RAW" --resume
            processed="$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1], encoding="utf-8"))["summary"].get("assets_processed_this_run", 0)))' "$RAW")"
            git add -- "$RAW"
            python scripts/validate_pipeline_data_locations.py --repo-root "$GITHUB_WORKSPACE"
            if ! git diff --cached --quiet -- "$RAW"; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "checkpoint(content): retry Curiosity visual evidence batch $batch"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            echo "Batch $batch processed $processed checkpointed visual assets."
            if [[ "$processed" == "0" ]]; then break; fi
          done
      - name: Rebuild the canonical analysis and Layer 5 ledger from source evidence
        if: steps.recovery_preflight.outputs.needs_repair == 'true'
        id: ledger
        shell: bash
        run: |
          set -euo pipefail
          VIS="data/textbook-visuals/class6-curiosity-en"
          BOOK_HASH="7e6c3a6ba4f80aa15120f446fb66614c3cec7c17462414d410d7be66c3ca8b73"
          MANIFEST="data/textbook-extractions/class-6/english/pages/$BOOK_HASH.manifest.json"
          TEXT_JSONL="data/textbook-extractions/class-6/english/pages/$BOOK_HASH.jsonl"
          LAYER="data/textbook-content-pipeline/class-6/books/class6-curiosity-en"
          mkdir -p "$LAYER"
          cp "$VIS/visual-analysis-qwen2.5vl-3b.v1.json" "$VIS/visual-analysis.v1.json"
          python scripts/quantaedge_textbook_pipeline.py ledger \
            --inventory "$VIS/visual-inventory.v1.json" \
            --raw-analysis "$VIS/visual-analysis-qwen2.5vl-3b.v1.json" \
            --manifest "$MANIFEST" --text-jsonl "$TEXT_JSONL" \
            --effective-output "$LAYER/visual-analysis-effective.v1.json" \
            --ledger-output "$LAYER/coverage-ledger.v1.json" \
            --corrections "$LAYER/visual-analysis-corrections.v1.json" \
            --repo-root "$GITHUB_WORKSPACE"
          python - <<'PY'
          import json, os
          from pathlib import Path
          ledger = json.loads(Path("data/textbook-content-pipeline/class-6/books/class6-curiosity-en/coverage-ledger.v1.json").read_text(encoding="utf-8"))
          summary = ledger.get("summary", {})
          print(json.dumps({
              "ledger_status": ledger.get("ledger_status"),
              "source_book_id": (ledger.get("source") or {}).get("source_book_id"),
              "source_pdf_sha256": (ledger.get("source") or {}).get("source_pdf_sha256"),
              "pages_with_unresolved_text": summary.get("pages_with_unresolved_text"),
              "failed_visual_analyses": summary.get("failed_visual_analyses"),
              "missing_visual_analyses": summary.get("missing_visual_analyses"),
              "orphan_analysis_results": summary.get("orphan_analysis_results"),
              "unresolved_count": summary.get("unresolved_count"),
          }, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ledger_status={ledger.get('ledger_status')}\n")
          PY
      - name: Commit analysis and evidence ledger, even when review gaps remain
        if: always() && steps.recovery_preflight.outputs.needs_repair == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            data/textbook-visuals/class6-curiosity-en/visual-analysis-qwen2.5vl-3b.v1.json \
            data/textbook-visuals/class6-curiosity-en/visual-analysis.v1.json \
            data/textbook-content-pipeline/class-6/books/class6-curiosity-en/visual-analysis-effective.v1.json \
            data/textbook-content-pipeline/class-6/books/class6-curiosity-en/coverage-ledger.v1.json
          python scripts/validate_pipeline_data_locations.py --repo-root "$GITHUB_WORKSPACE"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "checkpoint(content): rebuild Curiosity Layer 5 evidence ledger"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require true Layer 5 completeness for downstream generation
        if: steps.recovery_preflight.outputs.needs_repair == 'true' && steps.ledger.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          status="$(python -c 'import json; print(json.load(open("data/textbook-content-pipeline/class-6/books/class6-curiosity-en/coverage-ledger.v1.json", encoding="utf-8"))["ledger_status"])')"
          if [[ "$status" != "COMPLETE" ]]; then
            echo "Layer 5 remains $status. The ledger and raw checkpoint were committed, but Layers 6-8 generation remains safely blocked."
            exit 3
          fi
