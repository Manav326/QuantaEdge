name: Resume Class 6–8 Layer 4–5 checkpoints

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: textbook-layer45-resume-coordinator
  cancel-in-progress: false

jobs:
  inspect-and-resume:
    name: Resume only classes that still need Layer 5 work
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile active runs and dispatch checkpoint resumes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          control="data/textbook-content-pipeline/resume-control.v1.json"
          if [[ ! -f "$control" ]]; then
            echo "No Layer 4–5 continuation control is present."
            exit 0
          fi
          active="$(python - "$control" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("true" if d.get("schema_version")=="quantaedge.textbook-layer45-resume-control.v1" and d.get("active") is True and d.get("classes")==[6,7,8] else "false")
          PY
          )"
          if [[ "$active" != "true" ]]; then
            echo "Layer 4–5 automatic continuation is inactive."
            exit 0
          fi

          curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/textbook-visual-candidates-v3.yml/runs?branch=main&per_page=100" \
            -o "$RUNNER_TEMP/layer45-runs.json"
          active_run_ids="$(python - "$RUNNER_TEMP/layer45-runs.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          rows=d.get("workflow_runs",[])
          active=[r for r in rows if r.get("status") in {"queued","in_progress","requested"} and r.get("head_branch")=="main"]
          for r in active:
              print(r.get("id",""))
          print(f"ACTIVE_COUNT={len(active)}")
          PY
          )"
          printf '%s\n' "$active_run_ids"
          active_count="$(grep -cE '^[0-9]+$' <<< "$active_run_ids" || true)"
          if [[ "$active_count" -gt 0 ]]; then
            stale_cancelled=false
            while IFS= read -r run_id; do
              [[ "$run_id" =~ ^[0-9]+$ ]] || continue
              curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                -o "$RUNNER_TEMP/layer45-jobs-$run_id.json"
              stale="$(python - "$RUNNER_TEMP/layer45-jobs-$run_id.json" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          now=datetime.now(timezone.utc)
          for job in data.get("jobs",[]):
              for step in job.get("steps",[]):
                  if step.get("name") != "Run exhaustive, resumable Layers 4–5 for the selected class" or step.get("status") != "in_progress":
                      continue
                  started=step.get("started_at")
                  if not started:
                      continue
                  try:
                      at=datetime.fromisoformat(started.replace("Z","+00:00"))
                  except ValueError:
                      continue
                  age=(now-at).total_seconds()
                  print(f"step_age_seconds={int(age)} job={job.get('name')}")
                  if age >= 1800:
                      print("true")
                      raise SystemExit(0)
          print("false")
          PY
              )"
              if [[ "$stale" == *true ]]; then
                echo "Run $run_id has a Layer 4–5 processing step idle for at least 30 minutes; cancelling only the stuck runner. Its per-asset and per-batch checkpoints remain the source of truth."
                code="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$RUNNER_TEMP/cancel-$run_id.json" -w '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$run_id/cancel")"
                if [[ "$code" != "202" && "$code" != "409" ]]; then
                  echo "Could not safely cancel stale run $run_id (HTTP $code):"
                  cat "$RUNNER_TEMP/cancel-$run_id.json"
                  exit 1
                fi
                stale_cancelled=true
              fi
            done <<< "$active_run_ids"
            if [[ "$stale_cancelled" == "true" ]]; then
              echo "Stale runner cancellation requested. The next coordinator tick will dispatch resume mode from the persisted checkpoints."
              exit 0
            fi
            echo "A Layer 4–5 workflow is already queued or running and has not crossed the stale-run threshold; no duplicate resume will be dispatched."
            exit 0
          fi

          pending="$(python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/textbook-content-pipeline/resume-control/completed")
          pending=[]
          for grade in (6,7,8):
              p=root/f"class-{grade}.v1.json"
              try:
                  d=json.loads(p.read_text(encoding="utf-8"))
                  complete=(d.get("schema_version")=="quantaedge.textbook-layer45-class-completion.v1" and d.get("class_no")==grade and d.get("status")=="COMPLETE")
              except (OSError,json.JSONDecodeError):
                  complete=False
              if not complete: pending.append(str(grade))
          print(" ".join(pending))
          PY
          )"
          if [[ -z "$pending" ]]; then
            python - "$control" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path(sys.argv[1]);d=json.loads(p.read_text(encoding="utf-8"))
          d["active"]=False;d["status"]="COMPLETE";d["completed_at"]=datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$control"
            if ! git diff --cached --quiet; then
              git commit -m "status(content): all Class 6-8 Layer 5 ledgers complete"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            echo "All three classes have durable completion markers; automatic continuation disabled."
            exit 0
          fi

          for class_no in $pending; do
            payload="$(python - "$class_no" <<'PY'
          import json,sys
          print(json.dumps({"ref":"main","inputs":{"class_no":sys.argv[1],"analysis_mode":"resume_layers_4_5","vision_model":"qwen2.5vl:3b","checkpoint_batch_size":"5"}}))
          PY
          )"
            code="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$RUNNER_TEMP/dispatch-$class_no.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/textbook-visual-candidates-v3.yml/dispatches" \
              -d "$payload")"
            if [[ "$code" != "204" ]]; then
              echo "Class $class_no resume dispatch failed (HTTP $code):"
              cat "$RUNNER_TEMP/dispatch-$class_no.json"
              exit 1
            fi
            echo "Dispatched Layer 4–5 checkpoint resume for Class $class_no."
          done
