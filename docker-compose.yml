services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantaedge}
      POSTGRES_USER: ${POSTGRES_USER:-quantaedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quantaedge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - quantaedge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ./services/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-quantaedge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-quantaedge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      APP_DEMO_SEED: ${APP_DEMO_SEED:-true}
      APP_ADMIN_CONTENT_TOKEN: ${QUANTAEDGE_ADMIN_TOKEN:-}
      APP_AUTH_ADMIN_MOBILES: ${APP_AUTH_ADMIN_MOBILES:-}
      APP_AUTH_SESSION_HOURS: ${APP_AUTH_SESSION_HOURS:-168}
      APP_AUTH_SECURE_COOKIES: ${APP_AUTH_SECURE_COOKIES:-false}
      APP_AUTH_OTP_COOLDOWN_SECONDS: ${APP_AUTH_OTP_COOLDOWN_SECONDS:-60}
      APP_OTP_PROVIDER_URL: ${APP_OTP_PROVIDER_URL:-}
      APP_OTP_PROVIDER_TOKEN: ${APP_OTP_PROVIDER_TOKEN:-}
      APP_AI_TUTOR_ENABLED: ${APP_AI_TUTOR_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_AI_TUTOR_MODEL: ${APP_AI_TUTOR_MODEL:-gpt-5.6-luna}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
    environment:
      BACKEND_INTERNAL_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
  admin:
    build:
      context: ./apps/admin
    environment:
      BACKEND_INTERNAL_URL: http://api:8080
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    depends_on:
      - api
volumes:
  quantaedge_postgres:
  quantaedge_redis:
