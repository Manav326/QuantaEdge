name: QuantaEdge CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

concurrency:
  group: quantaedge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      admin: ${{ steps.detect.outputs.admin }}
      integration: ${{ steps.detect.outputs.integration }}
      full: ${{ steps.detect.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          FULL_AUDIT: ${{ inputs.full_audit || false }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            BASE="$(git merge-base HEAD "origin/$BASE_REF")"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          else
            BASE=""
          fi
          if [ -n "$BASE" ]; then files="$(git diff --name-only "$BASE" HEAD)"; else files="$(git ls-files)"; fi
          api=false; web=false; admin=false; full=false
          printf '%s\n' "$files" | grep -qE '^services/api/' && api=true || true
          printf '%s\n' "$files" | grep -qE '^apps/web/' && web=true || true
          printf '%s\n' "$files" | grep -qE '^apps/admin/' && admin=true || true
          if printf '%s\n' "$files" | grep -qE '^docker-compose\.(yml|yaml)$|^\.github/workflows/|^scripts/|^tests/'; then full=true; fi
          if [ "$REF_NAME" = "main" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FULL_AUDIT" = "true" ]; }; then full=true; fi
          if [ "$full" = "true" ]; then api=true; web=true; admin=true; fi
          integration=false
          if [ "$api" = "true" ] || [ "$full" = "true" ]; then integration=true; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.full == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.full == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate API
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.full == 'true'
        working-directory: services/api
        run: mvn -B -ntp verify

      - name: Set up Node
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.full == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.full == 'true'
        working-directory: apps/web
        run: npm install

      - name: Build web
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.full == 'true'
        working-directory: apps/web
        run: npm run build

      - name: Install admin dependencies
        if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.full == 'true'
        working-directory: apps/admin
        run: npm install

      - name: Build admin
        if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.full == 'true'
        working-directory: apps/admin
        run: npm run build

  docker:
    name: Build affected Docker images
    runs-on: ubuntu-latest
    needs: [changes, validate]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        if: needs.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: false
          tags: quantaedge-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          tags: quantaedge-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build admin image
        if: needs.changes.outputs.admin == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin
          push: false
          tags: quantaedge-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  integration:
    name: Functional integration audit
    runs-on: ubuntu-latest
    needs: [changes, docker]
    if: needs.changes.outputs.integration == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local stack
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for curriculum API
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/audit.json
          for i in {1..150}; do
            api_id="$(docker compose -f docker-compose.yml ps -q api || true)"
            if [ -n "$api_id" ]; then
              status="$(docker inspect -f '{{.State.Status}}' "$api_id")"
              if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
                echo "API container stopped before becoming ready."
                docker inspect "$api_id" --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}'
                docker compose -f docker-compose.yml logs --no-color --tail=300 api
                exit 1
              fi
            fi
            if curl --connect-timeout 2 --max-time 5 -fsS http://localhost:8080/api/v1/curriculum/audit/strict > /tmp/audit.json; then
              echo "Curriculum API is ready after $((i * 2)) seconds."
              break
            fi
            sleep 2
          done
          if [ ! -s /tmp/audit.json ]; then
            echo "Curriculum API did not become ready within 5 minutes."
            docker compose -f docker-compose.yml ps -a
            echo "===== API inspect ====="
            docker inspect "$(docker compose -f docker-compose.yml ps -q api)" --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} RestartCount={{.RestartCount}} Error={{.State.Error}}'
            echo "===== API logs ====="
            docker compose -f docker-compose.yml logs --no-color --tail=300 api
            exit 1
          fi
          cat /tmp/audit.json

      - name: Require strict curriculum GREEN
        shell: bash
        run: |
          set -euo pipefail
          status="$(python -c 'import json; print(json.load(open("/tmp/audit.json"))["status"])')"
          test "$status" = "GREEN"

      - name: Smoke-test authenticated learning journey
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/student >/dev/null
          curl -fsS http://localhost:3001/ >/dev/null

          rm -f /tmp/qe.cookies
          curl -fsS -c /tmp/qe.cookies -H 'Content-Type: application/json' \
            -d '{"mobile":"7070107483","purpose":"LOGIN"}' \
            http://localhost:8080/api/v1/auth/request-otp >/tmp/qe-otp.json
          test "$(python -c 'import json; print(json.load(open("/tmp/qe-otp.json")).get("devCode",""))')" = "000000"

          curl -fsS -b /tmp/qe.cookies -c /tmp/qe.cookies -H 'Content-Type: application/json' \
            -d '{"mobile":"7070107483","otp":"000000","displayName":"CI Parent"}' \
            http://localhost:8080/api/v1/auth/verify-otp >/tmp/qe-parent.json

          curl -fsS -b /tmp/qe.cookies http://localhost:8080/api/v1/guardians/children >/tmp/qe-children.json
          curl -fsS -b /tmp/qe.cookies -H 'Content-Type: application/json' \
            -d '{"displayName":"CI Student","classCode":"7","language":"hi","pin":"1234","consentAccepted":true}' \
            http://localhost:8080/api/v1/guardians/children >/tmp/qe-child.json
          CHILD_ID="$(python -c 'import json; print(json.load(open("/tmp/qe-child.json"))["id"])')"

          curl -fsS -b /tmp/qe.cookies -c /tmp/qe.cookies -H 'Content-Type: application/json' \
            -d "{\"studentId\":${CHILD_ID}}" \
            http://localhost:8080/api/v1/auth/select-student >/tmp/qe-select.json

          curl -fsS -b /tmp/qe.cookies http://localhost:8080/api/v1/students/me >/tmp/qe-student.json
          python - <<'PY'
          import json
          student=json.load(open('/tmp/qe-student.json'))
          assert student["class_code"] == "7"
          assert "lessonStats" in student
          assert "mastery" in student
          PY

          curl -fsS http://localhost:8080/api/v1/system/status >/tmp/qe-status.json
          python - <<'PY'
          import json
          status=json.load(open('/tmp/qe-status.json'))
          assert status["status"] == "ok"
          assert status["aiTutorEnabled"] is False
          PY

          curl -fsS 'http://localhost:8080/api/v1/learning/lessons?classCode=7&subjectCode=maths' >/tmp/qe-lessons.json
          LESSON_ID="$(python -c 'import json; print(json.load(open("/tmp/qe-lessons.json"))[0]["id"])')"

          curl -fsS -b /tmp/qe.cookies -H 'Content-Type: application/json' \
            -d "{\"lessonId\":$LESSON_ID}" \
            http://localhost:8080/api/v1/tutor/sessions >/tmp/qe-tutor-session.json
          python - <<'PY'
          import json
          tutor=json.load(open('/tmp/qe-tutor-session.json'))
          assert tutor["available"] is False
          assert tutor["sessionId"] > 0
          PY

          curl -fsS -b /tmp/qe.cookies http://localhost:8080/api/v1/recommendations/next >/tmp/qe-rec.json
          python - <<'PY'
          import json
          rec=json.load(open('/tmp/qe-rec.json'))
          assert rec.get("available") is True
          assert rec.get("kind") == "DIAGNOSTIC"
          PY

          curl -fsS -b /tmp/qe.cookies http://localhost:8080/api/v1/diagnostic >/tmp/qe-diagnostic.json
          python - <<'PY'
          import json
          diagnostic=json.load(open('/tmp/qe-diagnostic.json'))
          assert diagnostic["completed"] is False
          assert len(diagnostic["questions"]) > 0
          assert diagnostic["questions"][0]["options"] != "[]"
          PY

          curl -fsS -b /tmp/qe.cookies -X POST -H 'Content-Type: application/json' \
            -d '{"answer":"A"}' \
            http://localhost:8080/api/v1/learning/questions/$(python -c 'import json; print(json.load(open("/tmp/qe-diagnostic.json"))["questions"][0]["id"])')/answer >/tmp/qe-answer.json
          python - <<'PY'
          import json
          answer=json.load(open('/tmp/qe-answer.json'))
          assert "autoGraded" in answer
          assert "correct" in answer
          PY

          curl -fsS -b /tmp/qe.cookies http://localhost:8080/api/v1/learning/lessons/$LESSON_ID >/tmp/qe-lesson.json
          python - <<'PY'
          import json, subprocess
          lesson=json.load(open('/tmp/qe-lesson.json'))
          questions=lesson.get('questions',[])
          assert questions, 'lesson must expose learner questions'
          expected={
            'MCQ':'A','TRUE_FALSE':'B','MATCH':{'1':'A','2':'B','3':'C'},
            'ORDER':['B','C','D','A']
          }
          for q in questions:
            typ=q['question_type']
            answer=expected.get(typ,'CI learner response')
            body=json.dumps({'answer':answer})
            subprocess.run([
              'curl','-fsS','-b','/tmp/qe.cookies','-H','Content-Type: application/json',
              '-d',body,
              f"http://localhost:8080/api/v1/learning/questions/{q['id']}/answer"
            ],check=True,stdout=subprocess.DEVNULL)
          PY
          curl -fsS -b /tmp/qe.cookies http://localhost:8080/api/v1/students/me >/tmp/qe-student-after-lesson.json
          python - <<'PY'
          import json
          student=json.load(open('/tmp/qe-student-after-lesson.json'))
          assert student["lessonStats"]["completed_lessons"] >= 1
          PY


          curl -fsS -b /tmp/qe.cookies -c /tmp/qe.cookies -X POST             http://localhost:8080/api/v1/auth/switch-parent >/tmp/qe-parent-switch.json
          curl -fsS -b /tmp/qe.cookies http://localhost:8080/api/v1/guardians/children >/tmp/qe-children-after-switch.json

          rm -f /tmp/qe-admin.cookies /tmp/qe-admin-otp.json
          curl -fsS -c /tmp/qe-admin.cookies -H 'Content-Type: application/json'             -d '{"mobile":"7070107483","purpose":"LOGIN"}'             http://localhost:8080/api/v1/auth/request-otp >/tmp/qe-admin-otp.json
          test "$(python -c 'import json; print(json.load(open("/tmp/qe-admin-otp.json")).get("devCode",""))')" = "000000"
          curl -fsS -b /tmp/qe-admin.cookies -c /tmp/qe-admin.cookies -H 'Content-Type: application/json'             -d '{"mobile":"7070107483","otp":"000000"}'             http://localhost:8080/api/v1/auth/verify-otp >/tmp/qe-admin-login.json
          test "$(python -c 'import json; print(json.load(open("/tmp/qe-admin-login.json"))["role"])')" = "ADMIN"
          curl -fsS -b /tmp/qe-admin.cookies http://localhost:8080/api/v1/admin/overview >/tmp/qe-admin-overview.json
          curl -fsS -b /tmp/qe-admin.cookies http://localhost:8080/api/v1/admin/tutor/analytics >/tmp/qe-admin-tutor.json
          python - <<'PY'
          import json
          tutor=json.load(open('/tmp/qe-admin-tutor.json'))
          assert "summary" in tutor
          assert "modes" in tutor
          PY

          curl -fsS -b /tmp/qe-admin.cookies -H 'Content-Type: application/json'             -d '{"sourceKind":"BOARD_PAST_PAPER","title":"CI Verified Source","provider":"QuantaEdge CI","sourceUrl":"https://example.invalid/ci","edition":"test","language":"hi","sourceYear":2026,"status":"REFERENCE"}'             http://localhost:8080/api/v1/admin/sources >/tmp/qe-source.json
          SOURCE_ID="$(python -c 'import json; print(json.load(open("/tmp/qe-source.json"))["id"])')"

          curl -fsS -b /tmp/qe-admin.cookies http://localhost:8080/api/v1/admin/lessons >/tmp/qe-admin-lessons.json
          LESSON_ID="$(python -c 'import json; print(json.load(open("/tmp/qe-admin-lessons.json"))[0]["id"])')"
          test "$LESSON_ID" != "0"
          curl -fsS -b /tmp/qe-admin.cookies http://localhost:8080/api/v1/admin/lessons/$LESSON_ID >/tmp/qe-admin-lesson.json
          BLOCK_ID="$(python -c 'import json; print(json.load(open("/tmp/qe-admin-lesson.json"))["blocks"][0]["id"])')"
          test "$BLOCK_ID" != "0"
          curl -fsS -b /tmp/qe-admin.cookies -H 'Content-Type: application/json'             -d "{\"lessonId\":${LESSON_ID},\"sourceKind\":\"BOARD_PAST_PAPER\",\"sourceId\":${SOURCE_ID},\"sourceTitle\":\"CI Verified Source\",\"sourceRef\":\"ci://verified-question-1\",\"sourceYear\":2026,\"board\":\"Bihar Board\",\"questions\":[{\"questionType\":\"SHORT_ANSWER\",\"prompt\":\"CI provenance test question\",\"explanation\":\"Imported for CI provenance validation\",\"sortOrder\":99,\"tags\":[\"ci\"]}]}"             http://localhost:8080/api/v1/admin/questions/import >/tmp/qe-import.json
          test "$(python -c 'import json; print(json.load(open("/tmp/qe-import.json"))["imported"])')" = "1"

          curl -fsS -b /tmp/qe-admin.cookies -H 'Content-Type: application/json'             -d '{"assetType":"IMAGE","title":"CI visual asset","altText":"CI visual","url":"https://example.invalid/ci-image","sourceKind":"AUTHOR_CREATED","status":"REVIEW"}'             http://localhost:8080/api/v1/admin/assets >/tmp/qe-asset.json
          ASSET_ID="$(python -c 'import json; print(json.load(open("/tmp/qe-asset.json"))["id"])')"
          curl --request=PUT -sS -b /tmp/qe-admin.cookies -H 'Content-Type: application/json'             -d "{\"assetId\":${ASSET_ID}}"             http://localhost:8080/api/v1/admin/lessons/${LESSON_ID}/blocks/${BLOCK_ID}/asset >/tmp/qe-attach.json
          test "$(python -c 'import json; print(json.load(open("/tmp/qe-attach.json"))["updated"])')" = "True"

      - name: Browser UI smoke test
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes playwright@latest install --with-deps chromium
          npx --yes @playwright/test@latest test tests/ui-smoke-v2.spec.js --reporter=line

      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Tear down local stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  publish:
    name: Publish GHCR images
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quantaedge-api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/quantaedge-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quantaedge-web:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/quantaedge-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quantaedge-admin:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/quantaedge-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
