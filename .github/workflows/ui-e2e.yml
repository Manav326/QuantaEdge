name: QuantaEdge UI E2E

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tests/ui-e2e/**"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - "apps/web/**"
      - "apps/admin/**"
      - "apps/people/**"
      - "services/api/**"
      - "docs/qa/**"
      - "scripts/inventory_ui_routes.mjs"
      - ".github/workflows/ui-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantaedge-ui-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Real UI + API + PostgreSQL verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_DB: quantaedge_qa
      POSTGRES_USER: quantaedge
      POSTGRES_PASSWORD: qe-e2e-db-only
      APP_QA_FIXTURE_PASSWORD: qe-e2e-fixture-only
      APP_AUTH_ADMIN_MOBILES: "7070107483"
      APP_AUTH_SECURE_COOKIES: "false"
      APP_AUTH_ALLOW_REPEATED_DEMO_OTP: "true"
      APP_DEMO_SEED: "false"
      QE_E2E_ENVIRONMENT: disposable-qa
      QE_E2E_TARGET_DATABASE: quantaedge_qa
      QE_E2E_DATABASE_URL: postgresql://quantaedge:qe-e2e-db-only@127.0.0.1:5432/quantaedge_qa
      QE_E2E_ADMIN_BOOTSTRAP_MOBILE: "7070107483"
      QE_E2E_SECRET_DIR: ${{ runner.temp }}/quantaedge-ui-e2e-secrets
      QE_E2E_ARTIFACTS: ${{ runner.temp }}/quantaedge-ui-e2e-artifacts
      QE_E2E_HTML_REPORT: ${{ runner.temp }}/quantaedge-ui-e2e-report
      QE_E2E_JSON_REPORT: ${{ runner.temp }}/quantaedge-ui-e2e-json/results.json
      QE_E2E_COVERAGE_REPORT: ${{ runner.temp }}/quantaedge-ui-e2e-coverage/coverage.json
      QE_E2E_PRODUCTION_GATE: "true"
      QE_E2E_EXTERNAL_PROVIDER_MODE: "fake"
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright dependencies
        working-directory: tests/ui-e2e
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and OS dependencies
        working-directory: tests/ui-e2e
        run: npx playwright install --with-deps chromium
      - name: Start QuantaEdge on a disposable database
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d postgres redis api web admin people
      - name: Wait for the API and three web apps
        shell: bash
        run: |
          set -euo pipefail
          wait_url() {
            local url="$1"
            local label="$2"
            for attempt in $(seq 1 90); do
              if curl --silent --show-error --fail --max-time 5 "$url" >/dev/null; then
                echo "$label is responding"
                return 0
              fi
              sleep 5
            done
            echo "::error::$label did not become ready."
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=250 api web admin people
            return 1
          }
          wait_url http://127.0.0.1:8080/actuator/health "API health"
          wait_url http://127.0.0.1:3000/login "User web login"
          wait_url http://127.0.0.1:3001/login "Education Admin login"
          wait_url http://127.0.0.1:3002/login "HRMS login"
      - name: Run browser tests with direct PostgreSQL assertions and cleanup
        working-directory: tests/ui-e2e
        run: npm run test:production-gate
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-ui-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quantaedge-ui-e2e-artifacts
            ${{ runner.temp }}/quantaedge-ui-e2e-report
            ${{ runner.temp }}/quantaedge-ui-e2e-json
            ${{ runner.temp }}/quantaedge-ui-e2e-coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the disposable stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --remove-orphans
