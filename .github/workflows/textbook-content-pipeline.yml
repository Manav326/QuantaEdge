  extract_textbooks:
    if: ${{ inputs.task == 'extract_and_mirror' }}
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        class_no: ${{ inputs.class_no == 'all' && fromJSON('[6,7,8]') || fromJSON(format('[{0}]', inputs.class_no)) }}
    name: Extract selected Class ${{ matrix.class_no }} in English and Hindi
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout caller branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Test extraction filters and checkpointing
        run: python -m unittest discover -s tests -p 'test_extract_textbook_text.py' -v

      - name: Test safe GHCR page importer
        run: python -m unittest discover -s tests -p 'test_import_ghcr_extracted_pages.py' -v

      - name: Test strict source selection and whole-book integrity
        run: |
          python -m unittest discover -s tests -p 'test_validate_textbook_extraction_artifacts.py' -v
          python -m unittest discover -s tests -p 'test_select_textbook_visual_sources.py' -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull source caches and extract only the selected class's Science and Maths
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          CLASS_NO: ${{ matrix.class_no }}
        run: |
          set -euo pipefail
          [[ "$CLASS_NO" == "6" || "$CLASS_NO" == "7" || "$CLASS_NO" == "8" ]] || { echo "Only Class 6, Class 7 or Class 8 is supported."; exit 2; }
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          mkdir -p pilot-output/reports
          for medium in hindi english; do
            image="ghcr.io/$owner/quantaedge-textbooks-class-$CLASS_NO-$medium:latest"
            registry_dir="pilot-output/cache/class-$CLASS_NO/$medium"
            prepared_dir="pilot-output/prepared/class-$CLASS_NO/$medium"
            extracted_dir="pilot-output/extracted/class-$CLASS_NO/$medium"

            echo "::group::Pull $image"
            python scripts/textbook_registry.py pull --image "$image" --output-dir "$registry_dir"
            echo "::endgroup::"

            echo "::group::Prepare complete-book extraction inputs ($medium)"
            python scripts/textbook_registry.py prepare-library --registry-dir "$registry_dir" --output-dir "$prepared_dir" --extraction-only
            echo "::endgroup::"

            echo "::group::Extract selected Class $CLASS_NO $medium Maths Parts 1/2 and Science"
            python scripts/extract_textbook_text.py \
              --bundle-dir "$prepared_dir/bundles" \
              --pdf-dir "$prepared_dir/pdfs" \
              --output-dir "$extracted_dir" \
              --class-no "$CLASS_NO" \
              --language "$medium" \
              --subject Mathematics \
              --subject Maths \
              --subject Science \
              --scope SUBJECT_BOOK
            echo "::endgroup::"

            echo "::group::Validate exact required source set, page continuity, hashes and metadata"
            python scripts/validate_textbook_extraction_artifacts.py \
              --registry-index "$registry_dir/index.json" \
              --extraction-dir "$extracted_dir" \
              --class-no "$CLASS_NO" \
              --language "$medium"
            echo "::endgroup::"

            cp "$prepared_dir/prepare-report.json" "pilot-output/reports/class-$CLASS_NO-$medium-prepare-report.json"
            cp "$extracted_dir/extraction-report.json" "pilot-output/reports/class-$CLASS_NO-$medium-extraction-report.json"
          done

      # Artifact names include the class number and source run ID; the mirror workflow
      # The central content dispatcher mirrors verified artifacts only after this reusable worker succeeds.
      - name: Publish extracted page data and reports (not source PDFs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-textbook-extraction-pilot-class-${{ matrix.class_no }}-${{ github.run_id }}
          path: |
            pilot-output/extracted/
            pilot-output/reports/
            pilot-output/cache/class-*/hindi/index.json
            pilot-output/cache/class-*/english/index.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  mirror_extraction:
    if: ${{ inputs.task == 'extract_and_mirror' }}
    needs: [validate, extract_textbooks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Confirm source run and locate exact class artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          CLASS_NO_INPUT: ${{ inputs.class_no }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Source run ID must be numeric."; exit 2; }
          case "$CLASS_NO_INPUT" in
            all) requested_classes=(6 7 8) ;;
            6|7|8) requested_classes=("$CLASS_NO_INPUT") ;;
            *) echo "::error::Invalid class scope."; exit 2 ;;
          esac
          metadata="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,status,conclusion,headBranch,url)"
          if ! jq -e '.workflowName == "QuantaEdge Textbook Content Pipeline" and (.status == "in_progress" or (.status == "completed" and .conclusion == "success"))' >/dev/null <<< "$metadata"; then
            echo "::error::The artifact source is not this task's explicit central dispatch."
            jq '{workflowName,status,conclusion,headBranch,url}' <<< "$metadata"
            exit 1
          fi
          available="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')"
          for grade in "${requested_classes[@]}"; do
            expected="quantaedge-textbook-extraction-pilot-class-$grade-$SOURCE_RUN_ID"
            grep -Fxq "$expected" <<< "$available" || { echo "::error::Missing unexpired artifact $expected"; printf '%s\n' "$available"; exit 1; }
            destination="$RUNNER_TEMP/quantaedge-textbook-artifact/class-$grade"
            mkdir -p "$destination"
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$expected" --dir "$destination"
          done
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "MIRROR_CLASSES=$CLASS_NO_INPUT" >> "$GITHUB_ENV"
      - name: Validate whole-book manifests and both language editions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MIRROR_CLASSES" == "all" ]]; then classes=(6 7 8); else classes=("$MIRROR_CLASSES"); fi
          for grade in "${classes[@]}"; do
            artifact_root="$RUNNER_TEMP/quantaedge-textbook-artifact/class-$grade"
            source_root="$artifact_root/extracted/class-$grade"
            for medium in english hindi; do
              test -d "$source_root/$medium/pages" || { echo "::error::Class $grade $medium pages missing."; exit 1; }
              test -s "$artifact_root/cache/class-$grade/$medium/index.json" || { echo "::error::Class $grade $medium source registry missing."; exit 1; }
              python scripts/validate_textbook_extraction_artifacts.py \
                --registry-index "$artifact_root/cache/class-$grade/$medium/index.json" \
                --extraction-dir "$source_root/$medium" --class-no "$grade" --language "$medium"
            done
            rm -rf "data/textbook-extractions/class-$grade"
            mkdir -p data/textbook-extractions
            cp -R "$source_root" "data/textbook-extractions/class-$grade"
            mkdir -p data/textbook-extractions/reports
            if compgen -G "$artifact_root/reports/*.json" > /dev/null; then cp "$artifact_root/reports/"*.json data/textbook-extractions/reports/; fi
            printf 'Verified from central dispatch run %s\n' "$SOURCE_RUN_ID" > "data/textbook-extractions/class-$grade/MIRROR-SOURCE.txt"
          done
          cat > data/textbook-extractions/README.md <<'EOF'
          # Textbook extraction artifacts
          Source-hash-bound whole-book text and manifests are draft extraction inputs only. Original PDFs remain in GHCR. These files are not approved lessons or published content; human review remains mandatory.
          EOF
          for grade in "${classes[@]}"; do
            if [[ "$grade" == "6" ]]; then pairs=(class6-science-bilingual class6-maths-bilingual)
            elif [[ "$grade" == "7" ]]; then pairs=(class7-science-bilingual class7-maths-part1-bilingual class7-maths-part2-bilingual)
            else pairs=(class8-science-bilingual class8-maths-part1-bilingual class8-maths-part2-bilingual); fi
            for pair_id in "${pairs[@]}"; do
              python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$grade" --book-pair-id "$pair_id" --stage 0 --status COMPLETE --reason-code EXTRACTION_MANIFEST_VALIDATED --message "Both language manifests, whole-book hashes and page sequencing were verified."
            done
          done
      - name: Commit verified extraction and stage-zero handoffs to task branch
        shell: bash
        run: |
          set -euo pipefail
          git add data/textbook-extractions data/textbook-content-pipeline/handoffs
          if git diff --cached --quiet; then echo "Verified extraction output already matches this task branch."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content(extraction): mirror verified whole-book page artifacts"
          git push origin "HEAD:$GITHUB_REF_NAME"

  prepare_plan:
    if: ${{ (inputs.task == 'prepare_layers_1_5' || inputs.task == 'repair_layers_4_5') }}
    needs: validate
    name: Plan source-bound Layer 1–5 bilingual pair workers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan_matrix.outputs.matrix }}
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan one runner per whole book on resume
        id: plan_matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
          INPUT_CLASS_NO: ${{ inputs.class_no || '' }}
          INPUT_ANALYSIS_MODE: ${{ (inputs.task == 'repair_layers_4_5' && 'resume_layers_4_5' || inputs.analysis_mode) }}
          INPUT_BOOK_PAIR_ID: ${{ inputs.book_pair_id || '' }}
        run: python scripts/plan_textbook_layer45_matrix.py --github-output "$GITHUB_OUTPUT"

  prepare_validate:
    if: ${{ (inputs.task == 'prepare_layers_1_5' || inputs.task == 'repair_layers_4_5') }}
    needs: validate
    name: Validate additive v3 preparation scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
      - name: Compile preparation and validation scripts
        run: python -m py_compile scripts/extract_visual_asset_inventory.py scripts/prepare_visual_candidates_v3.py scripts/prepare_visual_candidate_batch.py scripts/select_textbook_visual_sources.py scripts/validate_textbook_extraction_artifacts.py scripts/build_visual_lesson_attachment_manifest.py scripts/update_visual_catalog_index.py scripts/plan_textbook_layer45_matrix.py scripts/select_textbook_source_pair.py scripts/textbook_pipeline_handoff.py
      - name: Test source selection, extraction integrity and candidate preparation
        run: |
          python -m unittest discover -s tests -p "test_plan_textbook_layer45_matrix.py" -v
          python -m unittest discover -s tests -p "test_select_textbook_source_pair.py" -v
          python -m unittest discover -s tests -p "test_select_textbook_visual_sources.py" -v
          python -m unittest discover -s tests -p "test_textbook_pipeline_handoff.py" -v
          python -m unittest discover -s tests -p "test_validate_textbook_extraction_artifacts.py" -v
          python -m unittest discover -s tests -p "test_extract_visual_asset_inventory.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidates_v3.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidate_batch.py" -v
          python -m unittest discover -s tests -p "test_build_visual_lesson_attachment_manifest.py" -v
          python -m unittest discover -s tests -p "test_textbook_visual_end_to_end_contract.py" -v
          python -m unittest discover -s tests -p "test_update_visual_catalog_index.py" -v
          python -m unittest discover -s tests -p "test_analyze_visual_inventory_with_ollama.py" -v
          python -m unittest discover -s tests -p "test_quantaedge_textbook_pipeline.py" -v
          python -m unittest discover -s tests -p "test_workflow_resume_entrypoints.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidate_batch.py" -v

  prepare_books:
    if: ${{ needs.validate.result == 'success' && needs.prepare_plan.result == 'success' && needs.prepare_validate.result == 'success' && needs.prepare_plan.outputs.matrix != '{"include":[]}' }}
    needs: [validate, prepare_plan, prepare_validate]
    name: Prepare full bilingual Class ${{ matrix.class_no }} candidate set - ${{ matrix.book_slug }}
    outputs:
      yielded: ${{ steps.layer45_run.outputs.yielded || 'false' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare_plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLASS_NO: ${{ matrix.class_no || inputs.class_no }}
      BOOK_IDS_CSV: ${{ matrix.book_ids_csv || '' }}
      SOURCE_SLUGS_CSV: ${{ matrix.source_slugs_csv || '' }}
      BOOK_PAIR_ID: ${{ matrix.book_pair_id || '' }}
      BOOK_LABEL: ${{ matrix.book_ids_csv && matrix.book_label || '' }}
      ANALYSIS_MODE: ${{ (inputs.task == 'repair_layers_4_5' && 'resume_layers_4_5' || inputs.analysis_mode) }}
      VISION_MODEL: ${{ inputs.vision_model || 'qwen2.5vl:3b' }}
      CHECKPOINT_BATCH_SIZE: ${{ inputs.checkpoint_batch_size || '10' }}
      MAX_BATCHES_PER_RUN: 12
    steps:
      - name: Checkout task branch with write permission for review metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASS_NO" == "6" || "$CLASS_NO" == "7" || "$CLASS_NO" == "8" ]] || { echo "Only Class 6, Class 7 or Class 8 is supported."; exit 2; }
          [[ "$ANALYSIS_MODE" == "prepare_only" || "$ANALYSIS_MODE" == "analyze_all" || "$ANALYSIS_MODE" == "resume_preparation" || "$ANALYSIS_MODE" == "resume_layers_4_5" ]] || { echo "Invalid analysis_mode"; exit 2; }
          [[ -n "$VISION_MODEL" ]] || { echo "vision_model must be non-empty"; exit 2; }
          [[ "$CHECKPOINT_BATCH_SIZE" == "5" || "$CHECKPOINT_BATCH_SIZE" == "10" ]] || { echo "Invalid checkpoint_batch_size"; exit 2; }
          python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
          python -m py_compile scripts/extract_visual_asset_inventory.py scripts/prepare_visual_candidates_v3.py scripts/prepare_visual_candidate_batch.py scripts/select_textbook_visual_sources.py scripts/validate_textbook_extraction_artifacts.py scripts/build_visual_lesson_attachment_manifest.py scripts/update_visual_catalog_index.py scripts/analyze_visual_inventory_with_ollama.py scripts/quantaedge_textbook_pipeline.py scripts/select_textbook_source_pair.py
          python -m unittest discover -s tests -p "test_select_textbook_visual_sources.py" -v
          python -m unittest discover -s tests -p "test_validate_textbook_extraction_artifacts.py" -v
          python -m unittest discover -s tests -p "test_extract_visual_asset_inventory.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidates_v3.py" -v
          python -m unittest discover -s tests -p "test_build_visual_lesson_attachment_manifest.py" -v
          python -m unittest discover -s tests -p "test_textbook_visual_end_to_end_contract.py" -v
          python -m unittest discover -s tests -p "test_update_visual_catalog_index.py" -v
          python -m unittest discover -s tests -p "test_quantaedge_textbook_pipeline.py" -v
          python -m unittest discover -s tests -p "test_workflow_resume_entrypoints.py" -v

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Resolve exact sources and verify mirrored extraction manifests
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          BOOK_IDS_CSV: ${{ matrix.book_ids_csv || '' }}
          SOURCE_SLUGS_CSV: ${{ matrix.source_slugs_csv || '' }}
          BOOK_PAIR_ID: ${{ matrix.book_pair_id || '' }}
          BOOK_LABEL: ${{ matrix.book_ids_csv && matrix.book_label || '' }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          source_root="$RUNNER_TEMP/quantaedge-visual-source"
          mkdir -p "$source_root"
          for medium in english hindi; do
            image="ghcr.io/$owner/quantaedge-textbooks-class-$CLASS_NO-$medium:latest"
            echo "::group::Pull $image"
            docker pull "$image"
            container_id="$(docker create "$image" /__quantaedge_source_index_only)"
            docker cp "$container_id:/index.json" "$source_root/index-$medium.json"
            python scripts/select_textbook_visual_sources.py \
              --index "$source_root/index-$medium.json" \
              --class-no "$CLASS_NO" \
              --language "$medium" \
              --output "$source_root/selected-$medium.json"
            python scripts/validate_textbook_extraction_artifacts.py \
              --registry-index "$source_root/index-$medium.json" \
              --extraction-dir "$GITHUB_WORKSPACE/data/textbook-extractions/class-$CLASS_NO/$medium" \
              --class-no "$CLASS_NO" \
              --language "$medium"
            python - "$container_id" "$source_root/selected-$medium.json" "$source_root" "$GITHUB_WORKSPACE" "$CLASS_NO" "$medium" <<'PY'
          import hashlib, json, os, shutil, subprocess, sys
          from pathlib import Path
          from scripts.validate_textbook_extraction_artifacts import normalize_language, normalize_subject
          container_id, selection_arg, root_arg, repo_arg, class_no, language = sys.argv[1:]
          selection = json.loads(Path(selection_arg).read_text(encoding="utf-8"))
          root = Path(root_arg)
          repo = Path(repo_arg)
          target_book_ids = [item.strip() for item in os.environ.get("BOOK_IDS_CSV", "").split(",") if item.strip()]
          target_source_slugs = [item.strip() for item in os.environ.get("SOURCE_SLUGS_CSV", "").split(",") if item.strip()]
          if bool(target_book_ids) != bool(target_source_slugs):
              raise SystemExit("Bilingual pair handoff must provide both book IDs and source slugs.")
          if target_book_ids and (len(target_book_ids) != 2 or len(set(target_book_ids)) != 2 or len(target_source_slugs) != 2 or len(set(target_source_slugs)) != 2):
              raise SystemExit("Bilingual pair handoff must provide exactly two distinct book IDs and source slugs.")
          expected_slug_by_id = dict(zip(target_book_ids, target_source_slugs, strict=True))
          manifest_dir = repo / "data" / "textbook-extractions" / f"class-{class_no}" / language / "pages"
          if not manifest_dir.is_dir():
              raise SystemExit(f"Committed extracted pages are missing: {manifest_dir}. Run the extraction pilot and mirror its verified artifact first.")
          for source in selection.get("sources", []):
              book_id = source["book_id"]
              if target_book_ids and book_id not in expected_slug_by_id:
                  continue
              if target_book_ids and source.get("book_slug") != expected_slug_by_id[book_id]:
                  raise SystemExit(f"{book_id}: planner source slug does not match the selected book-pair contract.")
              book_dir = root / source["book_slug"]
              book_dir.mkdir(parents=True, exist_ok=False)
              pdf_path = book_dir / "source.pdf"
              subprocess.run(["docker", "cp", f"{container_id}:/{source['file']}", str(pdf_path)], check=True)
              digest = hashlib.sha256(pdf_path.read_bytes()).hexdigest()
              if digest != source["sha256"]:
                  raise SystemExit(f"{book_id}: source PDF SHA-256 differs from the selected GHCR index.")
              matches = []
              for manifest_path in manifest_dir.glob("*.manifest.json"):
                  try:
                      value = json.loads(manifest_path.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  if value.get("book_id") == book_id:
                      matches.append((manifest_path, value))
              if len(matches) != 1:
                  raise SystemExit(f"{book_id}: expected one committed source manifest matching this selected source, found {len(matches)}.")
              manifest_path, manifest = matches[0]
              manifest_hash = str(manifest.get("original_book_sha256") or manifest.get("asset_pdf_sha256") or "").lower()
              if manifest_hash != digest:
                  raise SystemExit(f"{book_id}: committed extraction manifest hash does not match the selected whole-book PDF.")
              if normalize_language(manifest.get("language")) != language:
                  raise SystemExit(f"{book_id}: manifest language does not match {language}.")
              if normalize_subject(manifest.get("subject")) != source["subject"]:
                  raise SystemExit(f"{book_id}: manifest subject does not match selected subject {source['subject']}.")
              if manifest.get("scope") != "SUBJECT_BOOK" or manifest.get("content_state") != "DRAFT_EXTRACTION_ONLY_REQUIRES_REVIEW":
                  raise SystemExit(f"{book_id}: expected a whole-book draft-only extraction manifest.")
              page_name = manifest.get("text_jsonl")
              if not isinstance(page_name, str) or Path(page_name).name != page_name or not page_name.endswith(".jsonl"):
                  raise SystemExit(f"{book_id}: unsafe/missing text_jsonl filename in manifest.")
              page_path = manifest_path.parent / page_name
              if not page_path.is_file():
                  raise SystemExit(f"{book_id}: sibling page JSONL is missing.")
              shutil.copy2(manifest_path, book_dir / "source.manifest.json")
              shutil.copy2(page_path, book_dir / page_name)
              source["extraction_manifest_repo_path"] = manifest_path.relative_to(repo).as_posix()
              source["text_jsonl_repo_path"] = page_path.relative_to(repo).as_posix()
              source["text_jsonl_filename"] = page_name
              (book_dir / "source-selection.json").write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(json.dumps({"book_id": book_id, "language": language, "subject": source["subject"], "slug": source["book_slug"], "sha256": digest}))
          # Keep original extraction references for correction-only rebuilds.
          Path(selection_arg).write_text(json.dumps(selection, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          subprocess.run(["docker", "rm", "-f", container_id], check=True)
          PY
            echo "::endgroup::"
          done
          python scripts/select_textbook_source_pair.py \
            --english "$source_root/selected-english.json" \
            --hindi "$source_root/selected-hindi.json" \
            --class-no "$CLASS_NO" \
            --book-ids-csv "$BOOK_IDS_CSV" \
            --source-slugs-csv "$SOURCE_SLUGS_CSV" \
            --book-pair-id "$BOOK_PAIR_ID" \
            --book-label "$BOOK_LABEL" \
            --output-dir "$source_root"
          echo "VISUAL_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Install ORAS and authenticate before per-book checkpoint handling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          oras_archive="$RUNNER_TEMP/oras_1.2.0_linux_amd64.tar.gz"
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" \
            -o "$oras_archive"
          tar -xzf "$oras_archive" -C "$RUNNER_TEMP" oras
          sudo install -m 0755 "$RUNNER_TEMP/oras" /usr/local/bin/oras
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Preflight and restore matching Layer 4 checkpoints before loading the vision model
        if: env.ANALYSIS_MODE == 'resume_layers_4_5'
        shell: bash
        env:
          VISION_MODEL: ${{ inputs.vision_model || 'qwen2.5vl:3b' }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          python - "$VISUAL_SOURCE_ROOT/selected-sources.json" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/layer4-resume-checkpoints" "$VISION_MODEL" "ghcr.io/$owner/quantaedge-textbook-visuals" <<'PY'
          import json, re, shutil, subprocess, sys
          from pathlib import Path
          from scripts.prepare_visual_candidate_batch import missing_artifact
          selection_path, repo_arg, temp_arg, model, package = sys.argv[1:]
          repo, temp = Path(repo_arg), Path(temp_arg)
          temp.mkdir(parents=True, exist_ok=True)
          safe_model = re.sub(r"[^A-Za-z0-9._-]", "-", model)
          prompt_version = "visual-analysis-prompt-v2"
          def valid(path, source):
              try:
                  doc = json.loads(path.read_text(encoding="utf-8"))
                  return (doc.get("schema_version") == "quantaedge.visual-analysis.v1"
                      and doc.get("source_book_id") == source["book_id"]
                      and str(doc.get("source_pdf_sha256") or "").lower() == str(source["sha256"]).lower()
                      and doc.get("model") == model
                      and doc.get("prompt_version") == prompt_version
                      and isinstance(doc.get("results"), list))
              except (OSError, json.JSONDecodeError, AttributeError):
                  return False
          selection = json.loads(Path(selection_path).read_text(encoding="utf-8"))
          failures = []
          for source in selection["sources"]:
              slug = source["book_slug"]
              raw = repo / "data" / "textbook-visuals" / slug / f"visual-analysis-{safe_model}.v1.json"
              if raw.is_file() and valid(raw, source):
                  print(json.dumps({"book_id": source["book_id"], "checkpoint": "REUSED_FROM_GIT", "results": len(json.loads(raw.read_text(encoding="utf-8")).get("results", []))}))
                  continue
              raw_was_present = raw.exists()
              index_path = repo / "data" / "textbook-visuals" / slug / "visual-pipeline-index.v1.json"
              prior_index = {}
              if index_path.is_file():
                  try:
                      prior_index = json.loads(index_path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      failures.append({"book_id": source["book_id"], "reason": "committed pipeline index is malformed"})
                      continue
                  if prior_index.get("source_book_id") == source["book_id"] and str(prior_index.get("source_pdf_sha256") or "").lower() != str(source["sha256"]).lower():
                      failures.append({"book_id": source["book_id"], "reason": "source edition differs from prior checkpoint; use analyze_all for a new edition"})
                      continue
              tag = f"layer4-class{selection['class']}-{slug}-{safe_model}-checkpoint"
              pull_dir = temp / slug
              shutil.rmtree(pull_dir, ignore_errors=True)
              pull_dir.mkdir(parents=True, exist_ok=True)
              pull = subprocess.run(["oras", "pull", f"{package}:{tag}", "--output", str(pull_dir)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              candidate = pull_dir / f"visual-analysis-{safe_model}.v1.json"
              if pull.returncode == 0 and candidate.is_file():
                  if not valid(candidate, source):
                      failures.append({"book_id": source["book_id"], "reason": "GHCR checkpoint exists but source/model/prompt fingerprint does not match"})
                      continue
                  raw.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(candidate, raw)
                  print(json.dumps({"book_id": source["book_id"], "checkpoint": "RESTORED_FROM_GHCR", "results": len(json.loads(candidate.read_text(encoding="utf-8")).get("results", []))}))
                  continue
              detail = (pull.stdout or "").strip()[-500:]
              not_found = missing_artifact(detail, f"{package}:{tag}")
              prior_layers = prior_index.get("layers") if isinstance(prior_index.get("layers"), dict) else {}
              prior_analysis_path = prior_index.get("analysis_path")
              expected_raw_path = raw.relative_to(repo).as_posix()
              prior_analysis_started = prior_index.get("source_book_id") == source["book_id"] and (
                  prior_layers.get("4") in {"RUNNING", "CHECKPOINTED", "COMPLETE", "INCOMPLETE"}
                  or prior_analysis_path
              )
              if not raw_was_present and not_found and not prior_analysis_started:
                  print(json.dumps({"book_id": source["book_id"], "checkpoint": "NOT_STARTED", "action": "will analyze this book from the beginning; no prior checkpoint exists"}))
                  continue
              if not raw_was_present and not_found and prior_analysis_started:
                  failures.append({"book_id": source["book_id"], "reason": "prior Layer 4 work is recorded but no checkpoint for the selected model was found", "prior_analysis_path": prior_analysis_path, "requested_analysis_path": expected_raw_path, "action": "resume stopped instead of silently redoing inference; use analyze_all only to deliberately start a new model/edition run"})
                  continue
              failures.append({"book_id": source["book_id"], "reason": "checkpoint exists but is invalid, or GHCR could not be checked safely", "detail": detail})
          if failures:
              print(json.dumps({"resume_preflight": "FAILED", "failures": failures}, indent=2))
              raise SystemExit("Resume stopped before model download: an existing checkpoint is invalid or could not be checked safely. No vision model was downloaded; inspect the source/model/prompt fingerprints or GHCR access.")
          print(json.dumps({"resume_preflight": "PASSED", "book_count": len(selection["sources"]), "model": model, "prompt_version": prompt_version}))
          PY

      - name: Restore each matching Layer 1 inventory bundle or build only missing inventories
        if: env.ANALYSIS_MODE == 'resume_layers_4_5'
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          python - "$VISUAL_SOURCE_ROOT/selected-sources.json" "$VISUAL_SOURCE_ROOT" "$GITHUB_WORKSPACE" "ghcr.io/$owner/quantaedge-textbook-visuals" <<'PY'
          import hashlib, json, shutil, subprocess, sys, tarfile
          from pathlib import Path, PurePosixPath
          from scripts.prepare_visual_candidate_batch import extract_archive, missing_artifact, validate_layer1_bundle
          selection_path, source_root_arg, repo_arg, expected_package = sys.argv[1:]
          selection = json.loads(Path(selection_path).read_text(encoding="utf-8"))
          source_root, repo = Path(source_root_arg), Path(repo_arg)
          def sha(path):
              h=hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024*1024), b""): h.update(chunk)
              return h.hexdigest()
          def validate_inventory(work, source):
              invdir=work/"inventory"
              invpath=invdir/"visual-inventory.v1.json"
              inv=json.loads(invpath.read_text(encoding="utf-8"))
              source_meta=inv.get("source") or {}
              if inv.get("schema_version")!="quantaedge.visual-inventory.v1" or source_meta.get("book_id")!=source["book_id"] or str(source_meta.get("pdf_sha256") or "").lower()!=str(source["sha256"]).lower():
                  raise SystemExit(f"{source['book_slug']}: restored inventory identity/schema mismatch.")
              text_path=work/source["text_jsonl_filename"]
              if not text_path.is_file():
                  raise SystemExit(f"{source['book_slug']}: current source page JSONL is missing; cannot verify saved inventory context.")
              page_text_hashes={}
              with text_path.open(encoding="utf-8") as stream:
                  for line_no,line in enumerate(stream,1):
                      if not line.strip(): continue
                      try: row=json.loads(line)
                      except json.JSONDecodeError as exc: raise SystemExit(f"{source['book_slug']}: malformed page JSONL line {line_no}.") from exc
                      number=row.get("source_book_page_number",row.get("source_pdf_page_number"))
                      text=row.get("text")
                      if not isinstance(number,int) or isinstance(number,bool) or number<1 or not isinstance(text,str) or number in page_text_hashes:
                          raise SystemExit(f"{source['book_slug']}: page JSONL has an invalid/duplicate page identity at line {line_no}.")
                      page_text_hashes[number]=hashlib.sha256(text.encode("utf-8")).hexdigest()
              assets=inv.get("assets")
              if not isinstance(assets,list): raise SystemExit(f"{source['book_slug']}: inventory assets are malformed.")
              seen=set()
              for asset in assets:
                  if not isinstance(asset,dict): raise SystemExit(f"{source['book_slug']}: invalid inventory asset row.")
                  aid=asset.get("asset_id")
                  if not isinstance(aid,str) or not aid or aid in seen: raise SystemExit(f"{source['book_slug']}: missing/duplicate inventory asset ID.")
                  seen.add(aid)
                  if asset.get("kind") not in {"embedded_image","page_preview"}: continue
                  page_number=asset.get("source_pdf_page_number")
                  if page_number not in page_text_hashes or asset.get("page_text_sha256")!=page_text_hashes[page_number]:
                      raise SystemExit(f"{source['book_slug']}: extracted text changed or is unverifiable for visual {aid}; saved Layer 4 context cannot be resumed safely. Use analyze_all to rebuild the affected inventory/analysis.")
                  rel=asset.get("asset_path")
                  if not isinstance(rel,str) or not rel: raise SystemExit(f"{source['book_slug']}: eligible asset path missing.")
                  target=(invdir/rel).resolve()
                  if invdir.resolve() not in target.parents or not target.is_file(): raise SystemExit(f"{source['book_slug']}: unsafe/missing restored asset {rel!r}.")
                  if sha(target)!=asset.get("asset_sha256"): raise SystemExit(f"{source['book_slug']}: restored asset SHA-256 mismatch for {aid}.")
              return inv
          for source in selection["sources"]:
              slug=source["book_slug"]; work=source_root/slug
              invdir=work/"inventory"
              repo_index=repo/"data"/"textbook-visuals"/slug/"visual-pipeline-index.v1.json"
              prior=None
              if repo_index.is_file():
                  try: prior=json.loads(repo_index.read_text(encoding="utf-8"))
                  except json.JSONDecodeError: raise SystemExit(f"{slug}: committed pipeline index is corrupted; refusing unsafe resume.")
              matching=bool(prior and prior.get("source_book_id")==source["book_id"] and str(prior.get("source_pdf_sha256") or "").lower()==str(source["sha256"]).lower())
              if prior and prior.get("source_book_id")==source["book_id"] and not matching:
                  raise SystemExit(f"{slug}: source PDF edition differs from prior pipeline checkpoint. Use analyze_all to start a clean edition-bound run.")
              bundle=prior.get("inventory_bundle") if matching else None
              restored=False
              if isinstance(bundle,dict):
                  if bundle.get("package")!=expected_package or not isinstance(bundle.get("tag"),str) or not isinstance(bundle.get("tar_sha256"),str):
                      raise SystemExit(f"{slug}: inventory bundle reference is malformed or belongs to another package.")
                  pull_dir=work/".inventory-pull"
                  shutil.rmtree(pull_dir,ignore_errors=True);pull_dir.mkdir(parents=True,exist_ok=True)
                  pull=subprocess.run(["oras","pull",f"{expected_package}:{bundle['tag']}","--output",str(pull_dir)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
                  archives=list(pull_dir.glob("*.tar.gz"))
                  detail=(pull.stdout or "").strip()[-700:]
                  if pull.returncode==0 and len(archives)==1:
                      archive=archives[0]
                      if sha(archive)!=bundle["tar_sha256"]:
                          raise SystemExit(f"{slug}: inventory bundle tar SHA-256 mismatch; refusing to regenerate over a corrupt checkpoint.")
                      with tarfile.open(archive,"r:gz") as tar:
                          members=tar.getmembers()
                          if not members:
                              raise SystemExit(f"{slug}: inventory bundle archive is empty.")
                          # Current Layer 1 preparation bundles use a slug-layer1/ wrapper and
                          # include a per-file manifest. Older pipeline checkpoints use inventory/
                          # at archive root. Accept both layouts without weakening path validation.
                          wrapper=f"{slug}-layer1"
                          wrapped=[PurePosixPath(m.name).parts[0]==wrapper for m in members if PurePosixPath(m.name).parts]
                          if any(wrapped):
                              if not all(wrapped):
                                  raise SystemExit(f"{slug}: inventory bundle mixes wrapped and root-level paths.")
                              layer1_root=extract_archive(archive,pull_dir,wrapper)
                              manifest_path=layer1_root/"layer1-bundle-manifest.v1.json"
                              if not manifest_path.is_file():
                                  raise SystemExit(f"{slug}: wrapped Layer 1 inventory bundle manifest is missing.")
                              layer1_manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
                              fingerprint=layer1_manifest.get("preparation_fingerprint")
                              tag_prefix=f"visual-inventory-v1-class{selection['class']}-{slug}-prep-"
                              tag=bundle["tag"]
                              tag_fingerprint=tag[len(tag_prefix):] if tag.startswith(tag_prefix) else ""
                              if (len(tag_fingerprint)!=24
                                  or any(ch not in "0123456789abcdef" for ch in tag_fingerprint)
                                  or not isinstance(fingerprint,str)
                                  or not fingerprint.startswith(tag_fingerprint)):
                                  raise SystemExit(f"{slug}: Layer 1 bundle tag/fingerprint mismatch.")
                              validate_layer1_bundle(layer1_root,source,work,fingerprint)
                              shutil.rmtree(invdir,ignore_errors=True)
                              shutil.copytree(layer1_root/"inventory",invdir)
                          else:
                              for member in members:
                                  name=PurePosixPath(member.name)
                                  if name.is_absolute() or ".." in name.parts or not name.parts or name.parts[0] not in {"inventory","source.manifest.json",source["text_jsonl_filename"]}:
                                      raise SystemExit(f"{slug}: unsafe inventory bundle member {member.name!r}.")
                                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                                      raise SystemExit(f"{slug}: links/devices are forbidden in inventory bundle.")
                              inventory_members=[m for m in members if PurePosixPath(m.name).parts[0]=="inventory"]
                              if not inventory_members: raise SystemExit(f"{slug}: bundle has no inventory directory.")
                              tar.extractall(path=work,members=inventory_members,filter="data")
                      inv=validate_inventory(work,source)
                      if not (work/".inventory-restored-from-ghcr.json").is_file():
                          (work/".inventory-restored-from-ghcr.json").write_text(json.dumps({"source_pdf_sha256":source["sha256"],"tag":bundle["tag"],"tar_sha256":bundle["tar_sha256"]},indent=2)+"\n",encoding="utf-8")
                      print(json.dumps({"book_id":source["book_id"],"inventory":"RESTORED_FROM_VERIFIED_GHCR_BUNDLE","asset_count":len(inv["assets"]),"candidate_pack_rebuild":False}))
                      restored=True
                  elif pull.returncode!=0 and missing_artifact(detail, f"{expected_package}:{bundle['tag']}"):
                      print(json.dumps({"book_id":source["book_id"],"inventory":"PRIOR_BUNDLE_NOT_FOUND","fallback":"build Layer 1 only; preserve source-bound Layer 4 checkpoint","detail":detail}))
                  else:
                      raise SystemExit(f"{slug}: cannot safely recover prior inventory bundle; resume stopped. {detail}")
                  shutil.rmtree(pull_dir,ignore_errors=True)
              if not restored:
                  invdir.mkdir(parents=True,exist_ok=True)
                  subprocess.run([sys.executable,"scripts/extract_visual_asset_inventory.py","--pdf",str(work/"source.pdf"),"--manifest",str(work/"source.manifest.json"),"--output-dir",str(invdir),"--preview-width","1200"],cwd=repo,check=True)
                  inv=validate_inventory(work,source)
                  if matching:
                      prior_inventory_path=repo/"data"/"textbook-visuals"/slug/"visual-inventory.v1.json"
                      if not prior_inventory_path.is_file():
                          raise SystemExit(f"{slug}: prior Layer 4 work exists but neither its ORAS inventory nor committed inventory is available; refusing unverified resume.")
                      if sha(prior_inventory_path)!=sha(invdir/"visual-inventory.v1.json"):
                          raise SystemExit(f"{slug}: rebuilt Layer 1 inventory differs from the inventory bound to the saved checkpoint. Use analyze_all to deliberately rebuild and reanalyze.")
                  print(json.dumps({"book_id":source["book_id"],"inventory":"BUILT_BECAUSE_NO_VERIFIED_BUNDLE","asset_count":len(inv["assets"]),"prior_inventory_byte_match":bool(matching),"candidate_pack_rebuild":False}))
              candidate_path=repo/"data"/"textbook-visual-candidates-v3"/slug/"candidates.v3.json"
              if candidate_path.is_file():
                  pack=json.loads(candidate_path.read_text(encoding="utf-8"))
                  if pack.get("schema_version")!="quantaedge.visual-candidate-pack.v3" or (pack.get("source") or {}).get("pdf_sha256")!=source["sha256"]:
                      raise SystemExit(f"{slug}: existing candidate pack is stale/mismatched; use analyze_all to rebuild it.")
              else:
                  raise SystemExit(f"{slug}: no committed v3 candidate pack exists; resume mode will not rebuild candidate packs.")
          PY

