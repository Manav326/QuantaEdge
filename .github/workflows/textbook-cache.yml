name: QuantaEdge Textbook Cache

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/textbook_registry.py"
      - ".github/workflows/textbook-cache.yml"
      - "tests/test_textbook_registry.py"
  workflow_dispatch:
    inputs:
      language:
        description: "Which image to extend"
        type: choice
        options: [both, hindi, english]
        default: both
        required: true
      book_code:
        description: "Optional one-book-only NCERT code or registry ID"
        type: string
        required: false
      max_books:
        description: "Maximum new books per language (0 means all pending)"
        type: number
        default: 0
        required: true
      refresh:
        description: "Re-download cached books to verify content"
        type: boolean
        default: false
        required: true
      download_workers:
        description: "Number of parallel whole-book downloads"
        type: number
        default: 8
        required: true
      push_batch_size:
        description: "Number of completed books per Docker build/push batch"
        type: number
        default: 8
        required: true
      retry_rounds:
        description: "Maximum attempts for unresolved books (1–5)"
        type: number
        default: 5
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: quantaedge-textbook-cache-final
  cancel-in-progress: true

jobs:
  cache-textbooks:
    name: Parallel whole-book downloads and persistent batch pushes
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF merge dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize run summary
        shell: bash
        run: |
          {
            echo "# QuantaEdge textbook cache"
            echo
            echo "Whole books download in parallel batches. Complete batches update the existing GHCR :latest image before the next batch." 
            echo "Unresolved books are retried for up to five rounds. Binary size is not capped, and NCERT partial chapter fallback is disabled." 
            echo "GHCR is the persistent cache; the downloadable Actions artifact is retained for 90 days only as a convenience."
            echo
            echo "- Repository: ${{ github.repository }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "| Medium | Class | Publisher | Book | Registry ID | SHA-256 |"
            echo "|---|---:|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish textbooks incrementally to language-specific images
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_BOOK_CODE: ${{ inputs.book_code }}
          INPUT_MAX_BOOKS: ${{ inputs.max_books }}
          INPUT_REFRESH: ${{ inputs.refresh }}
          INPUT_DOWNLOAD_WORKERS: ${{ inputs.download_workers }}
          INPUT_PUSH_BATCH_SIZE: ${{ inputs.push_batch_size }}
          INPUT_RETRY_ROUNDS: ${{ inputs.retry_rounds }}
        run: |
          set -euo pipefail
          language="$INPUT_LANGUAGE"
          if [ -z "$language" ]; then language="both"; fi
          workers="${INPUT_DOWNLOAD_WORKERS:-8}"
          batch_size="${INPUT_PUSH_BATCH_SIZE:-8}"
          retry_rounds="${INPUT_RETRY_ROUNDS:-5}"
          args=(python scripts/textbook_registry.py publish --language "$language" --download-workers "$workers" --push-batch-size "$batch_size" --retry-rounds "$retry_rounds" --image-prefix "ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/quantaedge-textbooks")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_BOOK_CODE}" ]; then args+=(--book-code "$INPUT_BOOK_CODE"); fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_MAX_BOOKS" ] && [ "$INPUT_MAX_BOOKS" != "0" ]; then args+=(--max-books "$INPUT_MAX_BOOKS"); fi
          if [ "$INPUT_REFRESH" = "true" ]; then args+=(--refresh); fi
          "${args[@]}"

      - name: Pull caches and assemble browser-download archives by class and medium
        if: always()
        shell: bash
        run: |
          set +e
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          mkdir -p "$RUNNER_TEMP/textbook-inventory"
          python scripts/textbook_registry.py pull \
            --image "ghcr.io/$owner/quantaedge-textbooks-hindi:latest" \
            --output-dir "$RUNNER_TEMP/textbook-inventory/hindi"
          hindi_status=$?
          python scripts/textbook_registry.py pull \
            --image "ghcr.io/$owner/quantaedge-textbooks-english:latest" \
            --output-dir "$RUNNER_TEMP/textbook-inventory/english"
          english_status=$?
          python - "$RUNNER_TEMP/textbook-inventory" "$RUNNER_TEMP/textbook-downloads" <<'PY'
          import json, sys, zipfile
          from pathlib import Path

          source_root = Path(sys.argv[1])
          out_root = Path(sys.argv[2])
          out_root.mkdir(parents=True, exist_ok=True)
          for medium in ("hindi", "english"):
              folder = source_root / medium
              index_path = folder / "index.json"
              if not index_path.is_file():
                  print(f"{medium}: no registry image/index available in this run")
                  continue
              index = json.loads(index_path.read_text(encoding="utf-8"))
              full_inventory = out_root / f"inventory-{medium}.json"
              full_inventory.write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              entries = index.get("books", [])
              for class_no in range(6, 13):
                  items = []
                  for item in entries:
                      classes = item.get("classes") or [item.get("class")]
                      if class_no in [int(value) for value in classes if value is not None]:
                          items.append(item)
                  if not items:
                      continue
                  archive_path = out_root / f"quantaedge-textbooks-{medium}-class-{class_no}.zip"
                  class_index = dict(index)
                  class_index["books"] = items
                  class_index["book_count"] = len(items)
                  class_index["download_bundle"] = f"{medium} medium, Class {class_no}"
                  with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
                      archive.writestr("index.json", json.dumps(class_index, ensure_ascii=False, indent=2) + "\n")
                      for item in items:
                          relative = Path(item["file"])
                          pdf = folder / relative
                          if not pdf.is_file():
                              raise FileNotFoundError(f"{medium}/{item['book_id']}: cached PDF missing at {pdf}")
                          archive.write(pdf, relative.as_posix())
                  print(f"DOWNLOAD_BUNDLE {archive_path.name} books={len(items)} bytes={archive_path.stat().st_size}")
              print(f"INVENTORY {medium} books={len(entries)}")
          PY
          mkdir -p "$RUNNER_TEMP/textbook-downloads"
          if [ "$hindi_status" -ne 0 ]; then echo "Hindi image could not be pulled for the direct-download artifact." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$english_status" -ne 0 ]; then echo "English image could not be pulled for the direct-download artifact." >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

      - name: Upload direct book downloads and inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-textbooks-downloads-${{ github.run_number }}
          path: ${{ runner.temp }}/textbook-downloads/*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
