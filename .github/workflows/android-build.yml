name: Android app build

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-build.yml"
      - "apps/web/public/branding/quantaedge-wordmark.png"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-build-main
  cancel-in-progress: true

jobs:
  android:
    name: Compile, unit-test, package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble debug APK
        run: gradle -p apps/android assembleDebug
      - name: Run unit tests
        run: gradle -p apps/android testDebugUnitTest
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-android-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
