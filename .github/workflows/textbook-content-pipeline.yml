      - name: Verify per-book immutable candidate checkpoints before committing the catalog
        if: env.ANALYSIS_MODE != 'resume_layers_4_5'
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          python - "$VISUAL_SOURCE_ROOT/selected-sources.json" "$RUNNER_TEMP/visual-candidates-v3" "$GITHUB_WORKSPACE" "ghcr.io/$owner/quantaedge-textbook-visuals" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          selection_path, work_arg, repo_arg, package = sys.argv[1:]
          selection=json.loads(Path(selection_path).read_text(encoding="utf-8"))
          work,repo=Path(work_arg),Path(repo_arg)
          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda:stream.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          for source in selection["sources"]:
              slug=source["book_slug"]
              index_path=repo/"data"/"textbook-visual-candidates-v3"/slug/"bundle-index.v3.json"
              pack_path=repo/"data"/"textbook-visual-candidates-v3"/slug/"candidates.v3.json"
              archive=work/f"{slug}-candidates-v3.tar.gz"
              if not index_path.is_file() or not pack_path.is_file() or not archive.is_file():
                  raise SystemExit(f"{slug}: per-book checkpoint outputs are missing; refusing to commit a partial catalog.")
              index=json.loads(index_path.read_text(encoding="utf-8"))
              pack=json.loads(pack_path.read_text(encoding="utf-8"))
              if index.get("schema_version")!="quantaedge.visual-candidate-bundle-index.v3":
                  raise SystemExit(f"{slug}: checkpoint index schema mismatch.")
              if index.get("source_book_id")!=source["book_id"] or str(index.get("source_pdf_sha256") or "").lower()!=str(source["sha256"]).lower():
                  raise SystemExit(f"{slug}: checkpoint source identity mismatch.")
              if index.get("ghcr_package")!=package or not isinstance(index.get("version_tag"),str):
                  raise SystemExit(f"{slug}: checkpoint registry package/tag missing.")
              if digest(archive)!=index.get("bundle_tar_sha256"):
                  raise SystemExit(f"{slug}: local per-book archive SHA-256 differs from its committed checkpoint index.")
              if pack.get("schema_version")!="quantaedge.visual-candidate-pack.v3" or str((pack.get("source") or {}).get("pdf_sha256") or "").lower()!=str(source["sha256"]).lower():
                  raise SystemExit(f"{slug}: candidate pack source/schema mismatch.")
              if pack.get("summary",{}).get("publication_allowed") is not False or pack.get("summary",{}).get("selected_candidate_count")!=index.get("candidate_count"):
                  raise SystemExit(f"{slug}: checkpoint candidate count or publication guard mismatch.")
              if index.get("candidate_pack_sha256") and index["candidate_pack_sha256"]!=digest(pack_path):
                  raise SystemExit(f"{slug}: candidate pack SHA-256 differs from checkpoint index.")
              print(json.dumps({"slug":slug,"checkpoint":"VERIFIED","tag":index["version_tag"],"candidate_count":index["candidate_count"],"archive_sha256":index["bundle_tar_sha256"],"publication_allowed":False}))
          PY

      - name: Rebuild the catalog, test candidate-to-content contracts, and commit the full batch
        if: env.ANALYSIS_MODE != 'resume_layers_4_5'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_visual_catalog_index.py --catalog-dir data/textbook-visual-candidates-v3/catalogs --output data/textbook-visual-candidates-v3/index.v1.json
          python -m unittest discover -s tests -p "test_build_visual_lesson_attachment_manifest.py" -v
          python -m unittest discover -s tests -p "test_textbook_visual_end_to_end_contract.py" -v
          python -m unittest discover -s tests -p "test_update_visual_catalog_index.py" -v
          python -m unittest discover -s tests -p "test_pipeline_data_locations.py" -v
          python scripts/validate_pipeline_data_locations.py --repo-root "$GITHUB_WORKSPACE"
          python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$BOOK_PAIR_ID" --stage 1 --status COMPLETE --reason-code LAYER1_VALIDATED --model "$VISION_MODEL" --message "Inventory source identity and schema checks passed."
          python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$BOOK_PAIR_ID" --stage 2 --status COMPLETE --reason-code LAYER2_VALIDATED --model "$VISION_MODEL" --message "Candidate pack and immutable bundle checks passed."
          python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$BOOK_PAIR_ID" --stage 3 --status COMPLETE --reason-code LAYER3_VALIDATED --model "$VISION_MODEL" --message "Candidate catalog and index checks passed."
          git add -A data/textbook-visual-candidates-v3 data/textbook-content-pipeline/handoffs
          python scripts/validate_pipeline_data_locations.py --repo-root "$GITHUB_WORKSPACE"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(ai): prepare Class $CLASS_NO bilingual visual candidate batch"
          else
            echo "The candidate metadata and media manifest already match main; no Git commit required."
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Persisted review-only visual candidates for every required NCERT Maths and Science source book in English and Hindi. All candidate packs remain non-publishable."


      - name: Start per-source-book Layer 4 and Layer 5 clocks
        if: env.ANALYSIS_MODE == 'analyze_all' || env.ANALYSIS_MODE == 'resume_layers_4_5'
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a books <<< "$BOOK_IDS_CSV"
          for book_id in "${books[@]}"; do
            python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$BOOK_PAIR_ID" --source-book-id "$book_id" --stage 4 --status RUNNING --reason-code EXPLICIT_LAYER45_REQUEST --model "$VISION_MODEL" --prompt-version visual-analysis-prompt-v2 --budget 12 --message "Layer 4 started for this source edition, including local model startup."
            python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$BOOK_PAIR_ID" --source-book-id "$book_id" --stage 5 --status RUNNING --reason-code EXPLICIT_LAYER45_REQUEST --model "$VISION_MODEL" --prompt-version visual-analysis-prompt-v2 --budget 12 --message "Layer 5 coverage reconciliation is coupled to this bounded Layer 4 run."
          done


      - name: Start Ollama container and load vision model for Layer 4
        if: env.ANALYSIS_MODE == 'analyze_all' || env.ANALYSIS_MODE == 'resume_layers_4_5'
        shell: bash
        run: |
          set -euo pipefail
          docker pull ollama/ollama:latest
          docker volume create quantaedge-ollama-models >/dev/null
          docker run -d --name quantaedge-ollama -p 11434:11434 -v quantaedge-ollama-models:/root/.ollama ollama/ollama:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || { docker logs quantaedge-ollama; exit 1; }
          docker exec quantaedge-ollama ollama pull "$VISION_MODEL"

      - name: Run exhaustive, resumable Layers 4–5 for the selected class
        id: layer45_run
        if: env.ANALYSIS_MODE == 'analyze_all' || env.ANALYSIS_MODE == 'resume_layers_4_5'
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/quantaedge_textbook_pipeline.py run \
            --selection "$VISUAL_SOURCE_ROOT/selected-sources.json" \
            --source-root "$VISUAL_SOURCE_ROOT" \
            --repo-root "$GITHUB_WORKSPACE" \
            --package "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quantaedge-textbook-visuals" \
            --run-id "$GITHUB_RUN_ID" \
            --model "$VISION_MODEL" \
            --batch-size "$CHECKPOINT_BATCH_SIZE" \
            --max-batches-per-run "$MAX_BATCHES_PER_RUN" \
            --request-timeout 300; then
            echo "yielded=false" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [[ "$result" -eq 10 ]]; then
              echo "yielded=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Layer 4–5 reached its safe batch budget; durable checkpoints are saved. No automatic continuation is scheduled; explicitly dispatch a repair/resume task after reviewing the checkpoint."
            else
              exit "$result"
            fi
          fi

      - name: Record safe Layer 4–5 budget checkpoint without auto-resume
        if: success() && steps.layer45_run.outputs.yielded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a books <<< "$BOOK_IDS_CSV"
          for book_id in "${books[@]}"; do
            python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$BOOK_PAIR_ID" --source-book-id "$book_id" --stage 4 --status CHECKPOINTED --reason-code SAFE_BATCH_BUDGET --model "$VISION_MODEL" --message "Layer 4 durable batch checkpoint saved; resume only after a new explicit dispatcher request."
            python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$BOOK_PAIR_ID" --source-book-id "$book_id" --stage 5 --status CHECKPOINTED --reason-code SAFE_BATCH_BUDGET --model "$VISION_MODEL" --message "Layer 5 paired checkpoint saved; resume only after a new explicit dispatcher request."
          done
          git add data/textbook-content-pipeline/handoffs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "status(content): record per-book Layer 4-5 budget checkpoint"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Record failed per-source-book Layer 4–5 task without auto-retry
        if: failure() && (env.ANALYSIS_MODE == 'analyze_all' || env.ANALYSIS_MODE == 'resume_layers_4_5')
        shell: bash
        run: |
          set +e
          IFS=',' read -r -a books <<< "$BOOK_IDS_CSV"
          for book_id in "${books[@]}"; do
            for stage in 4 5; do
              python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$BOOK_PAIR_ID" --source-book-id "$book_id" --stage "$stage" --status BLOCKED --reason-code LAYER45_WORKER_FAILURE --model "$VISION_MODEL" --message "Worker failed. Inspect this source-book checkpoint and logs before explicitly retrying; no automatic continuation is scheduled." || true
            done
          done
          git add data/textbook-content-pipeline/handoffs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "status(content): record per-book Layer 4-5 failure handoff"
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi


      - name: Stop Ollama container
        if: always() && (env.ANALYSIS_MODE == 'analyze_all' || env.ANALYSIS_MODE == 'resume_layers_4_5')
        run: docker rm -f quantaedge-ollama >/dev/null 2>&1 || true

      - name: Summarize integrated eight-layer pipeline
        if: always() && (env.ANALYSIS_MODE == 'analyze_all' || env.ANALYSIS_MODE == 'resume_layers_4_5')
        shell: bash
        run: |
          {
            echo "## QuantaEdge eight-layer textbook pipeline"
            echo "- Executed here: Layers 1–5. Layers 6–8 are implemented in the separate budgeted per-book workflow; benchmark the model first, then generate review-only drafts."
            echo "- No visual/candidate total cap; checkpoint batch size was $CHECKPOINT_BATCH_SIZE assets. Smaller batches reduce uncheckpointed model work but increase Git/GHCR savepoint traffic."
            echo "- All generated data remains review-only; publication_allowed=false."
          } >> "$GITHUB_STEP_SUMMARY"

  layers68_validate:
    if: ${{ inputs.task == 'layers_6_8' }}
    needs: validate
    name: Validate Layers 6-8 contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile pipeline and content-contract scripts
        run: python -m py_compile scripts/quantaedge_layers_6_8.py scripts/ai_training_dataset.py scripts/validate_structured_lesson_artifacts.py scripts/register_structured_lesson_drafts.py
      - name: Test pipeline contracts, native Ollama, provenance, resume and split safety
        run: |
          python -m unittest discover -s tests -p "test_quantaedge_layers_6_8.py" -v
          python -m unittest discover -s tests -p "test_ai_training_dataset.py" -v
          python -m unittest discover -s tests -p "test_validate_structured_lesson_artifacts.py" -v
          python -m unittest discover -s tests -p "test_register_structured_lesson_drafts.py" -v
          python -m unittest discover -s tests -p "test_workflow_resume_entrypoints.py" -v
      - name: Validate current canonical lesson store and database-facing IDs
        run: python scripts/validate_structured_lesson_artifacts.py --repo-root . --index data/structured-lessons/class-6/science/production-index.v1.json

  layers68_execute:
    if: ${{ inputs.task == 'layers_6_8' && needs.layers68_validate.result == 'success' }}
    needs: [validate, layers68_validate]
    name: Run budgeted local Ollama pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      CHECKPOINT_EVERY: ${{ inputs.checkpoint_every || '2' }}
      MAX_MODEL_CALLS: ${{ inputs.max_model_calls || '6' }}
    steps:
      - name: Checkout main with checkpoint write permission
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repeat checks on the execution checkout
        run: |
          [[ "$CHECKPOINT_EVERY" =~ ^[0-9]+$ ]] && (( CHECKPOINT_EVERY >= 1 && CHECKPOINT_EVERY <= 5 )) || { echo "checkpoint_every must be 1..5"; exit 2; }
          [[ "$MAX_MODEL_CALLS" =~ ^[0-9]+$ ]] && (( MAX_MODEL_CALLS >= 1 && MAX_MODEL_CALLS <= 20 )) || { echo "max_model_calls must be 1..20"; exit 2; }
          python -m py_compile scripts/quantaedge_layers_6_8.py scripts/ai_training_dataset.py scripts/validate_structured_lesson_artifacts.py scripts/register_structured_lesson_drafts.py
          python -m unittest discover -s tests -p "test_quantaedge_layers_6_8.py" -v
          python -m unittest discover -s tests -p "test_ai_training_dataset.py" -v
          python -m unittest discover -s tests -p "test_validate_structured_lesson_artifacts.py" -v
          python -m unittest discover -s tests -p "test_register_structured_lesson_drafts.py" -v
          python scripts/validate_structured_lesson_artifacts.py --repo-root . --index data/structured-lessons/class-6/science/production-index.v1.json
      - name: Guard fixed Class 6 benchmark and refresh modes
        if: inputs.layer68_mode == 'benchmark' || inputs.layer68_mode == 'refresh_benchmark'
        shell: bash
        env:
          CLASS_NO: "${{ inputs.class_no }}"
          SOURCE_BOOK_ID: "${{ inputs.source_book_id }}"
        run: |
          set -euo pipefail
          [[ "$CLASS_NO" == "6" && "$SOURCE_BOOK_ID" == "ncert-c6-english-fecu1" ]] || {
            echo "::error::Benchmark and refresh_benchmark are pinned to Class 6 English NCERT Curiosity (ncert-c6-english-fecu1)." >&2
            exit 2
          }

      - name: Preflight benchmark source and Layer 5 before model download
        if: inputs.layer68_mode == 'benchmark' || inputs.layer68_mode == 'refresh_benchmark'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quantaedge_layers_6_8.py preflight \
            --repo-root "$GITHUB_WORKSPACE" \
            --class-no 6 \
            --source-book-id ncert-c6-english-fecu1

      - name: Preflight generation checkpoint before model download
        if: inputs.layer68_mode == 'run' || inputs.layer68_mode == 'resume'
        id: generation_preflight
        shell: bash
        env:
          MODE: "${{ inputs.layer68_mode }}"
          CLASS_NO: "${{ inputs.class_no }}"
          SOURCE_BOOK_ID: "${{ inputs.source_book_id }}"
          MODEL: "${{ inputs.generation_model }}"
          MAX_MODEL_CALLS: "${{ inputs.max_model_calls }}"
        run: |
          set -euo pipefail
          args=(run --repo-root "$GITHUB_WORKSPACE" --class-no "$CLASS_NO"
            --source-book-id "$SOURCE_BOOK_ID" --endpoint http://127.0.0.1:11434
            --model "$MODEL" --max-model-calls "$MAX_MODEL_CALLS"
            --checkpoint-every "$CHECKPOINT_EVERY" --request-timeout 180
            --benchmark-report data/textbook-content-pipeline/model-benchmarks/class-6-ncert-curiosity.v1.json
            --allow-experimental-model --preflight-only)
          if [[ "$MODE" == "resume" ]]; then
            args+=(--require-existing-checkpoint)
          fi
          python scripts/quantaedge_layers_6_8.py "${args[@]}" > "$RUNNER_TEMP/generation-preflight.json"
          cat "$RUNNER_TEMP/generation-preflight.json"
          python - "$RUNNER_TEMP/generation-preflight.json" "$GITHUB_OUTPUT" "$MODE" <<'PY'
          import json, sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          mode=sys.argv[3]
          state=report.get("preflight")
          allowed={"MATCHED_CHECKPOINT"} if mode=="resume" else {"MATCHED_CHECKPOINT","NOT_STARTED"}
          if state not in allowed:
              raise SystemExit(f"{mode} preflight returned unsafe checkpoint state: {state!r}")
          with open(sys.argv[2],"a",encoding="utf-8") as out:
              out.write(f"preflight_state={state}\n")
              out.write(f"retryable_segments={int(report['retryable_segments'])}\n")
          PY

      - name: Require explicit experimental-draft approval before model startup
        if: (inputs.layer68_mode == 'run' || inputs.layer68_mode == 'resume') && steps.generation_preflight.outputs.retryable_segments != '0'
        shell: bash
        env:
          ALLOW_EXPERIMENTAL_MODEL: "${{ inputs.allow_experimental_model }}"
        run: |
          set -euo pipefail
          [[ "$ALLOW_EXPERIMENTAL_MODEL" == "true" ]] || { echo "Enable allow_experimental_model before starting Ollama; generated content remains review-only." >&2; exit 2; }

      - name: Reconcile saved Layers 6–8 outputs without model inference
        if: (inputs.layer68_mode == 'run' || inputs.layer68_mode == 'resume') && steps.generation_preflight.outputs.preflight_state == 'MATCHED_CHECKPOINT' && steps.generation_preflight.outputs.retryable_segments == '0'
        shell: bash
        env:
          CLASS_NO: "${{ inputs.class_no }}"
          SOURCE_BOOK_ID: "${{ inputs.source_book_id }}"
          MODEL: "${{ inputs.generation_model }}"
          MAX_MODEL_CALLS: "${{ inputs.max_model_calls }}"
        run: |
          set -euo pipefail
          python scripts/quantaedge_layers_6_8.py run \
            --repo-root "$GITHUB_WORKSPACE" --class-no "$CLASS_NO" \
            --source-book-id "$SOURCE_BOOK_ID" --endpoint http://127.0.0.1:11434 \
            --model "$MODEL" --max-model-calls "$MAX_MODEL_CALLS" \
            --checkpoint-every "$CHECKPOINT_EVERY" --request-timeout 180 \
            --benchmark-report data/textbook-content-pipeline/model-benchmarks/class-6-ncert-curiosity.v1.json \
            --allow-experimental-model --rebuild-outputs-only --commit-checkpoints

      - name: Record explicitly requested Layers 6–8 task start
        if: (inputs.layer68_mode == 'run' || inputs.layer68_mode == 'resume') && steps.generation_preflight.outputs.retryable_segments != '0'
        shell: bash
        env:
          CLASS_NO: ${{ inputs.class_no }}
          SOURCE_BOOK_ID: ${{ inputs.source_book_id }}
          MODEL: ${{ inputs.generation_model }}
        run: |
          set -euo pipefail
          pair_id="$(python - "$SOURCE_BOOK_ID" <<'PY'
          import sys
          from scripts.textbook_pipeline_handoff import pair_for_book_id
          print(pair_for_book_id(sys.argv[1])["book_pair_id"])
          PY
          )"
          for stage in 6 7 8; do
            python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$pair_id" --source-book-id "$SOURCE_BOOK_ID" --stage "$stage" --status RUNNING --reason-code EXPLICIT_LAYER6_8_REQUEST --model "$MODEL" --message "Explicitly requested source-bound Layers 6–8 run; the layer artifact records the shared runtime and the three durations must not be summed."
          done

      - name: Start loopback-only Ollama service
        if: inputs.layer68_mode == 'benchmark' || ((inputs.layer68_mode == 'run' || inputs.layer68_mode == 'resume') && steps.generation_preflight.outputs.retryable_segments != '0')
        shell: bash
        run: |
          set -euo pipefail
          docker pull ollama/ollama:latest
          docker volume create quantaedge-layers-6-8-models >/dev/null
          docker run -d --name quantaedge-layers-6-8-ollama \
            -p 127.0.0.1:11434:11434 \
            -v quantaedge-layers-6-8-models:/root/.ollama \
            ollama/ollama:latest
          ready=false
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then ready=true; break; fi
            sleep 2
          done
          [[ "$ready" == true ]] || { docker logs quantaedge-layers-6-8-ollama; exit 1; }
      - name: Pull only candidate models for this invocation
        if: inputs.layer68_mode == 'benchmark' || ((inputs.layer68_mode == 'run' || inputs.layer68_mode == 'resume') && steps.generation_preflight.outputs.retryable_segments != '0')
        shell: bash
        env:
          MODE: "${{ inputs.layer68_mode }}"
          BENCHMARK_MODELS: "${{ inputs.benchmark_models }}"
          GENERATION_MODEL: "${{ inputs.generation_model }}"
        run: |
          set -euo pipefail
          if [[ "$MODE" == "benchmark" ]]; then
            IFS=',' read -r -a candidates <<< "$BENCHMARK_MODELS"
          elif [[ "$MODE" == "run" || "$MODE" == "resume" ]]; then
            candidates=("$GENERATION_MODEL")
          fi
          for model in "${candidates[@]}"; do
            model="$(printf '%s' "$model" | xargs)"
            [[ -n "$model" ]] || { echo "Model list contains an empty item"; exit 2; }
            docker exec quantaedge-layers-6-8-ollama ollama pull "$model"
          done
      - name: Benchmark the same Class 6 NCERT excerpts with every model
        if: inputs.layer68_mode == 'benchmark'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quantaedge_layers_6_8.py benchmark \
            --repo-root "$GITHUB_WORKSPACE" --source-book-id ncert-c6-english-fecu1 \
            --endpoint http://127.0.0.1:11434 --models "${{ inputs.benchmark_models }}" \
            --sample-segments 2 --request-timeout 300 \
            --output data/textbook-content-pipeline/model-benchmarks/class-6-ncert-curiosity.v1.json \
            --commit-checkpoints
      - name: Refresh saved benchmark samples without model inference
        if: inputs.layer68_mode == 'refresh_benchmark'
        shell: bash
        env:
          SOURCE_BOOK_ID: "${{ inputs.source_book_id }}"
        run: |
          set -euo pipefail
          python scripts/quantaedge_layers_6_8.py refresh-benchmark \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-book-id "$SOURCE_BOOK_ID" \
            --output data/textbook-content-pipeline/model-benchmarks/class-6-ncert-curiosity.v1.json \
            --commit-checkpoints

      - name: Run bounded single-book draft generation
        if: (inputs.layer68_mode == 'run' || inputs.layer68_mode == 'resume') && steps.generation_preflight.outputs.retryable_segments != '0'
        shell: bash
        env:
          CLASS_NO: "${{ inputs.class_no }}"
          SOURCE_BOOK_ID: "${{ inputs.source_book_id }}"
          MODEL: "${{ inputs.generation_model }}"
          MAX_MODEL_CALLS: "${{ inputs.max_model_calls }}"
          ALLOW_EXPERIMENTAL_MODEL: "${{ inputs.allow_experimental_model }}"
        run: |
          set -euo pipefail
          [[ "$ALLOW_EXPERIMENTAL_MODEL" == "true" ]] || { echo "Enable allow_experimental_model for review-only drafts."; exit 2; }
          [[ "$MAX_MODEL_CALLS" =~ ^[0-9]+$ ]] && (( MAX_MODEL_CALLS >= 1 && MAX_MODEL_CALLS <= 20 )) || { echo "max_model_calls must be 1..20"; exit 2; }
          python scripts/quantaedge_layers_6_8.py run \
            --repo-root "$GITHUB_WORKSPACE" --class-no "$CLASS_NO" \
            --source-book-id "$SOURCE_BOOK_ID" --endpoint http://127.0.0.1:11434 \
            --model "$MODEL" --max-model-calls "$MAX_MODEL_CALLS" \
            --checkpoint-every "$CHECKPOINT_EVERY" --request-timeout 180 \
            --benchmark-report data/textbook-content-pipeline/model-benchmarks/class-6-ncert-curiosity.v1.json \
            --allow-experimental-model --commit-checkpoints
      - name: Record source-bound Layers 6–8 checkpoint and timings
        if: success() && (inputs.layer68_mode == 'run' || inputs.layer68_mode == 'resume') && steps.generation_preflight.outputs.retryable_segments != '0'
        shell: bash
        env:
          CLASS_NO: ${{ inputs.class_no }}
          SOURCE_BOOK_ID: ${{ inputs.source_book_id }}
          MODEL: ${{ inputs.generation_model }}
        run: |
          set -euo pipefail
          read -r pair_id manifest status6 status7 status8 processed expected unresolved model_runtime <<< "$(python - "$GITHUB_WORKSPACE" "$CLASS_NO" "$SOURCE_BOOK_ID" <<'PY'
          import json,sys
          from pathlib import Path
          from scripts.plan_textbook_layer45_matrix import BOOKS
          from scripts.textbook_pipeline_handoff import pair_for_book_id
          root=Path(sys.argv[1]); grade=sys.argv[2]; book_id=sys.argv[3]
          source=next((x for x in BOOKS if x["book_id"]==book_id),None)
          if source is None or str(source["class_no"])!=grade:
              raise SystemExit("Source book is not registered in the selected class.")
          ledger=root/"data"/"textbook-content-pipeline"/f"class-{grade}"/"books"/source["book_slug"]/"coverage-ledger.v1.json"
          if not ledger.is_file():
              raise SystemExit(f"Layer 5 prerequisite ledger missing: {ledger}")
          ledger_doc=json.loads(ledger.read_text(encoding="utf-8"))
          digest=str((ledger_doc.get("source") or {}).get("source_pdf_sha256") or "")
          if len(digest)!=64:
              raise SystemExit("Layer 5 source PDF SHA-256 invalid.")
          manifest=root/"data"/"textbook-content-pipeline"/f"class-{grade}"/"books"/source["book_slug"]/"layers-6-8"/f"{source['book_slug']}-sha{digest[:8]}-v5"/"layers-6-8-run-manifest.v1.json"
          if not manifest.is_file():
              raise SystemExit(f"Layers 6–8 output manifest missing: {manifest}")
          report=json.loads(manifest.read_text(encoding="utf-8"))
          if report.get("schema_version")!="quantaedge.layers-6-8-run-manifest.v1" or report.get("source_book_id")!=book_id or report.get("source_pdf_sha256")!=digest:
              raise SystemExit("Layers 6–8 handoff schema/source identity/hash mismatch.")
          if report.get("overall_status") not in {"IN_PROGRESS","INCOMPLETE","DRAFT_REQUIRES_HUMAN_REVIEW"}:
              raise SystemExit("Unexpected Layers 6–8 run-manifest status.")
          layer_values=report.get("layers") if isinstance(report.get("layers"),dict) else {}
          timing_values=report.get("layer_timings") if isinstance(report.get("layer_timings"),dict) else {}
          if set(timing_values) < {"6","7","8"}:
              raise SystemExit("Layers 6–8 timing handoff missing one or more explicit per-layer timing records.")
          for layer in (6,7,8):
              timing=timing_values[str(layer)]
              if timing.get("layer")!=layer or not isinstance(timing.get("attempt_elapsed_seconds"),(int,float)):
                  raise SystemExit(f"Layer {layer} timing handoff has invalid layer identity or elapsed duration.")
              if timing.get("shared_runtime_across_layers_6_8") is not True:
                  raise SystemExit(f"Layer {layer} does not declare the shared L6–L8 runtime contract.")
          def layer_handoff_status(layer):
              timing=timing_values[str(layer)]
              raw=str(timing.get("status") or layer_values.get(str(layer),report.get("overall_status","IN_PROGRESS")))
              if raw in {"COMPLETE","COMPLETED","NEEDS_REVIEW","DRAFT_MAPPED_REQUIRES_REVIEW","DRAFT_REQUIRES_HUMAN_REVIEW"}:
                  return "NEEDS_REVIEW"
              if raw in {"BLOCKED","FAILED","ERROR"}:
                  return "BLOCKED"
              return "CHECKPOINTED"
          status6,status7,status8=(layer_handoff_status(6),layer_handoff_status(7),layer_handoff_status(8))
          pending=report.get("pending_segments",0)
          if isinstance(pending,list): pending=len(pending)
          processed=int(report.get("segments_completed",0) or 0)
          expected=int(report.get("segments_total",0) or 0)
          unresolved=sum(int(report.get(k,0) or 0) for k in ("unresolved_source_pages","unresolved_text_pages","unresolved_chapter_segments","unresolved_text_segments"))
          runtime=(report.get("timing") or {}).get("model_runtime_seconds",0)
          if not isinstance(runtime,(int,float)) or runtime<0:
              raise SystemExit("Layers 6–8 cumulative model runtime is invalid.")
          for layer in (6,7,8):
              timing=timing_values[str(layer)]
              if not isinstance(timing.get("cumulative_elapsed_seconds"),(int,float)) or timing["cumulative_elapsed_seconds"]<0:
                  raise SystemExit(f"Layer {layer} cumulative wall-clock duration is invalid.")
          print(pair_for_book_id(book_id)["book_pair_id"],manifest.relative_to(root).as_posix(),status6,status7,status8,processed,expected,unresolved+int(pending or 0),runtime)
          PY
          )"
          for stage in 6 7 8; do
            case "$stage" in 6) layer_status="$status6" ;; 7) layer_status="$status7" ;; 8) layer_status="$status8" ;; esac
            python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$pair_id" --source-book-id "$SOURCE_BOOK_ID" --stage "$stage" --status "$layer_status" --reason-code BOUNDED_LAYERS6_8_CHECKPOINT --model "$MODEL" --processed-count "$processed" --expected-count "$expected" --unresolved-count "$unresolved" --completed-batches 1 --model-run-seconds "$model_runtime" --artifact "$manifest" --message "Validated per-layer status from the source-bound Layers 6–8 manifest; outputs remain review-only and shared runtime must not be summed across these layers."
          done
          git add data/textbook-content-pipeline/handoffs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "status(content): record Layers 6–8 handoff"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Record failed Layers 6–8 task without automatic retry
        if: failure() && (inputs.layer68_mode == 'run' || inputs.layer68_mode == 'resume')
        shell: bash
        env:
          CLASS_NO: ${{ inputs.class_no }}
          SOURCE_BOOK_ID: ${{ inputs.source_book_id }}
          MODEL: ${{ inputs.generation_model }}
        run: |
          set +e
          pair_id="$(python - "$SOURCE_BOOK_ID" <<'PY'
          import sys
          from scripts.textbook_pipeline_handoff import pair_for_book_id
          print(pair_for_book_id(sys.argv[1])["book_pair_id"])
          PY
          )"
          for stage in 6 7 8; do
            python scripts/textbook_pipeline_handoff.py record --repo-root . --class-no "$CLASS_NO" --book-pair-id "$pair_id" --source-book-id "$SOURCE_BOOK_ID" --stage "$stage" --status BLOCKED --reason-code WORKER_FAILURE_REQUIRES_TRIAGE --model "$MODEL" --message "Worker failed; inspect logs/checkpoint before explicitly retrying. No automatic restart is scheduled." || true
          done
          git add data/textbook-content-pipeline/handoffs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "status(content): record Layers 6–8 failure"
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## QuantaEdge Layers 6-8"
            echo "- Provider: native local Ollama /api/chat; no OpenAI API key or hosted endpoint."
            echo "- One whole-book source per run and a strict model-call budget."
            echo "- Content checkpoints stay on the selected task branch; resume reuses matching source, edition, model, prompt, contract and visual-evidence fingerprints."
            if [[ "${{ inputs.layer68_mode }}" == "resume" ]]; then echo "- Explicit RESUME mode selected: completed matching segments are reused; only pending/error segments within the new model-call budget are attempted."; fi
            if [[ ("${{ inputs.layer68_mode }}" == "resume" || "${{ inputs.layer68_mode }}" == "run") && "${{ steps.generation_preflight.outputs.preflight_state }}" == "MATCHED_CHECKPOINT" && "${{ steps.generation_preflight.outputs.retryable_segments }}" == "0" ]]; then echo "- All segments are already terminal; skipped Ollama startup/model download/inference."; fi
            echo "- Lessons, retrieval records and SFT examples remain review-only; production selection remains pending human review."
            echo "- IN_PROGRESS means repeat the same inputs to resume. It is never a false completion."
          } >> "$GITHUB_STEP_SUMMARY"
          docker logs --tail 80 quantaedge-layers-6-8-ollama 2>/dev/null || true
      - name: Stop Ollama service
        if: always()
        run: docker rm -f quantaedge-layers-6-8-ollama >/dev/null 2>&1 || true

  report-progress:
    if: ${{ inputs.task == 'progress_report' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report the timestamped class/pair/language progress
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_textbook_pair_progress.py --repo-root "$GITHUB_WORKSPACE" --json-out "$RUNNER_TEMP/textbook-progress.v1.json" --markdown-out "$RUNNER_TEMP/textbook-progress.md"
          cat "$RUNNER_TEMP/textbook-progress.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: class-6-8-bilingual-progress-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/textbook-progress.v1.json
            ${{ runner.temp }}/textbook-progress.md
          if-no-files-found: error
          retention-days: 30
  rebuild-corrections:
    if: ${{ inputs.task == 'rebuild_corrections' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild only accepted correction overlays in the selected pair scope
        env:
          CLASS_NO: ${{ inputs.class_no }}
          PAIR_ID: ${{ inputs.book_pair_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$CLASS_NO" "$PAIR_ID" "$RUNNER_TEMP/corrections-event.json" <<'PY'
          import json,sys
          from pathlib import Path
          from scripts.plan_textbook_layer45_matrix import BOOK_PAIRS
          root=Path.cwd(); grade,pair_id,event_path=sys.argv[1:]
          pairs=[p for p in BOOK_PAIRS if (grade=="all" or p["class_no"]==grade) and (pair_id=="all" or p["book_pair_id"]==pair_id)]
          overlays=[]
          for pair in pairs:
              for slug in pair["source_slugs_csv"].split(","):
                  file=root/"data"/"textbook-content-pipeline"/f"class-{pair['class_no']}"/"books"/slug/"visual-analysis-corrections.v1.json"
                  if file.is_file(): overlays.append(file.relative_to(root).as_posix())
          Path(event_path).write_text(json.dumps({"commits":[{"added":[],"modified":overlays,"removed":[]}]}),encoding="utf-8")
          print(json.dumps({"selected_overlays":overlays},indent=2))
          PY
          if ! grep -q "visual-analysis-corrections.v1.json" "$RUNNER_TEMP/corrections-event.json"; then echo "No corrections exist in this scope; no work was performed."; exit 0; fi
          python scripts/quantaedge_textbook_pipeline.py rebuild-corrections --event "$RUNNER_TEMP/corrections-event.json" --repo-root "$GITHUB_WORKSPACE"
          git add data/textbook-content-pipeline
          if git diff --cached --quiet; then echo "No derived correction outputs changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "rebuild(content): refresh Layer 5 from accepted corrections"
          git push origin "HEAD:${{ github.ref_name }}"
  audit_offline:
    if: ${{ inputs.task == 'audit_contracts' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
      - name: Test textbook registry and whole-book-only download safeguards
        run: python -m unittest discover -s tests -p "test_textbook_registry.py" -v
      - name: Test page extraction and checksum safeguards
        run: python -m unittest discover -s tests -p "test_extract_textbook_text.py" -v
      - name: Test question schema, bilingual source/output gates, and provenance
        run: python -m unittest discover -s tests -p "test_generate_questions_from_extraction.py" -v
      - name: Test reviewed-content import and language/edition gates
        run: python -m unittest discover -s tests -p "test_content_import.py" -v
      - name: Test static pipeline audit rules
        run: python -m unittest discover -s tests -p "test_audit_curriculum_pipeline.py" -v
      - name: Run offline tooling audit (does not claim live content completeness)
        run: python scripts/audit_curriculum_pipeline.py --skip-registry --strict

  audit_live_registry:
    if: ${{ inputs.task == 'audit_contracts' && inputs.pull_live_registry == true }}
    needs: [validate, audit_offline]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
      - name: Pull actual class/medium images
        shell: bash
        run: |
          set -u
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          root="source-pdfs/registry-cache"
          mkdir -p "$root"
          failures=0
          for grade in 6 7 8; do
            for language in hindi english; do
              image="ghcr.io/${owner}/quantaedge-textbooks-class-${grade}-${language}:latest"
              output="${root}/class-${grade}/${language}"
              mkdir -p "$output"
              if python scripts/textbook_registry.py pull --image "$image" --output-dir "$output"; then
                echo "PULL_OK ${image}"
              else
                echo "PULL_FAILED ${image}"
                printf '{"registry":"%s","books":[],"pull_error":true}\n' "$image" > "${output}/index.json"
                failures=1
              fi
            done
          done
          echo "PULL_FAILURES=${failures}" >> "$GITHUB_ENV"
      - name: Strict live asset report
        shell: bash
        run: |
          set +e
          python scripts/audit_curriculum_pipeline.py --cache-root source-pdfs/registry-cache --report curriculum-pipeline-live-audit.json --strict
          result=$?
          set -e
          python - <<'PY'
          import json
          r=json.load(open("curriculum-pipeline-live-audit.json",encoding="utf-8"))
          print("status",r["overall_status"],"blockers",r["summary"]["blockers"],"warnings",r["summary"]["warnings"])
          for x in r["findings"]:
              if x["severity"]=="BLOCKER": print(x["stage"],x["code"],x["message"])
          PY
          test "$result" -eq 0
          test "${PULL_FAILURES:-1}" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantaedge-curriculum-pipeline-live-audit
          path: curriculum-pipeline-live-audit.json
          if-no-files-found: warn

