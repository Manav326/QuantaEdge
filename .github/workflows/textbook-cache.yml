name: QuantaEdge Textbook Cache

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/textbook_registry.py"
      - ".github/workflows/textbook-cache.yml"
      - "tests/test_textbook_registry.py"
  workflow_dispatch:
    inputs:
      language:
        description: "Which medium's class-specific registries to update"
        type: choice
        options: [both, hindi, english]
        default: both
        required: true
      class_no:
        description: "One class (6–12), or 0 to process every class"
        type: number
        default: 0
        required: true
      download_artifacts:
        description: "Build 90-day browser-download ZIPs for selected class/medium images"
        type: boolean
        default: true
        required: true
      book_code:
        description: "Optional one-book-only NCERT code or registry ID"
        type: string
        required: false
      max_books:
        description: "Maximum new books per language (0 means all pending)"
        type: number
        default: 0
        required: true
      refresh:
        description: "Re-download cached books to verify content"
        type: boolean
        default: false
        required: true
      download_workers:
        description: "Number of parallel whole-book downloads"
        type: number
        default: 8
        required: true
      push_batch_size:
        description: "Number of completed books per Docker build/push batch"
        type: number
        default: 8
        required: true
      retry_rounds:
        description: "Maximum attempts for unresolved books (1–5)"
        type: number
        default: 5
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: quantaedge-textbook-cache-final
  # Never interrupt a writer or its recovery/export steps mid-run; the next publisher
  # resumes from the last atomically pushed class-image index.
  cancel-in-progress: false

jobs:
  cache-textbooks:
    name: Parallel whole-book downloads and persistent batch pushes
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF merge dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Run textbook registry regression tests
        run: python -m unittest discover -s tests -p "test_textbook_registry.py"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize run summary
        shell: bash
        run: |
          {
            echo "# QuantaEdge textbook cache"
            echo
            echo "Fourteen persistent GHCR images: Classes 6–12 × Hindi/English."
            echo "Each class image is checked before downloading; successful whole-book IDs are skipped on reruns."
            echo "Books download in parallel; an NCERT entry is cached only when one complete official book bundle validates. Individual chapter URL fallback is disabled."
            echo "Missing books and chapters are persisted in GHCR indexes and per-class/medium ZIP availability reports; content gaps do not stop other images."
            echo "Only registry publication or inventory-integrity errors fail the cache run."
            echo "Optional ZIP artifacts last 90 days; GHCR :latest images are the persistent store."
            echo
            echo "- Repository: ${{ github.repository }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "| Medium | Class | Publisher | Book | Registry ID | SHA-256 |"
            echo "|---|---:|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish and report all selected class/medium GHCR images
        id: publish
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_CLASS_NO: ${{ inputs.class_no }}
          INPUT_BOOK_CODE: ${{ inputs.book_code }}
          INPUT_MAX_BOOKS: ${{ inputs.max_books }}
          INPUT_REFRESH: ${{ inputs.refresh }}
          INPUT_DOWNLOAD_WORKERS: ${{ inputs.download_workers }}
          INPUT_PUSH_BATCH_SIZE: ${{ inputs.push_batch_size }}
          INPUT_RETRY_ROUNDS: ${{ inputs.retry_rounds }}
        run: |
          set -euo pipefail
          language="$INPUT_LANGUAGE"
          if [ -z "$language" ]; then language="both"; fi
          class_no="${INPUT_CLASS_NO:-0}"
          workers="${INPUT_DOWNLOAD_WORKERS:-8}"
          batch_size="${INPUT_PUSH_BATCH_SIZE:-8}"
          retry_rounds="${INPUT_RETRY_ROUNDS:-5}"
          args=(python scripts/textbook_registry.py publish --class-wise --language "$language" --download-workers "$workers" --push-batch-size "$batch_size" --retry-rounds "$retry_rounds" --image-prefix "ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/quantaedge-textbooks")
          if [ "$class_no" != "0" ] && [ -n "$class_no" ]; then args+=(--class-no "$class_no"); fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_BOOK_CODE}" ]; then args+=(--book-code "$INPUT_BOOK_CODE"); fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_MAX_BOOKS" ] && [ "$INPUT_MAX_BOOKS" != "0" ]; then args+=(--max-books "$INPUT_MAX_BOOKS"); fi
          if [ "$INPUT_REFRESH" = "true" ]; then args+=(--refresh); fi
          "${args[@]}"

      - name: Pull selected class images and create optional browser-download ZIPs
        if: steps.publish.outcome == 'success' && (github.event_name == 'push' || inputs.download_artifacts == true)
        shell: bash
        env:
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_CLASS_NO: ${{ inputs.class_no }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          language="$INPUT_LANGUAGE"
          if [ -z "$language" ] || [ "$language" = "both" ]; then languages=(hindi english); else languages=("$language"); fi
          class_no="${INPUT_CLASS_NO:-0}"
          if [ "$class_no" = "0" ] || [ -z "$class_no" ]; then classes=(6 7 8 9 10 11 12); else classes=("$class_no"); fi
          inv_root="$RUNNER_TEMP/textbook-inventory"
          out_root="$RUNNER_TEMP/textbook-downloads"
          mkdir -p "$inv_root" "$out_root"
          failures=0
          for grade in "${classes[@]}"; do
            for medium in "${languages[@]}"; do
              image="ghcr.io/$owner/quantaedge-textbooks-class-$grade-$medium:latest"
              target="$inv_root/class-$grade/$medium"
              echo "Pulling optional downloadable archive from $image"
              if ! python scripts/textbook_registry.py pull --image "$image" --output-dir "$target"; then
                echo "ARTIFACT_PULL_FAILED image=$image" | tee -a "$GITHUB_STEP_SUMMARY"
                failures=1
                continue
              fi
              python - "$target" "$out_root" "$grade" "$medium" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          source = Path(sys.argv[1])
          out = Path(sys.argv[2])
          grade = int(sys.argv[3])
          medium = sys.argv[4]
          index = json.loads((source / "index.json").read_text(encoding="utf-8"))
          items = index.get("books", [])
          statuses = index.get("download_status", {})
          archive_path = out / f"quantaedge-textbooks-class-{grade}-{medium}.zip"
          included = []
          absent = []
          partial = []
          incomplete_entries = []
          valid_files = {}
          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()
          for item in items:
              coverage = item.get("content_availability") or {}
              coverage_status = str(coverage.get("status", "complete")).casefold()
              if coverage_status != "complete" or "partial" in str(item.get("download_method", "")).casefold():
                  row = {
                      "book_id": item.get("book_id"), "title": item.get("title"),
                      "status": coverage_status if coverage_status else "incomplete",
                      "available_chapters": coverage.get("available_chapters", []),
                      "missing_chapters": coverage.get("missing_chapters", []),
                      "note": coverage.get("note") or "Incomplete source is excluded; only whole verified books are downloadable.",
                      "source_url": item.get("catalog_entry_url") or item.get("source_url"),
                  }
                  incomplete_entries.append(row)
                  if coverage_status == "partial":
                      partial.append(row)
                  continue
              relative = Path(str(item.get("file", "")))
              pdf = source / relative
              expected_hash = str(item.get("sha256", "")).lower()
              if (relative.is_absolute() or not relative.parts or ".." in relative.parts
                      or not pdf.is_file() or len(expected_hash) != 64 or sha256_file(pdf) != expected_hash):
                  absent.append({
                      "book_id": item.get("book_id"), "title": item.get("title"),
                      "status": "file_missing_or_checksum_mismatch",
                      "error": f"Indexed PDF is missing, unsafe, or failed SHA-256 verification: {relative}",
                      "content_availability": coverage,
                  })
              else:
                  valid_files[str(item.get("book_id", ""))] = (pdf, relative)
          unavailable = []
          for book_id, status in statuses.items():
              if not isinstance(status, dict):
                  continue
              state = str(status.get("status", ""))
              coverage = status.get("content_availability") or {}
              if state in ("failed", "retry_pending", "downloaded_pending_push") or coverage.get("status") == "unavailable":
                  unavailable.append({
                      "book_id": book_id, "title": status.get("title", book_id),
                      "status": state or "unavailable", "last_error": status.get("last_error"),
                      "content_availability": coverage, "source_url": status.get("source_url"),
                  })
          report = {
              "schema_version": 1,
              "image": index.get("registry", f"quantaedge-textbooks-class-{grade}-{medium}"),
              "class": grade, "medium": medium, "registry_book_count": len(items),
              "complete_books": len(valid_files),
              "partial_books": partial, "incomplete_book_entries_rejected": incomplete_entries,
              "unavailable_books": unavailable,
              "indexed_files_missing_from_export": absent, "download_status": statuses,
              "note": "ZIP includes only whole-book PDFs with verified SHA-256 and complete status. Partial or unavailable source entries are excluded.",
          }
          report_path = out / f"quantaedge-textbooks-class-{grade}-{medium}.availability.json"
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              archive.writestr("index.json", json.dumps(index, ensure_ascii=False, indent=2) + "\n")
              archive.writestr("availability-report.json", json.dumps(report, ensure_ascii=False, indent=2) + "\n")
              for item in items:
                  book_id = str(item.get("book_id", ""))
                  if book_id not in valid_files:
                      continue
                  pdf, relative = valid_files[book_id]
                  archive.write(pdf, relative.as_posix())
                  included.append(book_id)
          print(f"DOWNLOAD_BUNDLE {archive_path.name} index_entries={len(items)} complete_pdfs_included={len(included)} incomplete_entries_rejected={len(incomplete_entries)} unavailable={len(unavailable)} missing_files={len(absent)} bytes={archive_path.stat().st_size}")
          print(f"AVAILABILITY_REPORT {report_path.name}")
          PY
            done
          done
          if [ "$failures" -ne 0 ]; then exit 1; fi

      - name: Upload direct book downloads and inventories
        if: always() && steps.publish.outcome == 'success' && (github.event_name == 'push' || inputs.download_artifacts == true)
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-textbooks-downloads-${{ github.run_number }}
          path: ${{ runner.temp }}/textbook-downloads/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
