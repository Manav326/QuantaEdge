name: QuantaEdge Textbook Content Pipeline

on:
  workflow_dispatch:
    inputs:
      task:
        description: "One explicit content task. Default only reports progress."
        required: true
        type: choice
        options: [refresh_source_cache, repair_source_cache_queue, extract_and_mirror, prepare_layers_1_5, repair_layers_4_5, rebuild_corrections, layers_6_8, progress_report, audit_contracts]
        default: progress_report
      class_no:
        description: "Class for the selected textbook task"
        required: true
        type: choice
        options: ["6", "7", "8", "all"]
        default: "6"
      book_pair_id:
        description: "Exact bilingual book pair or all pairs in the selected classes"
        required: true
        type: choice
        options: [all, class6-science-bilingual, class6-maths-bilingual, class7-science-bilingual, class7-maths-part1-bilingual, class7-maths-part2-bilingual, class8-science-bilingual, class8-maths-part1-bilingual, class8-maths-part2-bilingual]
        default: all
      analysis_mode:
        description: "Preparation only by default; analysis/resume is always explicit"
        required: true
        type: choice
        options: [prepare_only, analyze_all, resume_preparation, resume_layers_4_5]
        default: prepare_only
      vision_model:
        description: "Vision model for explicitly requested Layer 4 inference"
        required: true
        type: string
        default: qwen2.5vl:3b
      checkpoint_batch_size:
        description: "Visual assets per durable checkpoint"
        required: true
        type: choice
        options: ["5", "10"]
        default: "5"
      cache_language:
        description: "Source-cache language selection"
        required: true
        type: choice
        options: [both, hindi, english]
        default: both
      cache_class_no:
        description: "Source-cache class 6–12, or 0 for all"
        required: true
        type: number
        default: 6
      cache_book_code:
        description: "Optional source-cache book code"
        required: false
        type: string
      cache_max_books:
        description: "Maximum new books per language; 0 means all pending"
        required: true
        type: number
        default: 0
      cache_refresh:
        description: "Re-download cached books for verification"
        required: true
        type: boolean
        default: false
      cache_download_artifacts:
        description: "Build 90-day browser-download ZIPs"
        required: true
        type: boolean
        default: false
      cache_download_workers:
        description: "Parallel whole-book downloads; keep modest"
        required: true
        type: number
        default: 2
      cache_push_batch_size:
        description: "Whole books per GHCR publish batch"
        required: true
        type: number
        default: 2
      cache_retry_rounds:
        description: "Retries for unresolved source books"
        required: true
        type: number
        default: 3
      source_book_id:
        description: "Exact source book ID for a Layers 6–8 draft task"
        required: true
        type: string
        default: ncert-c6-english-fecu1
      layer68_mode:
        description: "Benchmark, bounded review-only generation, resume same checkpoint, or refresh benchmark"
        required: true
        type: choice
        options: [benchmark, run, resume, refresh_benchmark]
        default: benchmark
      benchmark_models:
        description: "Candidate Ollama models for explicit benchmark"
        required: true
        type: string
        default: qwen2.5:1.5b,qwen2.5:3b
      generation_model:
        description: "Model for bounded review-only generation"
        required: true
        type: string
        default: qwen2.5:1.5b
      max_model_calls:
        description: "Maximum model calls for one generation request (1–20)"
        required: true
        type: number
        default: 6
      checkpoint_every:
        description: "Checkpoint interval in model calls"
        required: true
        type: choice
        options: ["1", "2", "3", "5"]
        default: "2"
      allow_experimental_model:
        description: "Required opt-in for unapproved model output (still review-only)"
        required: true
        type: boolean
        default: false
      pull_live_registry:
        description: "Pull live GHCR registries only when the expensive audit is explicitly requested"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  packages: write

# Every resource-heavy operation enters through this dispatcher; no automatic continuation.
concurrency:
  group: qe-textbook-content-pipeline-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact task scope and contracts before processing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only the extraction test dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
      - name: Validate pair/book/layer compatibility without model inference
        env:
          TASK: ${{ inputs.task }}
          CLASS_NO: ${{ inputs.class_no }}
          PAIR_ID: ${{ inputs.book_pair_id }}
          SOURCE_BOOK_ID: ${{ inputs.source_book_id }}
          L68_MODE: ${{ inputs.layer68_mode }}
          ALLOW_EXPERIMENTAL: ${{ inputs.allow_experimental_model }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TASK" =~ ^(refresh_source_cache|repair_source_cache_queue|extract_and_mirror|prepare_layers_1_5|repair_layers_4_5|rebuild_corrections|layers_6_8|progress_report|audit_contracts)$ ]] || { echo "::error::Unknown task."; exit 2; }
          [[ "$CLASS_NO" =~ ^(6|7|8|all)$ ]] || { echo "::error::Invalid class selector."; exit 2; }
          [[ "$PAIR_ID" =~ ^(all|class(6|7|8)-(science|maths(-part[12])?)-bilingual)$ ]] || { echo "::error::Invalid bilingual pair ID."; exit 2; }
          if [[ "$CLASS_NO" != "all" && "$PAIR_ID" != "all" && "$PAIR_ID" != class"$CLASS_NO"-* ]]; then echo "::error::The pair does not belong to the selected class."; exit 2; fi
          if [[ "$TASK" == "layers_6_8" && "$CLASS_NO" == "all" ]]; then echo "::error::Layers 6–8 requires one specific class and source book."; exit 2; fi
          if [[ "$TASK" == "layers_6_8" && "$SOURCE_BOOK_ID" == "" ]]; then echo "::error::Select a source_book_id."; exit 2; fi
          if [[ "$TASK" == "layers_6_8" ]]; then
            python - "$CLASS_NO" "$SOURCE_BOOK_ID" <<'PY'
          import sys
          from scripts.plan_textbook_layer45_matrix import BOOKS
          grade, book_id = sys.argv[1:]
          source = next((item for item in BOOKS if item["book_id"] == book_id), None)
          if source is None:
              raise SystemExit(f"Unknown source_book_id: {book_id}")
          if str(source["class_no"]) != grade:
              raise SystemExit(f"Source book {book_id} belongs to Class {source['class_no']}, not Class {grade}.")
          PY
          fi
          if [[ "$TASK" == "layers_6_8" && ("$L68_MODE" == "run" || "$L68_MODE" == "resume") && "$ALLOW_EXPERIMENTAL" != "true" ]]; then echo "::error::Explicitly enable the experimental model before generating review-only drafts."; exit 2; fi
          python -m py_compile scripts/plan_textbook_layer45_matrix.py scripts/select_textbook_source_pair.py scripts/textbook_pipeline_handoff.py scripts/quantaedge_textbook_pipeline.py scripts/quantaedge_layers_6_8.py scripts/report_textbook_pair_progress.py scripts/extract_textbook_text.py scripts/extract_visual_asset_inventory.py scripts/prepare_visual_candidate_batch.py scripts/analyze_visual_inventory_with_ollama.py
          python -m unittest discover -s tests -p "test_extract_textbook_text.py" -v
          python -m unittest discover -s tests -p "test_extract_visual_asset_inventory.py" -v
          python -m unittest discover -s tests -p "test_analyze_visual_inventory_with_ollama.py" -v
          python -m unittest discover -s tests -p "test_prepare_visual_candidate_batch.py" -v
          python -m unittest discover -s tests -p "test_plan_textbook_layer45_matrix.py" -v
          python -m unittest discover -s tests -p "test_select_textbook_source_pair.py" -v
          python -m unittest discover -s tests -p "test_textbook_pipeline_handoff.py" -v
          python -m unittest discover -s tests -p "test_report_textbook_pair_progress.py" -v
          python -m unittest discover -s tests -p "test_quantaedge_textbook_pipeline.py" -v
          python -m unittest discover -s tests -p "test_workflow_resume_entrypoints.py" -v
  cache_textbooks:
    if: ${{ inputs.task == 'refresh_source_cache' || inputs.task == 'repair_source_cache_queue' }}
    needs: validate
    name: Parallel whole-book downloads and persistent batch pushes
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout caller branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF merge dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Run textbook registry regression tests
        run: python -m unittest discover -s tests -p "test_textbook_registry.py"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize run summary
        shell: bash
        run: |
          {
            echo "# QuantaEdge textbook cache"
            echo
            echo "Fourteen persistent GHCR images: Classes 6–12 × Hindi/English."
            echo "Each class image is checked before downloading; successful whole-book IDs are skipped on reruns."
            echo "Books download in parallel; an NCERT entry is cached only when one complete official book bundle validates. Individual chapter URL fallback is disabled."
            echo "Missing books and chapters are persisted in GHCR indexes and per-class/medium ZIP availability reports; content gaps do not stop other images."
            echo "Only registry publication or inventory-integrity errors fail the cache run."
            echo "Each class/medium ZIP and its availability JSON are separate, individually downloadable 90-day artifacts."
            echo "GHCR :latest images are the persistent store."
            echo
            echo "- Repository: ${{ github.repository }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "| Medium | Class | Publisher | Book | Registry ID | SHA-256 |"
            echo "|---|---:|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish and report all selected class/medium GHCR images
        id: publish
        shell: bash
        env:
          INPUT_REPAIR_QUEUE_ONLY: ${{ inputs.task == 'repair_source_cache_queue' }}
          INPUT_DOWNLOAD_ARTIFACTS: ${{ inputs.cache_download_artifacts }}
          INPUT_LANGUAGE: ${{ inputs.cache_language }}
          INPUT_CLASS_NO: ${{ inputs.cache_class_no }}
          INPUT_BOOK_CODE: ${{ inputs.cache_book_code }}
          INPUT_MAX_BOOKS: ${{ inputs.cache_max_books }}
          INPUT_REFRESH: ${{ inputs.cache_refresh }}
          INPUT_DOWNLOAD_WORKERS: ${{ inputs.cache_download_workers }}
          INPUT_PUSH_BATCH_SIZE: ${{ inputs.cache_push_batch_size }}
          INPUT_RETRY_ROUNDS: ${{ inputs.cache_retry_rounds }}
        run: |
          set -euo pipefail
          language="$INPUT_LANGUAGE"
          if [ -z "$language" ]; then language="both"; fi
          class_no="${INPUT_CLASS_NO:-0}"
          workers="${INPUT_DOWNLOAD_WORKERS:-8}"
          batch_size="${INPUT_PUSH_BATCH_SIZE:-8}"
          retry_rounds="${INPUT_RETRY_ROUNDS:-5}"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_prefix="ghcr.io/$owner/quantaedge-textbooks"
          repair_queue="data/textbook-cache/repair-queue.json"
          if [ "$INPUT_REPAIR_QUEUE_ONLY" = "true" ]; then
            # Fail closed: a push-triggered run may ONLY process these five books.
            # Never fall through to the general publisher for an implicit full-catalog scan.
            if [ ! -f "$repair_queue" ] || ! jq -e '
              .enabled == true
              and (.books | type == "array")
              and (.books | length == 5)
              and ([.books[] | "\(.class_no):\(.language):\(.book_code)"] | sort)
                  == (["7:english:gegp2","8:hindi:hhgp1","8:hindi:hhgp2","8:hindi:hhcu1","8:english:hegp2"] | sort)
            ' "$repair_queue" >/dev/null; then
              echo "Refusing an implicit all-books publish on push: repair queue must contain exactly the five approved books."
              exit 1
            fi
            echo "repair_only=true" >> "$GITHUB_OUTPUT"
            echo "Running targeted NCERT repair queue. Each verified whole book is published to its existing class/medium :latest image before moving to the next title."
            failures=0
          processed=0
            while IFS=$'\t' read -r grade medium code title; do
              [ -n "$code" ] || continue
              processed=$((processed + 1))
              echo "::group::Repair Class $grade $medium — $title ($code)"
              target_args=(python scripts/textbook_registry.py publish --class-wise --language "$medium" --class-no "$grade" --book-code "$code" --refresh --download-workers 1 --push-batch-size 1 --retry-rounds "$retry_rounds" --image-prefix "$image_prefix")
              output_file="$RUNNER_TEMP/repair-class-$grade-$medium-$code.log"
              set +e
              "${target_args[@]}" 2>&1 | tee "$output_file"
              command_status=${PIPESTATUS[0]}
              set -e
              if [ "$command_status" -ne 0 ] || ! grep -Fq '"content_incomplete": false' "$output_file"; then
                echo "REPAIR_NOT_VERIFIED class=$grade medium=$medium code=$code; inspect the report above."
                failures=1
              else
                echo "REPAIR_VERIFIED_AND_PUSHED class=$grade medium=$medium code=$code"
              fi
              echo "::endgroup::"
            done < <(jq -r '.books[] | [.class_no, .language, .book_code, .title] | @tsv' "$repair_queue")
            if [ "$processed" -ne 5 ]; then
              echo "REPAIR_SCOPE_ERROR: processed $processed entries, expected exactly five approved books."
              exit 1
            fi
            if [ "$failures" -ne 0 ]; then
              echo "At least one requested textbook remains unresolved. Any books that passed validation were pushed individually to GHCR."
              exit 1
            fi
            echo "All requested missing books were verified and pushed to their existing GHCR images."
            exit 0
          fi
          echo "repair_only=false" >> "$GITHUB_OUTPUT"
          args=(python scripts/textbook_registry.py publish --class-wise --language "$language" --download-workers "$workers" --push-batch-size "$batch_size" --retry-rounds "$retry_rounds" --image-prefix "$image_prefix")
          if [ "$class_no" != "0" ] && [ -n "$class_no" ]; then args+=(--class-no "$class_no"); fi
          if [ -n "${INPUT_BOOK_CODE}" ]; then args+=(--book-code "$INPUT_BOOK_CODE"); fi
          if [ -n "$INPUT_MAX_BOOKS" ] && [ "$INPUT_MAX_BOOKS" != "0" ]; then args+=(--max-books "$INPUT_MAX_BOOKS"); fi
          if [ "$INPUT_REFRESH" = "true" ]; then args+=(--refresh); fi
          "${args[@]}"

      - name: Pull selected class images and create optional browser-download ZIPs
        if: steps.publish.outcome == 'success' && steps.publish.outputs.repair_only != 'true' && inputs.cache_download_artifacts == true
        shell: bash
        env:
          INPUT_LANGUAGE: ${{ inputs.cache_language }}
          INPUT_CLASS_NO: ${{ inputs.cache_class_no }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          language="$INPUT_LANGUAGE"
          if [ -z "$language" ] || [ "$language" = "both" ]; then languages=(hindi english); else languages=("$language"); fi
          class_no="${INPUT_CLASS_NO:-0}"
          if [ "$class_no" = "0" ] || [ -z "$class_no" ]; then classes=(6 7 8 9 10 11 12); else classes=("$class_no"); fi
          inv_root="$RUNNER_TEMP/textbook-inventory"
          out_root="$RUNNER_TEMP/textbook-downloads"
          mkdir -p "$inv_root" "$out_root"
          failures=0
          for grade in "${classes[@]}"; do
            for medium in "${languages[@]}"; do
              image="ghcr.io/$owner/quantaedge-textbooks-class-$grade-$medium:latest"
              target="$inv_root/class-$grade/$medium"
              echo "Pulling optional downloadable archive from $image"
              if ! python scripts/textbook_registry.py pull --image "$image" --output-dir "$target"; then
                echo "ARTIFACT_PULL_FAILED image=$image" | tee -a "$GITHUB_STEP_SUMMARY"
                failures=1
                continue
              fi
              python - "$target" "$out_root" "$grade" "$medium" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          source = Path(sys.argv[1])
          out = Path(sys.argv[2])
          grade = int(sys.argv[3])
          medium = sys.argv[4]
          index = json.loads((source / "index.json").read_text(encoding="utf-8"))
          items = index.get("books", [])
          statuses = index.get("download_status", {})
          archive_path = out / f"quantaedge-textbooks-class-{grade}-{medium}.zip"
          included = []
          absent = []
          partial = []
          incomplete_entries = []
          valid_files = {}
          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()
          export_index = json.loads(json.dumps(index))
          export_items = export_index.get("books", [])
          exported_item_by_id = {str(item.get("book_id", "")): item for item in export_items}
          for item in items:
              coverage = item.get("content_availability") or {}
              coverage_status = str(coverage.get("status", "complete")).casefold()
              method_partial = "partial" in str(item.get("download_method", "")).casefold()
              is_partial = coverage_status == "partial" or method_partial
              row = None
              if coverage_status == "unavailable":
                  row = {
                      "book_id": item.get("book_id"), "title": item.get("title"),
                      "status": "unavailable",
                      "available_chapters": coverage.get("available_chapters", []),
                      "missing_chapters": coverage.get("missing_chapters", []),
                      "note": coverage.get("note") or "No usable PDF was available from official sources.",
                      "source_url": item.get("catalog_entry_url") or item.get("source_url"),
                  }
                  incomplete_entries.append(row)
                  continue
              if is_partial:
                  row = {
                      "book_id": item.get("book_id"), "title": item.get("title"),
                      "status": "partial",
                      "available_chapters": coverage.get("available_chapters", []),
                      "missing_chapters": coverage.get("missing_chapters", []),
                      "note": coverage.get("note") or "PARTIAL PDF; review missing chapters before use.",
                      "source_url": item.get("catalog_entry_url") or item.get("source_url"),
                  }
                  incomplete_entries.append(row)
                  partial.append(row)
              relative = Path(str(item.get("file", "")))
              pdf = source / relative
              expected_hash = str(item.get("sha256", "")).lower()
              if (relative.is_absolute() or not relative.parts or ".." in relative.parts
                      or not pdf.is_file() or len(expected_hash) != 64 or sha256_file(pdf) != expected_hash):
                  missing_row = {
                      "book_id": item.get("book_id"), "title": item.get("title"),
                      "status": "file_missing_or_checksum_mismatch",
                      "error": f"Indexed PDF is missing, unsafe, or failed SHA-256 verification: {relative}",
                      "content_availability": coverage,
                  }
                  absent.append(missing_row)
                  if row is not None:
                      row["pdf_included"] = False
                      row["pdf_error"] = missing_row["error"]
              else:
                  valid_files[str(item.get("book_id", ""))] = (pdf, relative, "partial" if is_partial else "complete")
                  if row is not None:
                      row["pdf_included"] = True
                      row["download_path"] = "partial-books/" + str(item.get("book_id")) + ".pdf"
                      exported_item_by_id[str(item.get("book_id", ""))]["file"] = row["download_path"]
          unavailable = []
          for book_id, status in statuses.items():
              if not isinstance(status, dict):
                  continue
              state = str(status.get("status", ""))
              coverage = status.get("content_availability") or {}
              if state in ("failed", "retry_pending", "downloaded_pending_push") or coverage.get("status") == "unavailable":
                  unavailable.append({
                      "book_id": book_id, "title": status.get("title", book_id),
                      "status": state or "unavailable", "last_error": status.get("last_error"),
                      "content_availability": coverage, "source_url": status.get("source_url"),
                  })
          report = {
              "schema_version": 1,
              "image": index.get("registry", f"quantaedge-textbooks-class-{grade}-{medium}"),
              "class": grade, "medium": medium, "registry_book_count": len(items),
              "complete_books": sum(1 for _pdf, _relative, status in valid_files.values() if status == "complete"),
              "partial_books": partial, "incomplete_book_entries_reported": incomplete_entries,
              "unavailable_books": unavailable,
              "indexed_files_missing_from_export": absent, "download_status": statuses,
              "note": "ZIP includes verified complete textbooks and separately stored partial PDFs under partial-books/. Every partial book lists missing chapter numbers here and remains excluded from the complete student textbook catalogue.",
          }
          report_path = out / f"quantaedge-textbooks-class-{grade}-{medium}.availability.json"
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              archive.writestr("index.json", json.dumps(export_index, ensure_ascii=False, indent=2) + "\n")
              archive.writestr("availability-report.json", json.dumps(report, ensure_ascii=False, indent=2) + "\n")
              for item in items:
                  book_id = str(item.get("book_id", ""))
                  if book_id not in valid_files:
                      continue
                  pdf, relative, status = valid_files[book_id]
                  archive_path_in_zip = ("partial-books/" + book_id + ".pdf") if status == "partial" else relative.as_posix()
                  archive.write(pdf, archive_path_in_zip)
                  included.append(book_id)
          complete_included = sum(1 for _pdf, _relative, status in valid_files.values() if status == "complete")
          partial_included = sum(1 for _pdf, _relative, status in valid_files.values() if status == "partial")
          print(f"DOWNLOAD_BUNDLE {archive_path.name} index_entries={len(items)} complete_pdfs_included={complete_included} partial_pdfs_included={partial_included} incomplete_entries_reported={len(incomplete_entries)} unavailable={len(unavailable)} missing_files={len(absent)} bytes={archive_path.stat().st_size}")
          print(f"AVAILABILITY_REPORT {report_path.name}")
          PY
            done
          done
          if [ "$failures" -ne 0 ]; then exit 1; fi

      - name: Upload Class 6 Hindi textbook ZIP
        if: always() && steps.publish.outcome == 'success' && steps.publish.outputs.repair_only != 'true' && inputs.cache_download_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-textbooks-class-6-hindi-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/textbook-downloads/quantaedge-textbooks-class-6-hindi.zip
            ${{ runner.temp }}/textbook-downloads/quantaedge-textbooks-class-6-hindi.availability.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload Class 6 English textbook ZIP
        if: always() && steps.publish.outcome == 'success' && steps.publish.outputs.repair_only != 'true' && inputs.cache_download_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-textbooks-class-6-english-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/textbook-downloads/quantaedge-textbooks-class-6-english.zip
            ${{ runner.temp }}/textbook-downloads/quantaedge-textbooks-class-6-english.availability.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload Class 7 Hindi textbook ZIP
        if: always() && steps.publish.outcome == 'success' && steps.publish.outputs.repair_only != 'true' && inputs.cache_download_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-textbooks-class-7-hindi-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/textbook-downloads/quantaedge-textbooks-class-7-hindi.zip
            ${{ runner.temp }}/textbook-downloads/quantaedge-textbooks-class-7-hindi.availability.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload Class 7 English textbook ZIP
        if: always() && steps.publish.outcome == 'success' && steps.publish.outputs.repair_only != 'true' && inputs.cache_download_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-textbooks-class-7-english-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/textbook-downloads/quantaedge-textbooks-class-7-english.zip
            ${{ runner.temp }}/textbook-downloads/quantaedge-textbooks-class-7-english.availability.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

