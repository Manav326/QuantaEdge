name: QuantaEdge Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to deploy"
        required: true
        default: "main"

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.QUANTAEDGE_DEPLOY_HOST }}
          username: ${{ secrets.QUANTAEDGE_DEPLOY_USER }}
          key: ${{ secrets.QUANTAEDGE_DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd /opt/quantaedge
            git fetch --prune origin
            git checkout "${{ inputs.ref }}"
            git reset --hard "origin/${{ inputs.ref }}"
            export QUANTAEDGE_IMAGE_TAG="sha-$(git rev-parse HEAD)"
            export QUANTAEDGE_GHCR_OWNER="${{ github.repository_owner }}"
            echo "${{ secrets.QUANTAEDGE_GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
