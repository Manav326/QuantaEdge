name: Resumable textbook visual extraction and analysis

on:
  workflow_dispatch:
    inputs:
      book_slug:
        description: Stable short identifier, e.g. class6-curiosity-en
        required: true
        type: string
      class_no:
        description: Bihar Board class number
        required: true
        default: "6"
        type: choice
        options:
          - "6"
          - "7"
          - "8"
      language:
        description: Book language and matching class-wise GHCR image
        required: true
        default: english
        type: choice
        options:
          - english
          - hindi
      book_id:
        description: Exact book ID from the committed source manifest, e.g. ncert-c6-english-fecu1
        required: true
        default: ncert-c6-english-fecu1
        type: string
      model:
        description: Ollama vision model tag
        required: true
        default: qwen2.5vl:3b
        type: string
      max_assets:
        description: Maximum candidate assets to process in this run (raise to continue through a larger book)
        required: true
        default: "100"
        type: string
      restart_analysis:
        description: Discard the previous analysis checkpoint and intentionally start over
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: textbook-visual-analysis-${{ inputs.book_slug }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Extract and analyze textbook visuals
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BOOK_SLUG: ${{ inputs.book_slug }}
      CLASS_NO: ${{ inputs.class_no }}
      LANGUAGE: ${{ inputs.language }}
      BOOK_ID: ${{ inputs.book_id }}
      VISION_MODEL: ${{ inputs.model }}
      MAX_ASSETS: ${{ inputs.max_assets }}
      RESTART_ANALYSIS: ${{ inputs.restart_analysis }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate inputs and install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BOOK_SLUG" =~ ^[a-z0-9]+([.-][a-z0-9]+)*$ ]] || { echo "Invalid book_slug"; exit 2; }
          [[ "$MAX_ASSETS" =~ ^[1-9][0-9]*$ ]] && (( MAX_ASSETS <= 10000 )) || { echo "max_assets must be 1..10000"; exit 2; }
          [[ "$BOOK_ID" =~ ^ncert-c${CLASS_NO}-${LANGUAGE}-[a-z0-9]+$ ]] || { echo "book_id must match the selected class and language"; exit 2; }
          python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Pull the exact whole-book PDF from the class-wise GHCR cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_IMAGE="ghcr.io/manav326/quantaedge-textbooks-class-$CLASS_NO-$LANGUAGE:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$SOURCE_IMAGE"
          container_id="$(docker create "$SOURCE_IMAGE" /__quantaedge_cache_inspection_only)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/quantaedge-source"
          docker cp "$container_id:/index.json" "$RUNNER_TEMP/quantaedge-source/index.json"
          docker cp "$container_id:/books/$BOOK_ID.pdf" "$RUNNER_TEMP/quantaedge-source/source.pdf"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          source_dir = Path(os.environ["RUNNER_TEMP"]) / "quantaedge-source"
          book_id = os.environ["BOOK_ID"]
          class_no = os.environ["CLASS_NO"]
          language = os.environ["LANGUAGE"]
          index = json.loads((source_dir / "index.json").read_text(encoding="utf-8"))
          entries = [item for item in index.get("books", []) if item.get("book_id") == book_id]
          if len(entries) != 1 or entries[0].get("file") != f"books/{book_id}.pdf":
              raise SystemExit("The selected whole book is not present in the GHCR index.")
          manifest_dir = root / "data" / "textbook-extractions" / f"class-{class_no}" / language / "pages"
          matches = []
          for path in manifest_dir.glob("*.manifest.json"):
              try:
                  item = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if item.get("book_id") == book_id:
                  matches.append((path, item))
          if len(matches) != 1:
              raise SystemExit(f"Expected one committed source manifest for {book_id}; found {len(matches)}.")
          manifest_path, manifest = matches[0]
          expected_hash = str(entries[0].get("sha256", "")).lower()
          actual_manifest_hash = str(manifest.get("original_book_sha256") or manifest.get("asset_pdf_sha256") or "").lower()
          if not expected_hash or actual_manifest_hash != expected_hash:
              raise SystemExit("The GHCR index PDF hash does not match the committed source manifest.")
          page_name = manifest.get("text_jsonl")
          if not isinstance(page_name, str) or not page_name or Path(page_name).name != page_name or not page_name.endswith(".jsonl"):
              raise SystemExit("The source manifest has an unsafe sibling page JSONL name.")
          page_path = manifest_path.parent / page_name
          if not page_path.is_file():
              raise SystemExit(f"Committed sibling page JSONL is missing: {page_path}")
          shutil.copy2(manifest_path, source_dir / "source.manifest.json")
          shutil.copy2(page_path, source_dir / page_name)
          print(json.dumps({"book_id": book_id, "ghcr_image": f"ghcr.io/manav326/quantaedge-textbooks-class-{class_no}-{language}:latest", "manifest": str(manifest_path), "pdf_sha256": expected_hash}, indent=2))
          PY
          echo "SOURCE_DIR=$RUNNER_TEMP/quantaedge-source" >> "$GITHUB_ENV"
      - name: Set up Ollama model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-model-${{ inputs.model }}

      - name: Start Ollama and ensure the vision model is available
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || { cat "$RUNNER_TEMP/ollama.log"; exit 1; }
          ollama pull "$VISION_MODEL"

      - name: Build inventory and persist resumable vision batches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/oras-project/oras/main/install.sh | VERSION=1.2.0 sh
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          out="data/textbook-visuals/$BOOK_SLUG"
          checkpoint="$RUNNER_TEMP/previous-visual-analysis.v1.json"
          if [[ "$RESTART_ANALYSIS" != "true" && -f "$out/visual-analysis.v1.json" ]]; then
            cp "$out/visual-analysis.v1.json" "$checkpoint"
          fi
          rm -rf "$out"
          mkdir -p "$out"
          python scripts/extract_visual_asset_inventory.py \
            --pdf "$SOURCE_DIR/source.pdf" \
            --manifest "$SOURCE_DIR/source.manifest.json" \
            --output-dir "$out"
          if [[ -f "$checkpoint" ]]; then cp "$checkpoint" "$out/visual-analysis.v1.json"; fi

          package="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quantaedge-textbook-visuals"
          total_limit="$MAX_ASSETS"
          processed_total=0
          batch_size=10
          while (( processed_total < total_limit )); do
            remaining=$((total_limit - processed_total))
            batch="$batch_size"
            if (( remaining < batch )); then batch="$remaining"; fi
            args=(--inventory "$out/visual-inventory.v1.json" --model "$VISION_MODEL" --max-assets "$batch" --include-page-previews --run-id "$GITHUB_RUN_ID")
            if [[ -f "$out/visual-analysis.v1.json" ]]; then args+=(--resume); fi
            python scripts/analyze_visual_inventory_with_ollama.py "${args[@]}"
            batch_processed="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["summary"]["assets_processed_this_run"])' "$out/visual-analysis.v1.json")"

            # Commit each batch before proceeding. A cancelled runner only repeats the
            # currently active batch, not the book or already committed analysis.
            git add "$out/visual-inventory.v1.json" "$out/visual-analysis.v1.json"
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Checkpoint textbook visual analysis batch: $BOOK_SLUG"
            fi
            git pull --rebase origin main
            git push origin HEAD:main
            # Mirror the small durable checkpoint to GHCR after the repository commit.
            oras push "$package:class6-$BOOK_SLUG-checkpoint" "$out/visual-analysis.v1.json:application/json"

            processed_total=$((processed_total + batch_processed))
            if (( batch_processed == 0 )); then break; fi
          done

          python -m unittest discover -s tests -p "test_extract_visual_asset_inventory.py" -v
          python -m unittest discover -s tests -p "test_analyze_visual_inventory_with_ollama.py" -v

      - name: Package full-resolution assets and previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quantaedge-visual-bundle"
          cp -R "data/textbook-visuals/$BOOK_SLUG/." "$RUNNER_TEMP/quantaedge-visual-bundle/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$BOOK_SLUG-visual-bundle.tar.gz" quantaedge-visual-bundle
          sha256sum "$RUNNER_TEMP/$BOOK_SLUG-visual-bundle.tar.gz" | tee "$RUNNER_TEMP/$BOOK_SLUG-bundle.sha256"

      - name: Publish versioned and stable visual bundles to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/oras-project/oras/main/install.sh | VERSION=1.2.0 sh
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          package="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quantaedge-textbook-visuals"
          version_tag="class6-$BOOK_SLUG-run-$GITHUB_RUN_ID"
          oras push "$package:$version_tag" "$RUNNER_TEMP/$BOOK_SLUG-visual-bundle.tar.gz:application/gzip"
          oras push "$package:class6-$BOOK_SLUG-latest" "$RUNNER_TEMP/$BOOK_SLUG-visual-bundle.tar.gz:application/gzip"
          echo "VISUAL_PACKAGE=$package" >> "$GITHUB_ENV"
          echo "VISUAL_VERSION_TAG=$version_tag" >> "$GITHUB_ENV"
          echo "VISUAL_SHA256=$(cut -d' ' -f1 "$RUNNER_TEMP/$BOOK_SLUG-bundle.sha256")" >> "$GITHUB_ENV"

      - name: Update repository checkpoint and GHCR index
        shell: bash
        run: |
          set -euo pipefail
          out="data/textbook-visuals/$BOOK_SLUG"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          slug = os.environ["BOOK_SLUG"]
          out = root / "data" / "textbook-visuals" / slug
          package = os.environ["VISUAL_PACKAGE"]
          tag = os.environ["VISUAL_VERSION_TAG"]
          digest = os.environ["VISUAL_SHA256"]
          inventory = json.loads((out / "visual-inventory.v1.json").read_text(encoding="utf-8"))
          analysis = json.loads((out / "visual-analysis.v1.json").read_text(encoding="utf-8"))
          index = {
              "schema_version": "quantaedge.textbook-visual-bundle-index.v1",
              "book_slug": slug,
              "source_book_id": inventory["source"]["book_id"],
              "source_pdf_sha256": inventory["source"]["pdf_sha256"],
              "visual_inventory_schema": inventory["schema_version"],
              "analysis_schema": analysis["schema_version"],
              "analysis_model": analysis["model"],
              "analysis_prompt_version": analysis["prompt_version"],
              "analysis_summary": analysis["summary"],
              "ghcr_package": package,
              "version_tag": tag,
              "stable_tag": f"class6-{slug}-latest",
              "bundle_tar_sha256": digest,
              "publication_allowed": False,
              "review_required": True,
          }
          (out / "bundle-index.v1.json").write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out/visual-inventory.v1.json" "$out/visual-analysis.v1.json" "$out/bundle-index.v1.json"
          git diff --cached --quiet || git commit -m "Checkpoint textbook visual analysis: $BOOK_SLUG"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload run summary
        if: always()
        run: |
          {
            echo "## Textbook visual analysis"
            echo "- Book slug: `$BOOK_SLUG`"
            echo "- Source image: `ghcr.io/manav326/quantaedge-textbooks-class-$CLASS_NO-$LANGUAGE:latest`"
            echo "- Book ID: `$BOOK_ID`"
            echo "- Model: `$VISION_MODEL`"
            echo "- Visual bundle: `${VISUAL_PACKAGE:-not-published}`"
            echo "- Version tag: `${VISUAL_VERSION_TAG:-not-published}`"
            echo "- Bundle SHA-256: `${VISUAL_SHA256:-not-published}`"
            if [[ -f "data/textbook-visuals/$BOOK_SLUG/visual-analysis.v1.json" ]]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("data/textbook-visuals") / os.environ["BOOK_SLUG"] / "visual-analysis.v1.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"- Analyzed: {d['summary']['assets_analyzed']}")
          print(f"- Failed: {d['summary']['assets_failed']}")
          print(f"- Skipped from checkpoint: {d['summary']['assets_skipped_from_checkpoint']}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
