name: Android Play Store release bundle

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Deployed HTTPS QuantaEdge API base URL
        required: true
        default: https://qe.thinkwithsujeet.in/
        type: string
      version_code:
        description: Positive integer greater than the latest code in Play Console
        required: true
        default: "1"
        type: string
      version_name:
        description: User-visible app version
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: quantaedge-android-play-release
  cancel-in-progress: false

jobs:
  release:
    name: Test and build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Python for store asset preparation
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate and configure upload signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS repository secret."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD repository secret."; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/quantaedge-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "::error::Decoded upload keystore is empty."; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Generate 512 × 512 Google Play product icon
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python apps/android/scripts/prepare_play_store_icon.py --output apps/android/build/play-store-icon-512.png

      - name: Run Android unit tests
        run: gradle -p apps/android testDebugUnitTest --no-daemon --build-cache

      - name: Build signed, optimized Play Store bundle
        env:
          QUANTAEDGE_API_BASE_URL: ${{ inputs.api_base_url }}
          QUANTAEDGE_VERSION_CODE: ${{ inputs.version_code }}
          QUANTAEDGE_VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android bundleRelease \
            -PquantaedgeApiBaseUrl="$QUANTAEDGE_API_BASE_URL" \
            -PquantaedgeVersionCode="$QUANTAEDGE_VERSION_CODE" \
            -PquantaedgeVersionName="$QUANTAEDGE_VERSION_NAME" \
            --no-daemon --build-cache

      - name: Upload Play Store release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-play-store-release-${{ inputs.version_name }}
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
            apps/android/build/play-store-icon-512.png
          if-no-files-found: error
          retention-days: 30
