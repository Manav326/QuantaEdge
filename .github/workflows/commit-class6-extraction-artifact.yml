name: Mirror verified textbook extraction artifact to main

on:
  workflow_dispatch:
    inputs:
      class_no:
        description: "Class whose verified extraction artifact should be committed"
        type: choice
        options: ["6", "7", "8"]
        default: "6"
        required: true
      source_run_id:
        description: "Successful textbook extraction workflow run ID"
        type: string
        default: "38579506350"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: mirror-textbook-extraction-artifact
  cancel-in-progress: false

jobs:
  commit-extraction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download selected class extraction artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CLASS_NO: ${{ inputs.class_no }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          artifact_name="quantaedge-textbook-extraction-pilot-class-${CLASS_NO}-${SOURCE_RUN_ID}"
          if [ "${SOURCE_RUN_ID}" = "38579506350" ] && [ "${CLASS_NO}" = "6" ]; then
            artifact_name="quantaedge-textbook-extraction-pilot-class-6-38579506350"
          fi
          echo "Downloading ${artifact_name} from run ${SOURCE_RUN_ID}"
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact_name}" \
            --dir "${RUNNER_TEMP}/quantaedge-textbook-artifact"

      - name: Validate and copy source-bound extraction files
        env:
          CLASS_NO: ${{ inputs.class_no }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          artifact_root="${RUNNER_TEMP}/quantaedge-textbook-artifact"
          source_root="${artifact_root}/extracted/class-${CLASS_NO}"
          test -d "${source_root}/english/pages"
          test -d "${source_root}/hindi/pages"

          for medium in english hindi; do
            python scripts/validate_textbook_extraction_artifacts.py \
              --registry-index "${artifact_root}/cache/class-${CLASS_NO}/${medium}/index.json" \
              --extraction-dir "${source_root}/${medium}" \
              --class-no "${CLASS_NO}" \
              --language "${medium}"
          done

          mkdir -p data/textbook-extractions
          rm -rf "data/textbook-extractions/class-${CLASS_NO}"
          cp -R "${source_root}" "data/textbook-extractions/class-${CLASS_NO}"
          mkdir -p data/textbook-extractions/reports
          cp "${artifact_root}/reports/"*.json data/textbook-extractions/reports/ 2>/dev/null || true
          cat > data/textbook-extractions/README.md <<'EOF'
          # Textbook extraction artifacts

          Verified class-wise whole-book extracted page text, manifests and reports are committed here so a normal git pull updates the local checkout. Original source PDFs remain in GHCR. These are draft extraction artifacts only, not approved or published lessons/questions. Source-bound chapter mapping and human review are required before generation/import/publication.
          EOF
          printf 'Mirrored class %s from workflow run %s\n' "${CLASS_NO}" "${SOURCE_RUN_ID}" > "data/textbook-extractions/class-${CLASS_NO}/MIRROR-SOURCE.txt"

      - name: Commit extracted text to main
        env:
          CLASS_NO: ${{ inputs.class_no }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/textbook-extractions
          if git diff --cached --quiet; then
            echo "Extraction artifacts already match main; no commit required."
            exit 0
          fi
          git commit -m "Add verified Class ${CLASS_NO} textbook extraction artifacts"
          git push origin HEAD:main
