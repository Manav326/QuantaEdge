name: Generate API-key-free AI training dataset

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Number of synthetic curriculum-aligned draft examples"
        required: true
        default: "25000"

permissions:
  contents: write

concurrency:
  group: qe-textbook-pipeline-state-global
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application code from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Restore isolated textbook and AI dataset state
        env:
          QUANTAEDGE_TEXTBOOK_STATE_BRANCH: automation/textbook-pipeline-state
        run: python scripts/persist_textbook_pipeline_state.py restore --repo-root "$GITHUB_WORKSPACE"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate deterministic draft dataset without API credentials
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.target || '25000' }}"
          python scripts/ai_training_offline_seed.py --target "$TARGET" --output-dir data/ai-training/datasets
      - name: Validate dataset and split integrity
        shell: bash
        env:
          EXPECTED_TARGET: ${{ github.event.inputs.target || '25000' }}
        run: |
          python scripts/ai_training_dataset.py validate --dataset-dir data/ai-training/datasets
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/ai-training/datasets")
          master = [json.loads(x) for x in (root / "dataset_master.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          expected = int(__import__("os").environ["EXPECTED_TARGET"])
          assert len(master) == expected, f"Expected {expected} records, found {len(master)}"
          assert len({x["example_id"] for x in master}) == len(master), "Duplicate IDs found"
          assert all(x["metadata"]["provenance_type"] == "synthetic_curriculum_alignment" for x in master)
          print(f"Verified {len(master)} unique records; no source PDF pages/hashes were fabricated.")
          PY
      - name: Persist generated dataset on isolated state branch
        env:
          QUANTAEDGE_TEXTBOOK_STATE_BRANCH: automation/textbook-pipeline-state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/persist_textbook_pipeline_state.py commit \
            --repo-root "$GITHUB_WORKSPACE" \
            --message "data(ai): add API-key-free curriculum-aligned draft examples" \
            --paths data/ai-training/datasets
          echo "Dataset persisted to automation/textbook-pipeline-state; application main remains unchanged."
