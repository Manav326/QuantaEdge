name: One-time dispatch — resume visual Layers 4–5 for Classes 7–8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-visual-layers-4-5-classes-7-8.yml"

permissions:
  contents: write
  packages: write

jobs:
  resume:
    name: Resume Class ${{ matrix.class_no }} visual Layers 4–5
    strategy:
      fail-fast: false
      matrix:
        class_no: ["7", "8"]
    uses: ./.github/workflows/textbook-visual-candidates-v3.yml
    with:
      class_no: ${{ matrix.class_no }}
      analysis_mode: resume_layers_4_5
      vision_model: qwen2.5vl:3b
      checkpoint_batch_size: "1"
    secrets: inherit
