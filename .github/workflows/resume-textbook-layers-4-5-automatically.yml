name: Resume Class 6–8 Layer 4–5 checkpoints

on:
  workflow_dispatch:
    inputs:
      class_no:
        description: "Resume all incomplete classes or one selected class"
        type: choice
        options: ["all", "6", "7", "8"]
        default: "all"
        required: true
      source_run_id:
        description: "Completed processing run that requested this continuation"
        type: string
        default: ""
        required: false

permissions:
  actions: write
  contents: write

concurrency:
  group: textbook-layer45-resume-coordinator
  cancel-in-progress: false

jobs:
  inspect-and-resume:
    name: Reconcile isolated textbook state and dispatch one continuation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout application code from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Restore isolated textbook pipeline state
        env:
          QUANTAEDGE_TEXTBOOK_STATE_BRANCH: automation/textbook-pipeline-state
        run: python scripts/persist_textbook_pipeline_state.py restore --repo-root "$GITHUB_WORKSPACE"

      - name: Validate state and find exact pending bilingual pairs
        id: plan
        env:
          CLASS_SCOPE: ${{ inputs.class_no || 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          control="data/textbook-content-pipeline/resume-control.v1.json"
          if [[ ! -s "$control" ]]; then
            echo "::error::Missing Layer 4–5 resume-control.v1.json in the isolated state branch."
            exit 2
          fi
          python - "$control" "$CLASS_SCOPE" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          control_path=Path(sys.argv[1])
          scope=sys.argv[2]
          output=Path(sys.argv[3])
          state=json.loads(control_path.read_text(encoding="utf-8"))
          if state.get("schema_version")!="quantaedge.textbook-layer45-resume-control.v1":
              raise SystemExit("Layer 4–5 resume control schema mismatch.")
          if state.get("classes") != [6,7,8]:
              raise SystemExit("Layer 4–5 resume control must cover Classes 6, 7 and 8.")
          if state.get("active") is not True:
              print("::notice::Layer 4–5 continuation is inactive; nothing to dispatch.")
              with output.open("a",encoding="utf-8") as f: f.write("active=false\n")
              raise SystemExit(0)
          if scope not in {"all","6","7","8"}:
              raise SystemExit(f"Unsupported class scope {scope!r}.")
          with output.open("a",encoding="utf-8") as f: f.write("active=true\n")
          PY

          active="$(grep '^active=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          if [[ "$active" != "true" ]]; then
            echo "No active Layer 4–5 continuation."
            exit 0
          fi

          all_pairs="$(python scripts/plan_textbook_layer45_matrix.py \
            --event-name workflow_dispatch \
            --class-no all \
            --analysis-mode resume_layers_4_5)"
          selected_pairs="$(python - "$all_pairs" "$CLASS_SCOPE" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          rows=data.get("include",[])
          scope=sys.argv[2]
          all_pending=len(rows)
          selected=[row for row in rows if scope=="all" or row["class_no"]==scope]
          print(json.dumps({"all_pending_pairs":all_pending,"selected_pairs":selected},separators=(",",":")))
          PY
          )"
          python - "$selected_pairs" "$RUNNER_TEMP/pending-pairs.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          from pathlib import Path
          value=json.loads(sys.argv[1])
          Path(sys.argv[2]).write_text(json.dumps(value["selected_pairs"],ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with Path(sys.argv[3]).open("a",encoding="utf-8") as f:
              f.write(f"all_pending_pairs={value['all_pending_pairs']}\n")
              f.write(f"selected_pending_pairs={len(value['selected_pairs'])}\n")
          print(json.dumps({
              "all_pending_pairs":value["all_pending_pairs"],
              "selected_pending_pairs":len(value["selected_pairs"]),
              "selected_book_pair_ids":[row["book_pair_id"] for row in value["selected_pairs"]],
          },ensure_ascii=False))
          PY

      - name: Avoid duplicate worker runs without cancelling any active work
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/textbook-visual-candidates-v3.yml/runs?branch=main&per_page=100" \
            -o "$RUNNER_TEMP/layer45-runs.json"
          python - "$RUNNER_TEMP/layer45-runs.json" "$SOURCE_RUN_ID" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          data=json.loads(open(sys.argv[1],encoding="utf-8").read())
          source_run=sys.argv[2].strip()
          active=[
              row for row in data.get("workflow_runs",[])
              if row.get("status") in {"queued","in_progress","requested","pending"}
              and str(row.get("id","")) != source_run
          ]
          with open(sys.argv[3],"a",encoding="utf-8") as out:
              out.write(f"active_worker_runs={len(active)}\n")
          for row in active:
              print(f"Active worker run preserved: id={row.get('id')} status={row.get('status')} created={row.get('created_at')}")
          if active:
              print("::notice::Another textbook worker run is active or queued. No duplicate run will be dispatched; no run was cancelled.")
          PY

      - name: Record global completion only when all eight pairs are complete
        if: steps.plan.outputs.active == 'true' && steps.plan.outputs.all_pending_pairs == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/data/textbook-content-pipeline/resume-control.v1.json" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          path=Path(sys.argv[1])
          state=json.loads(path.read_text(encoding="utf-8"))
          state["active"]=False
          state["status"]="COMPLETE"
          state["completed_at"]=datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          python scripts/persist_textbook_pipeline_state.py commit \
            --repo-root "$GITHUB_WORKSPACE" \
            --message "status(content): all Class 6-8 bilingual Layer 5 pairs complete" \
            --paths data/textbook-content-pipeline/resume-control.v1.json
          echo "All eight bilingual pairs have valid source-bound Layer 5 ledgers. Global continuation is disabled."

      - name: Dispatch one exact-scope bilingual resume
        if: >-
          steps.plan.outputs.active == 'true' &&
          steps.plan.outputs.selected_pending_pairs != '0' &&
          steps.active.outputs.active_worker_runs == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CLASS_SCOPE: ${{ inputs.class_no || 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python - "$CLASS_SCOPE" <<'PY'
          import json,sys
          print(json.dumps({
              "ref":"main",
              "inputs":{
                  "class_no":sys.argv[1],
                  "analysis_mode":"resume_layers_4_5",
                  "vision_model":"qwen2.5vl:3b",
                  "checkpoint_batch_size":"10"
              }
          },separators=(",",":")))
          PY
          )"
          code="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS \
            -o "$RUNNER_TEMP/dispatch.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/textbook-visual-candidates-v3.yml/dispatches" \
            -d "$payload")"
          if [[ "$code" != "204" ]]; then
            cat "$RUNNER_TEMP/dispatch.json"
            echo "::error::Layer 4–5 resume dispatch failed (HTTP $code)."
            exit 1
          fi
          echo "Dispatched one resume run for scope $CLASS_SCOPE with 10-asset checkpoints."
