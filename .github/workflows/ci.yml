name: QuantaEdge Build and Publish

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: quantaedge-ci-${{ github.ref }}
  # Cancel stale PR validation, but let main-branch verification finish.
  # The newest pending main run will validate the final commit after the active run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      admin: ${{ steps.detect.outputs.admin }}
      people: ${{ steps.detect.outputs.people }}
      content: ${{ steps.detect.outputs.content }}
      images: ${{ steps.detect.outputs.images }}
      android: ${{ steps.detect.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for localization route inventory
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test UI route inventory generator
        run: node --test scripts/inventory_ui_routes.test.mjs

      - name: Test contextual UI copy quality audit
        run: node --test scripts/audit-ui-copy-quality.test.mjs

      - name: Generate contextual UI copy quality report
        run: node scripts/audit-ui-copy-quality.mjs --json "$RUNNER_TEMP/ui-copy-quality-audit.json"

      - name: Generate machine-readable UI route inventory
        run: node scripts/inventory_ui_routes.mjs --output "$RUNNER_TEMP/ui-localization-route-inventory.json"

      - name: Test generated UI route register parity
        run: node --test scripts/check_ui_route_register_parity.test.mjs

      - name: Enforce generated UI route register parity
        run: node scripts/check_ui_route_register_parity.mjs --root .

      - name: Test route to component source graph
        run: node --test scripts/inventory_ui_component_imports.test.mjs

      - name: Generate machine-readable route/component source graph
        run: node scripts/inventory_ui_component_imports.mjs --output "$RUNNER_TEMP/ui-component-import-inventory.json"

      - name: Test expanded route/component source audit register
        run: node --test scripts/build_ui_component_audit_register.test.mjs

      - name: Generate expanded route/component source audit registers
        run: node scripts/build_ui_component_audit_register.mjs --root . --graph "$RUNNER_TEMP/ui-component-import-inventory.json" --component-output "$RUNNER_TEMP/ui-component-source-audit-register.csv" --route-output "$RUNNER_TEMP/ui-route-component-audit-register.csv"

      - name: Verify Admin shared-workspace shell contract
        run: node scripts/check_admin_nested_shell_contract.mjs

      - name: Test QA register validator
        run: node --test scripts/validate_qa_registers.test.mjs

      - name: Validate cross-register QA documentation
        run: node scripts/validate_qa_registers.mjs --root .

      - name: Upload contextual UI copy quality report
        uses: actions/upload-artifact@v4
        with:
          name: ui-copy-quality-audit
          path: ${{ runner.temp }}/ui-copy-quality-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload UI localization route inventory
        uses: actions/upload-artifact@v4
        with:
          name: ui-localization-route-inventory
          path: ${{ runner.temp }}/ui-localization-route-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce data-only storage for generated pipeline artifacts
        run: python scripts/validate_pipeline_data_locations.py --repo-root .

      - name: Verify centralized UI localization catalogs and app copies
        run: python3 scripts/sync_ui_localization.py --check

      - name: Verify centralized static copy on migrated web routes
        run: node scripts/check-web-static-copy.mjs

      - name: Verify Admin certificates localization coverage
        run: node scripts/check-admin-certificates-i18n.mjs

      - name: Verify Admin questions localization coverage
        run: node scripts/check-admin-questions-i18n.mjs

      - name: Verify Admin assessments localization coverage
        run: node scripts/check-admin-assessments-i18n.mjs
      - name: Verify Admin classes localization coverage
        run: node scripts/check-admin-classes-i18n.mjs

      - name: Verify Admin source-ingestion localization coverage
        run: node scripts/check-admin-source-ingestion-i18n.mjs

      - name: Verify Admin textbook resource localization coverage
        run: node scripts/check-admin-resources-i18n.mjs

      - name: Verify cross-app UI and brand contract
        run: node scripts/check-ui-brand-contract.mjs

      - name: Verify global notification reliability contract
        run: node scripts/check-global-notification-contract.mjs

      - name: Verify rich notification platform contract
        run: node scripts/check-rich-notification-contract.mjs
      
      - name: Verify HRMS form save and view-first UX contract
        run: node scripts/check-hrms-form-save-contract.mjs

      - name: Verify white-label colour theme contract
        run: node scripts/check-color-theme-contract.mjs

      - name: Detect changed paths
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            files="$(git ls-files)"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base="$(git merge-base HEAD "origin/$BASE_REF")"
            files="$(git diff --name-only "$base" HEAD)"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          else
            files="$(git ls-files)"
          fi

          api=false
          web=false
          admin=false
          people=false
          content=false
          images=false
          android=false
          printf '%s\n' "$files"

          # The production compose file uses one shared image tag for all four services.
          # When any service image input changes, build all four at that source SHA so
          # deploy can consume one coherent, exact image set. Data-only changes do not
          # create a new image tag and must not trigger application image builds.
          if printf '%s\n' "$files" | grep -qE '^(services/api/|apps/web/|apps/admin/|apps/people/|data/structured-lessons/|scripts/package_published_structured_lessons\.py$|\.dockerignore$|services/api/Dockerfile$|apps/(web|admin|people)/Dockerfile$)'; then
            images=true
          fi
          if [ "$images" = "true" ]; then
            api=true; web=true; admin=true; people=true
          fi

          if printf '%s\n' "$files" | grep -qE '^scripts/|^tests/|^\.github/workflows/|^data/'; then content=true; fi
          if printf '%s\n' "$files" | grep -qE '^(apps/android/|gradle/|gradle\.properties$|settings\.gradle\.kts$|build\.gradle\.kts$)'; then android=true; fi
          # Workflow definition and image-context changes require the content/import
          # contracts as well as the affected application validation.
          if printf '%s\n' "$files" | grep -qE '^(services/api/|apps/web/|apps/admin/|apps/people/)'; then content=true; fi

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "people=$people" >> "$GITHUB_OUTPUT"
          echo "content=$content" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "images_built_this_run=$images" >> "$GITHUB_OUTPUT"

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    environment:
      name: ${{ github.event_name == 'pull_request' && 'ci' || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's legacy default requests the removed SDK package "tools".
          # Install only current SDK packages needed by this compileSdk 36 project.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Configure stable signing for the installable APK
        id: signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" && -z "$ANDROID_KEYSTORE_PASSWORD" && -z "$ANDROID_KEY_ALIAS" && -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No stable Android signing key is configured in the production environment. Tests will run, but no installable APK will be published; an ephemeral runner debug certificate cannot provide reliable Google sign-in."
            exit 0
          fi
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 production secret."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD production secret."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS production secret."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD production secret."; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/quantaedge-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "::error::Decoded Android signing keystore is empty."; exit 1; }
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Verify structured lesson UI contract
        run: node scripts/check-structured-lesson-ui-contract.mjs
      - name: Verify Android UI localization contract
        run: node scripts/check-android-ui-localization.mjs
      - name: Run Android unit tests and build debug APK for verification
        env:
          QUANTAEDGE_API_BASE_URL: ${{ vars.QUANTAEDGE_LOCAL_API_BASE_URL || 'http://192.168.31.47:8080/' }}
          QUANTAEDGE_FIREBASE_PROJECT_ID: ${{ vars.QUANTAEDGE_FIREBASE_PROJECT_ID }}
          QUANTAEDGE_FIREBASE_APPLICATION_ID: ${{ vars.QUANTAEDGE_FIREBASE_APPLICATION_ID }}
          QUANTAEDGE_FIREBASE_API_KEY: ${{ vars.QUANTAEDGE_FIREBASE_API_KEY }}
          QUANTAEDGE_FIREBASE_SENDER_ID: ${{ vars.QUANTAEDGE_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          test -n "$QUANTAEDGE_API_BASE_URL" || { echo "::error::Android API base URL is not configured."; exit 1; }
          gradle -p apps/android testDebugUnitTest assembleDebug \
            -PquantaedgeFirebaseProjectId="$QUANTAEDGE_FIREBASE_PROJECT_ID" \
            -PquantaedgeFirebaseApplicationId="$QUANTAEDGE_FIREBASE_APPLICATION_ID" \
            -PquantaedgeFirebaseApiKey="$QUANTAEDGE_FIREBASE_API_KEY" \
            -PquantaedgeFirebaseSenderId="$QUANTAEDGE_FIREBASE_SENDER_ID" \
            --no-daemon --build-cache
      - name: Build stable signed installable APK for local network
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          QUANTAEDGE_API_BASE_URL: ${{ vars.QUANTAEDGE_LOCAL_API_BASE_URL || 'http://192.168.31.47:8080/' }}
          QUANTAEDGE_FIREBASE_PROJECT_ID: ${{ vars.QUANTAEDGE_FIREBASE_PROJECT_ID }}
          QUANTAEDGE_FIREBASE_APPLICATION_ID: ${{ vars.QUANTAEDGE_FIREBASE_APPLICATION_ID }}
          QUANTAEDGE_FIREBASE_API_KEY: ${{ vars.QUANTAEDGE_FIREBASE_API_KEY }}
          QUANTAEDGE_FIREBASE_SENDER_ID: ${{ vars.QUANTAEDGE_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          gradle -p apps/android assembleLocal \
            -PquantaedgeApiBaseUrl="$QUANTAEDGE_API_BASE_URL" \
            -PquantaedgeFirebaseProjectId="$QUANTAEDGE_FIREBASE_PROJECT_ID" \
            -PquantaedgeFirebaseApplicationId="$QUANTAEDGE_FIREBASE_APPLICATION_ID" \
            -PquantaedgeFirebaseApiKey="$QUANTAEDGE_FIREBASE_API_KEY" \
            -PquantaedgeFirebaseSenderId="$QUANTAEDGE_FIREBASE_SENDER_ID" \
            --no-daemon --build-cache
      - name: Upload stable installable APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-android-apk-stable
          path: apps/android/app/build/outputs/apk/local/app-local.apk
          if-no-files-found: error
          retention-days: 14
      - name: Explain unavailable installable APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured != 'true'
        shell: bash
        run: |
          {
            echo "## Installable Android APK not published"
            echo
            echo "The debug build passed compile/unit tests, but the stable signing keystore is not configured in the production Actions environment."
            echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD before relying on Google sign-in in a downloadable APK."
            echo "No ephemeral debug-signed APK was published under the installable artifact name."
          } >> "$GITHUB_STEP_SUMMARY"

  validate-content-import:
    name: Content import safeguards
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.content == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install textbook PDF test dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2" "Pillow>=10,<13"
      - name: Validate reviewed-content import safeguards
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Dry-run TRE-4 extraction, source identity, and database-import plan
        run: python scripts/import_tre4_course.py --archive data/TRE-4_PYQ.zip
      - name: Validate canonical structured lessons against runtime and DB keys
        run: |
          python scripts/validate_structured_lesson_artifacts.py \
            --repo-root . \
            --index data/structured-lessons/class-6/science/production-index.v1.json \
            --json-report /tmp/quantaedge-structured-lesson-schema-report.json

  validate-api:
    name: API verification
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quantaedge
          POSTGRES_USER: quantaedge
          POSTGRES_PASSWORD: quantaedge-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantaedge -d quantaedge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/quantaedge
      SPRING_DATASOURCE_USERNAME: quantaedge
      SPRING_DATASOURCE_PASSWORD: quantaedge-test
      APP_DEMO_SEED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install deterministic certificate fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core
          fc-cache -f
          fc-match --format='%{family}\n' 'Noto Sans Devanagari' | grep -qi 'Noto Sans Devanagari'
      - name: Create isolated QA lifecycle database
        env:
          PGPASSWORD: quantaedge-test
        run: createdb -h localhost -U quantaedge quantaedge_qa

      # Run the entire API verification suite, including course, assessment and tenant-scope
      # integration cases. Do not exclude migrated-contract tests to obtain a green build.
      - name: Run API tests and verification (full course scope enabled)
        working-directory: services/api
        run: mvn -B -ntp verify -Dqe.qa.lifecycle.integration=true

  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'ci' || 'production' }}
    needs: [changes, validate-api]
    if: needs.changes.outputs.api == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantaedge-api
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'ci' || 'production' }}
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify structured lesson UI contract
        run: node scripts/check-structured-lesson-ui-contract.mjs
      - name: Verify student navigation contract
        run: node apps/web/scripts/check-student-navigation.mjs
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantaedge-web
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_EDUCATION_ADMIN_ORIGIN=${{ vars.NEXT_PUBLIC_EDUCATION_ADMIN_ORIGIN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-admin:
    name: Build admin image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantaedge-admin
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build admin
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  build-people:
    name: Build People Operations image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.people == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js for UI contract checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify People Operations UI contract
        run: node apps/people/scripts/check-ui-contract.mjs
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantaedge-people
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build People Operations
        uses: docker/build-push-action@v6
        with:
          context: ./apps/people
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_EDUCATION_ADMIN_ORIGIN=${{ vars.NEXT_PUBLIC_EDUCATION_ADMIN_ORIGIN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=people
          cache-to: type=gha,mode=max,scope=people


  production-release-evidence:
    name: Record exact tested commit and verified image source
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-android-apk
      - validate-content-import
      - validate-api
      - build-api
      - build-web
      - build-admin
      - build-people
    if: >-
      github.event_name == 'push' &&
      always() &&
      needs.changes.result == 'success' &&
      (needs.build-android-apk.result == 'success' || needs.build-android-apk.result == 'skipped') &&
      (needs.validate-content-import.result == 'success' || needs.validate-content-import.result == 'skipped') &&
      (needs.validate-api.result == 'success' || needs.validate-api.result == 'skipped') &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-admin.result == 'success' || needs.build-admin.result == 'skipped') &&
      (needs.build-people.result == 'success' || needs.build-people.result == 'skipped')
    steps:
      - name: Checkout exact tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve coherent image source commit
        id: image-source
        env:
          IMAGES_BUILT: ${{ needs.changes.outputs.images }}
          TESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IMAGES_BUILT" == "true" ]]; then
            image_source_sha="$TESTED_SHA"
          else
            image_source_sha="$(git log -1 --format=%H "$TESTED_SHA" -- \
              services/api \
              apps/web \
              apps/admin \
              apps/people \
              data/structured-lessons \
              scripts/package_published_structured_lessons.py \
              .dockerignore)"
          fi
          [[ "$image_source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve the source commit for the production image set."
            exit 2
          }
          echo "sha=$image_source_sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$image_source_sha" >> "$GITHUB_OUTPUT"

      - name: Validate coherent image build set
        env:
          IMAGES_BUILT: ${{ needs.changes.outputs.images }}
          API_RESULT: ${{ needs.build-api.result }}
          WEB_RESULT: ${{ needs.build-web.result }}
          ADMIN_RESULT: ${{ needs.build-admin.result }}
          PEOPLE_RESULT: ${{ needs.build-people.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IMAGES_BUILT" == "true" ]]; then
            for result in "$API_RESULT" "$WEB_RESULT" "$ADMIN_RESULT" "$PEOPLE_RESULT"; do
              [[ "$result" == "success" ]] || {
                echo "::error::All four service images must succeed for a new production image source SHA."
                exit 1
              }
            done
          fi

      - name: Authenticate to GHCR before releasing evidence
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all four production image manifests exist for the evidence SHA
        env:
          IMAGE_TAG: ${{ steps.image-source.outputs.image_tag }}
          GHCR_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          for service in api web admin people; do
            image="ghcr.io/$owner/quantaedge-$service:$IMAGE_TAG"
            echo "Verifying $image"
            docker manifest inspect "$image" >/dev/null
          done

      - name: Write immutable production release evidence
        env:
          TESTED_SHA: ${{ github.sha }}
          IMAGE_SOURCE_SHA: ${{ steps.image-source.outputs.sha }}
          IMAGE_TAG: ${{ steps.image-source.outputs.image_tag }}
          IMAGES_BUILT: ${{ needs.changes.outputs.images }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          API_BUILD: ${{ needs.build-api.result }}
          WEB_BUILD: ${{ needs.build-web.result }}
          ADMIN_BUILD: ${{ needs.build-admin.result }}
          PEOPLE_BUILD: ${{ needs.build-people.result }}
          API_TESTS: ${{ needs.validate-api.result }}
          CONTENT_CHECKS: ${{ needs.validate-content-import.result }}
          ANDROID_CHECKS: ${{ needs.build-android-apk.result }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-release-evidence"
          python - "$RUNNER_TEMP/production-release-evidence/production-release-evidence.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          repository=os.environ["REPOSITORY"]
          owner,_=repository.split("/",1)
          tag=os.environ["IMAGE_TAG"]
          tested=os.environ["TESTED_SHA"]
          image_source=os.environ["IMAGE_SOURCE_SHA"]
          evidence={
              "schema_version":"quantaedge.production-release-evidence.v1",
              "tested_commit_sha":tested,
              "image_source_commit_sha":image_source,
              "image_tag":tag,
              "images_built_this_run":os.environ["IMAGES_BUILT"]=="true",
              "images":{
                  "api":f"ghcr.io/{owner.lower()}/quantaedge-api:{tag}",
                  "web":f"ghcr.io/{owner.lower()}/quantaedge-web:{tag}",
                  "admin":f"ghcr.io/{owner.lower()}/quantaedge-admin:{tag}",
                  "people":f"ghcr.io/{owner.lower()}/quantaedge-people:{tag}",
              },
              "workflow":{
                  "repository":repository,
                  "run_id":int(os.environ["RUN_ID"]),
                  "run_attempt":int(os.environ["RUN_ATTEMPT"]),
                  "run_url":f"https://github.com/{repository}/actions/runs/{os.environ['RUN_ID']}",
                  "event":"push",
              },
              "checks":{
                  "api":os.environ["API_TESTS"],
                  "content":os.environ["CONTENT_CHECKS"],
                  "android":os.environ["ANDROID_CHECKS"],
                  "api_image":os.environ["API_BUILD"],
                  "web_image":os.environ["WEB_BUILD"],
                  "admin_image":os.environ["ADMIN_BUILD"],
                  "people_image":os.environ["PEOPLE_BUILD"],
              },
              "status":"PASS",
          }
          if len(tested)!=40 or len(image_source)!=40:
              raise SystemExit("Release evidence requires full 40-character Git object IDs.")
          Path(sys.argv[1]).write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"tested_commit_sha":tested,"image_source_commit_sha":image_source,
                            "image_tag":tag,"images_built_this_run":evidence["images_built_this_run"]}))
          PY

      - name: Upload exact-commit production release evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-release-evidence
          path: ${{ runner.temp }}/production-release-evidence/production-release-evidence.json
          if-no-files-found: error
          retention-days: 90
