name: Resume Class 6–8 Layer 4–5 checkpoints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resume-textbook-layers-4-5-automatically.yml"
      - "data/textbook-content-pipeline/resume-control.v1.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "Process Class 6–8 Textbooks in English and Hindi"
      - "Prepare textbook visual candidates v3 (additive)"
      - "Mirror verified textbook extraction artifact to main"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: textbook-layer45-resume-coordinator
  cancel-in-progress: false

jobs:
  inspect-and-resume:
    name: Resume only classes that still need Layer 5 work
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Generate class-wise and bilingual subject-pair progress report
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/report_textbook_pair_progress.py
          python -m unittest discover -s tests -p "test_report_textbook_pair_progress.py" -v
          python scripts/report_textbook_pair_progress.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --json-out "$RUNNER_TEMP/textbook-progress.v1.json" \
            --markdown-out "$RUNNER_TEMP/textbook-progress.md"
          cat "$RUNNER_TEMP/textbook-progress.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload class-wise and bilingual-pair progress reports
        uses: actions/upload-artifact@v4
        with:
          name: class-6-8-bilingual-textbook-progress
          path: |
            ${{ runner.temp }}/textbook-progress.v1.json
            ${{ runner.temp }}/textbook-progress.md
          if-no-files-found: error
          retention-days: 14

      - name: Reconcile active runs and dispatch checkpoint resumes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" && "$TRIGGER_WORKFLOW_NAME" == "Mirror verified textbook extraction artifact to main" && "$TRIGGER_CONCLUSION" != "success" ]]; then
            echo "Extraction mirror did not succeed; retaining checkpoint state without dispatching against stale sources."
            exit 0
          fi
          control="data/textbook-content-pipeline/resume-control.v1.json"
          if [[ ! -f "$control" ]]; then
            echo "No Layer 4–5 continuation control is present."
            exit 0
          fi
          active="$(python - "$control" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("true" if d.get("schema_version")=="quantaedge.textbook-layer45-resume-control.v1" and d.get("active") is True and d.get("classes")==[6,7,8] else "false")
          PY
          )"
          if [[ "$active" != "true" ]]; then
            echo "Layer 4–5 automatic continuation is inactive."
            exit 0
          fi

          curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/textbook-visual-candidates-v3.yml/runs?branch=main&per_page=100" \
            -o "$RUNNER_TEMP/layer45-runs.json"
          active_run_ids="$(python - "$RUNNER_TEMP/layer45-runs.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          rows=d.get("workflow_runs",[])
          active=[r for r in rows if r.get("status") in {"queued","in_progress","requested"} and r.get("head_branch")=="main"]
          for r in active:
              print(r.get("id",""))
          PY
          )"
          printf '%s\n' "$active_run_ids"
          active_count="$(grep -cE '^[0-9]+$' <<< "$active_run_ids" || true)"
          active_classes=""
          if [[ "$active_count" -gt 0 ]]; then
            stale_cancelled=false
            while IFS= read -r run_id; do
              [[ "$run_id" =~ ^[0-9]+$ ]] || continue
              curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                -o "$RUNNER_TEMP/layer45-jobs-$run_id.json"
              run_classes="$(python - "$RUNNER_TEMP/layer45-jobs-$run_id.json" <<'PY'
          import json,re,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          for job in data.get("jobs",[]):
              match=re.search(r"Class\s+(6|7|8)\s+candidate set",job.get("name",""))
              if match:
                  print(match.group(1))
          PY
              )"
              while IFS= read -r class_no; do
                [[ "$class_no" =~ ^[678]$ ]] || continue
                if [[ " $active_classes " != *" $class_no "* ]]; then
                  active_classes="${active_classes:+$active_classes }$class_no"
                fi
              done <<< "$run_classes"
              candidates="$(python - "$RUNNER_TEMP/layer45-jobs-$run_id.json" <<'PY'
          import json,re,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          target="Run exhaustive, resumable Layers 4–5 for the selected class"
          for job in data.get("jobs",[]):
              match=re.search(r"Class\s+(6|7|8)\s+candidate set",job.get("name",""))
              if not match or job.get("status") not in {"queued","in_progress"}:
                  continue
              grade=match.group(1)
              step=next((item for item in job.get("steps",[]) if item.get("name")==target),None)
              # Watch the Layer 4–5 step when it has started; otherwise watch the
              # running job from its own start time so a stuck checkout/setup is caught too.
              checkpoint_baseline=(step or {}).get("started_at") if (step or {}).get("status")=="in_progress" else job.get("started_at")
              if checkpoint_baseline:
                  print(f"{grade}\t{checkpoint_baseline}")
          PY
              )"
              if [[ -z "$candidates" ]]; then
                continue
              fi
              all_processing_steps_stale=true
              while IFS=$'\t' read -r class_no step_started_at; do
                [[ "$class_no" =~ ^[678]$ ]] || continue
                curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$GH_REPOSITORY/commits?path=data%2Ftextbook-content-pipeline%2Fclass-$class_no%2Fbooks&per_page=100" \
                  -o "$RUNNER_TEMP/class-$class_no-checkpoints.json"
                stale="$(python - "$RUNNER_TEMP/class-$class_no-checkpoints.json" "$step_started_at" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          started=datetime.fromisoformat(sys.argv[2].replace("Z","+00:00"))
          latest=None
          for item in data if isinstance(data,list) else []:
              commit=item.get("commit") or {}
              message=commit.get("message","")
              if not (message.startswith("checkpoint(content): Layer 4-5 ") or message.startswith("status(content): Layer 5 ")):
                  continue
              stamp=commit.get("committer",{}).get("date") or commit.get("author",{}).get("date")
              if not stamp:
                  continue
              try:
                  at=datetime.fromisoformat(stamp.replace("Z","+00:00"))
              except ValueError:
                  continue
              if at >= started and (latest is None or at > latest):
                  latest=at
          baseline=latest or started
          age=(datetime.now(timezone.utc)-baseline).total_seconds()
          print(f"grade_checkpoint_age_seconds={int(age)}")
          print("true" if age >= 1800 else "false")
          PY
                )"
                if [[ "$stale" != *true ]]; then
                  all_processing_steps_stale=false
                fi
                echo "Class $class_no checkpoint freshness: ${stale//$'\n'/; }"
              done <<< "$candidates"
              if [[ "$all_processing_steps_stale" == "true" ]]; then
                echo "Run $run_id has no class-specific Layer 4–5 checkpoint for at least 30 minutes across its active processing jobs; cancelling this stale runner. The next coordinator pass will resume from saved checkpoints."
                code="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$RUNNER_TEMP/cancel-$run_id.json" -w '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$run_id/cancel")"
                if [[ "$code" != "202" && "$code" != "409" ]]; then
                  echo "Could not safely cancel stale run $run_id (HTTP $code):"
                  cat "$RUNNER_TEMP/cancel-$run_id.json"
                  exit 1
                fi
                stale_cancelled=true
              fi
            done <<< "$active_run_ids"
            if [[ "$stale_cancelled" == "true" ]]; then
              echo "Stale runner cancellation requested. The next coordinator tick will dispatch resume mode from the persisted checkpoints."
              exit 0
            fi
            echo "Active class workflows: ${active_classes:-none}. Existing work will be preserved; checking for any class that still needs a resume."
          fi

          # If source extraction is still running for a class, wait for its validated mirror
          # before dispatching visual analysis. This avoids racing the extraction handoff.
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/textbook-extraction-pilot.yml/runs?branch=main&per_page=100" \
            -o "$RUNNER_TEMP/layer45-extraction-runs.json"
          extraction_run_ids="$(python - "$RUNNER_TEMP/layer45-extraction-runs.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          for run in data.get("workflow_runs",[]):
              if run.get("status") in {"queued","in_progress","requested"} and run.get("head_branch")=="main":
                  print(run.get("id",""))
          PY
          )"
          while IFS= read -r extraction_run_id; do
            [[ "$extraction_run_id" =~ ^[0-9]+$ ]] || continue
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$extraction_run_id/jobs?per_page=100" \
              -o "$RUNNER_TEMP/layer45-extraction-jobs-$extraction_run_id.json"
            extraction_classes="$(python - "$RUNNER_TEMP/layer45-extraction-jobs-$extraction_run_id.json" <<'PY'
          import json,re,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          for job in data.get("jobs",[]):
              match=re.search(r"Extract selected Class\s+(6|7|8)\s+in English and Hindi",job.get("name",""))
              if match and job.get("status") in {"queued","in_progress"}:
                  print(match.group(1))
          PY
            )"
            while IFS= read -r class_no; do
              [[ "$class_no" =~ ^[678]$ ]] || continue
              if [[ " $active_classes " != *" $class_no "* ]]; then
                active_classes="${active_classes:+$active_classes }$class_no"
              fi
              echo "Class $class_no source extraction is still active; postponing visual resume until extraction and mirror verification finish."
            done <<< "$extraction_classes"
          done <<< "$extraction_run_ids"

          pending="$(python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("data/textbook-content-pipeline/resume-control/completed")
          repo=Path.cwd()
          pending=[]
          for grade in (6,7,8):
              p=root/f"class-{grade}.v1.json"
              try:
                  d=json.loads(p.read_text(encoding="utf-8"))
                  evidence=d.get("source_ledgers")
                  complete=(d.get("schema_version")=="quantaedge.textbook-layer45-class-completion.v1" and d.get("class_no")==grade and d.get("status")=="COMPLETE" and isinstance(evidence,list) and bool(evidence))
                  if complete:
                      for item in evidence:
                          rel=Path(str(item.get("ledger_path","")))
                          if rel.is_absolute() or ".." in rel.parts or not rel.parts:
                              complete=False; break
                          ledger_path=repo/rel
                          if not ledger_path.is_file():
                              complete=False; break
                          raw=ledger_path.read_bytes()
                          if hashlib.sha256(raw).hexdigest()!=item.get("ledger_sha256"):
                              complete=False; break
                          ledger=json.loads(raw.decode("utf-8"))
                          summary=ledger.get("summary") or {}
                          identity=ledger.get("source") or {}
                          if (ledger.get("schema_version")!="quantaedge.textbook-coverage-ledger.v1" or ledger.get("ledger_status")!="COMPLETE" or summary.get("unresolved_count")!=0 or identity.get("source_book_id")!=item.get("source_book_id") or str(identity.get("source_pdf_sha256") or "").lower()!=str(item.get("source_pdf_sha256") or "").lower()):
                              complete=False; break
              except (OSError,ValueError,TypeError,json.JSONDecodeError):
                  complete=False
              if not complete: pending.append(str(grade))
          print(" ".join(pending))
          PY
          )"
          if [[ -z "$pending" ]]; then
            python - "$control" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path(sys.argv[1]);d=json.loads(p.read_text(encoding="utf-8"))
          d["active"]=False;d["status"]="COMPLETE";d["completed_at"]=datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$control"
            if ! git diff --cached --quiet; then
              git commit -m "status(content): all Class 6-8 Layer 5 ledgers complete"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            echo "All three classes have durable completion markers; automatic continuation disabled."
            exit 0
          fi

          for class_no in $pending; do
            if [[ " $active_classes " == *" $class_no "* ]]; then
              echo "Class $class_no already has active source extraction or Layer 4–5 work; preserving it and skipping duplicate dispatch."
              continue
            fi
            payload="$(python - "$class_no" <<'PY'
          import json,sys
          print(json.dumps({"ref":"main","inputs":{"class_no":sys.argv[1],"analysis_mode":"resume_layers_4_5","vision_model":"qwen2.5vl:3b","checkpoint_batch_size":"5"}}))
          PY
          )"
            code="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -o "$RUNNER_TEMP/dispatch-$class_no.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/textbook-visual-candidates-v3.yml/dispatches" \
              -d "$payload")"
            if [[ "$code" != "204" ]]; then
              echo "Class $class_no resume dispatch failed (HTTP $code):"
              cat "$RUNNER_TEMP/dispatch-$class_no.json"
              exit 1
            fi
            echo "Dispatched Layer 4–5 checkpoint resume for Class $class_no."
          done
